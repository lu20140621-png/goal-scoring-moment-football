;padding:8px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;cursor:pointer;transition:.2s;box-shadow:0 9px 18px #0006}.card .icon{font-size:27px}.card .name{font-weight:950;font-size:11px}.card .desc{font-size:8px;color:#465048;line-height:1.15}.card.target{outline:4px solid #ffd75b;box-shadow:0 0 0 4px #ffd75b35,0 0 28px #ffd75baa,0 10px 18px #0008;animation:cardFloat .8s ease-in-out infinite alternate;z-index:20}.card.target:before{content:'▼';position:absolute;left:50%;top:-39px;transform:translateX(-50%);font-size:29px;color:#ffd75b;text-shadow:0 3px 8px #000;animation:arrowBounce .55s ease-in-out infinite alternate}.card.target:after{content:attr(data-tip);position:absolute;left:50%;top:-65px;transform:translateX(-50%);background:#ffd75b;color:#211806;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:950;white-space:nowrap}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.teachBtn{position:relative;border:1px solid #527793;background:#143b57;color:#fff;border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer}.teachBtn.target{background:#dfb34c;color:#251b07;border-color:#f1d078;animation:btnPulse 1s infinite}.teachBtn.target:before{content:'↓';position:absolute;left:50%;top:-31px;transform:translateX(-50%);font-size:27px;color:#ffd85f;animation:arrowBounce .7s infinite alternate}.toast{min-height:22px;text-align:center;color:#ffdc76;font-size:12px;font-weight:900;margin-top:6px}.flash{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:50;background:#06131ddd;border:2px solid #ffd75b;border-radius:15px;padding:13px 18px;font-size:22px;font-weight:950;color:#ffd75b;opacity:0;pointer-events:none}.flash.show{animation:flashPlay .8s ease}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:80}.overlay.show{display:flex}.dialog{width:min(560px,100%);background:#0d2940;border:2px solid #dcb14b;border-radius:20px;padding:20px;text-align:center}.dialog h2{color:#f0cf78}.dialogActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.dialogActions a{padding:14px;border-radius:12px;background:#183f5a;color:#fff;text-decoration:none;font-weight:900}.dialogActions a:first-child{background:#dfb34c;color:#211707}

<body><div class="wrap">
<div class="top"><div class="brand">🎓🏈 GOAL-SCORING MOMENT · CASUAL TUTORIAL</div><div><a class="btn" href="casual.html" id="backBtn">← 休闲模式</a> <button class="btn" id="langBtn">中文 / EN</button></div></div>
<div class="board"><div class="players"><div class="playerBox you" id="p0"><b id="youName">你</b><div class="score" id="youScore">🏈 0 / 3</div><div class="cardsCount" id="youCount">5张手牌</div></div><div class="playerBox" id="p1"><b>AI 1</b><div class="score" id="ai1Score">🏈 0 / 3</div><div class="cardsCount">5张手牌</div></div><div class="playerBox" id="p2"><b>AI 2</b><div class="score">🏈 0 / 3</div><div class="cardsCount">5张手牌</div></div></div>
<div class="center"><div><div class="deck" id="deck">🂠</div><div class="deckLabel" id="deckLabel">公共牌库</div></div></div>
<div class="peek" id="peek"><div class="peekCard top">🏈<br>FOOTBALL</div><div class="peekCard">💥<br>TACKLE</div><div class="peekCard">🛡️<br>BLOCK</div></div><div class="peekLabel" id="peekLabel"></div>
<div class="coach"><div class="stepbar" id="stepbar"></div><div class="lessonNo" id="lessonNo"></div><h2 id="lessonTitle"></h2><p id="lessonText"></p><div class="ruleBox" id="ruleBox"></div><div class="resultBox" id="resultBox"></div><div class="flow" id="flow"></div><div class="actions" id="actions"></div><div class="toast" id="toast"></div><div class="handTitle" id="handTitle">你的手牌</div><div class="hand" id="hand"></div></div>

<script>
let lang='zh',step=0;
const cards={RUN:['🏃','RUN'],PASS:['🎯','PASS'],TACKLE:['💥','TACKLE'],INTERCEPTION:['🦅','INTERCEPTION'],BLOCK:['🛡️','BLOCK'],BLITZ:['⚡','BLITZ']};
const desc={zh:{RUN:'本回合额外抽1张',PASS:'看顶部3张后抽最上面1张',TACKLE:'随机拿对方1张功能牌',INTERCEPTION:'取消RUN / PASS / 一次抽牌',BLOCK:'取消INTERCEPTION或TACKLE',BLITZ:'指定玩家立即额外抽1张'},en:{RUN:'Draw 1 extra this turn',PASS:'Look top 3, then draw the top card',TACKLE:'Randomly take 1 action card',INTERCEPTION:'Cancel RUN / PASS / one draw',BLOCK:'Cancel INTERCEPTION or TACKLE',BLITZ:'Make a player draw 1 extra'}};
const copy={zh:[
{t:'1. 先理解目标与开局',x:'这是个人赛，不分红蓝队。你和AI各自争抢🏈。开局每人发5张功能牌，公共牌库里混入1张 FOOTBALL CARD。',r:'胜利条件：第一个累计抽到并成功结算3次 FOOTBALL CARD 的玩家，立即获胜。',res:'注意：FOOTBALL CARD 是牌库中的一张特殊卡，不是手里的普通功能牌。',f:['每人5张','公共牌库','1张FOOTBALL','3个🏈获胜'],button:'开始'},
{t:'2. 一个完整回合怎么走',x:'轮到你时，先看自己的手牌。你可以使用0张或多张功能牌。只要你不想再出功能牌，就进行“正常抽牌”；正常抽牌结算后，你的回合结束。',r:'基础顺序：开始回合 → 可出功能牌 → 正常抽1张 → 回合结束 → 下一位玩家。',res:'RUN / PASS / BLITZ造成的额外抽牌，不会自动取代你的正常结束回合抽牌，除非该效果本身明确结束了回合。',f:['开始回合','功能牌阶段','正常抽1张','回合结束'],button:'看一次正常抽牌'},
{t:'3. 正常抽牌',x:'现在请点击公共牌库。假设你抽到一张普通功能牌 TACKLE。它加入你的手牌，然后你的回合结束。',r:'正常抽牌本身也可以被 INTERCEPTION 取消。被取消后，这一次不抽牌。',res:'如果正常抽牌被取消，这次抽牌就算结束，你的回合也随之结束。',f:['点击牌库','抽到普通牌','加入手牌','回合结束'],deck:true},
{t:'4. RUN：增加一次抽牌机会',x:'现在学习 RUN。RUN 的作用不是看牌，而是让你在本回合额外抽1张。请点击正在跳动的 RUN。',r:'RUN成功生效 → 立即多获得1次抽牌机会；之后你仍然保留正常结束回合的那次抽牌。',res:'所以使用RUN的回合，最多会比普通回合多抽1次。',f:['RUN','额外抽1张','正常抽牌仍保留'],list:['RUN','PASS','BLOCK'],target:'RUN'},
{t:'5. INTERCEPTION 可以取消 RUN',x:'你打出RUN后，AI可以立即用 INTERCEPTION 反应。这里模拟AI使用 INTERCEPTION。请点击 INTERCEPTION，看看结果。',r:'INTERCEPTION 必须在RUN结算前使用。',res:'RUN被取消 → 不获得RUN提供的额外抽牌；但你之后仍然可以进行正常抽牌。',f:['RUN','INTERCEPTION','RUN取消','额外抽牌消失'],list:['INTERCEPTION','BLOCK'],target:'INTERCEPTION'},
{t:'6. BLOCK 可以取消 INTERCEPTION',x:'如果你有BLOCK，可以在INTERCEPTION后立刻反制。请点击BLOCK。',r:'BLOCK可以取消 INTERCEPTION 或 TACKLE。',res:'RUN → INTERCEPTION → BLOCK：INTERCEPTION被取消，RUN恢复生效，你重新获得那1次额外抽牌。',f:['RUN','INTERCEPTION','BLOCK','RUN恢复'],list:['BLOCK','PASS','TACKLE'],target:'BLOCK'},
{t:'7. RUN恢复后，先执行额外抽牌',x:'RUN已经恢复生效。现在点击公共牌库，执行RUN带来的“额外抽1张”。',r:'这是RUN带来的额外抽牌，不是正常结束回合抽牌。',res:'抽完这张后，如果你还想出功能牌可以继续；最后仍要进行一次正常抽牌结束回合。',f:['RUN恢复','额外抽1张','继续功能牌阶段'],deck:true},
{t:'8. PASS：先看顶部3张',x:'接下来学习PASS。请点击PASS。PASS会让你查看公共牌库顶部3张，但绝对不能调整、交换或改变顺序。',r:'PASS = 看顶部3张 → 保持原顺序 → 抽最上面第1张。',res:'PASS不是“看完再选择其中一张”，也不是“把FOOTBALL移到顶部”。',f:['PASS','查看3张','顺序固定','必须抽第1张'],list:['PASS','RUN','TACKLE'],target:'PASS'},
{t:'9. PASS看到3张以后怎么办',x:'现在顶部3张已经翻开：第1张是FOOTBALL，第2张TACKLE，第3张BLOCK。你只能知道它们是什么，不能动顺序。',r:'看完后，PASS要求你立即抽最上面的第1张。',res:'这里最上面刚好是FOOTBALL，所以如果PASS没有被取消，你就会抽到FOOTBALL。',f:['看到3张','不能换顺序','第1张=FOOTBALL'],button:'抽最上面1张',peek:true},
{t:'10. 抽到 FOOTBALL 怎么结算',x:'你通过PASS抽到了FOOTBALL CARD。这里没有“INTERCEPTION抢走🏈”这条规则。只要这次抽牌没有在之前被取消，你就获得1个🏈。',r:'FOOTBALL结算完成后，把FOOTBALL CARD重新秘密放回公共牌库中，之后仍可能再次被任何玩家抽到。',res:'你现在的进度变成 🏈 1 / 3。',f:['抽到FOOTBALL','+1🏈','FOOTBALL放回牌库'],button:'确认得分'},
{t:'11. INTERCEPTION 也能取消 PASS',x:'现在再演示一次PASS。对手可以在PASS生效前使用INTERCEPTION。请点击INTERCEPTION。',r:'PASS → INTERCEPTION：整个PASS被取消。',res:'结果：不能查看顶部3张，也不会执行PASS附带的那次抽牌。',f:['PASS','INTERCEPTION','PASS取消','不能看3张/不能抽'],list:['PASS','INTERCEPTION','BLOCK'],target:'INTERCEPTION'},
{t:'12. INTERCEPTION 还能取消“普通抽牌”',x:'INTERCEPTION不只针对RUN和PASS。当玩家准备进行普通抽牌时，对手也可以打INTERCEPTION，取消这一次抽牌。',r:'抽牌动作 → INTERCEPTION → 这次抽牌取消。',res:'如果被取消的是“正常结束回合抽牌”，该玩家不抽牌，并直接结束自己的回合。',f:['准备正常抽牌','INTERCEPTION','抽牌取消','回合结束'],button:'明白了'},
{t:'13. TACKLE：随机拿走1张功能牌',x:'轮到你使用TACKLE。先点击TACKLE，然后选择AI 1作为目标。系统会从AI 1的手牌里随机拿走1张功能牌加入你的手牌。',r:'TACKLE只能拿“功能牌”，不会拿走已经获得的🏈，也不会拿走FOOTBALL CARD。',res:'对手可以在TACKLE生效前打BLOCK取消这张TACKLE。',f:['TACKLE','选目标','随机拿1张功能牌'],list:['TACKLE','RUN','BLITZ'],target:'TACKLE'},
{t:'14. 选择TACKLE目标',x:'TACKLE已经打出。请点击AI 1。这里模拟你随机拿到AI 1的一张BLOCK。',r:'目标玩家不能自己选择要给哪张牌；必须随机。',res:'TACKLE成功后，你的手牌+1，目标玩家手牌-1。',f:['选择AI 1','随机抽1张','加入你的手牌'],player:1},
{t:'15. BLITZ：强制指定玩家立即抽1张',x:'最后学习BLITZ。点击BLITZ，再选择AI 2。AI 2会立即额外抽1张。',r:'BLITZ可以指定自己，也可以指定其他玩家。它制造的是“额外抽牌”。',res:'BLITZ本身不是RUN或PASS，所以INTERCEPTION不会因为“取消RUN/PASS”而直接取消BLITZ；但如果之后发生可被取消的抽牌窗口，按规则结算。',f:['BLITZ','指定玩家','立即额外抽1张'],list:['BLITZ','BLOCK','RUN'],target:'BLITZ'},
{t:'16. 把整场游戏串起来',x:'现在你已经学完：轮到自己 → 可用RUN/PASS/TACKLE/BLITZ制造机会 → 对手可在正确时机用INTERCEPTION → BLOCK可以反制INTERCEPTION/TACKLE → 最后正常抽1张结束回合。',r:'最重要的三条：RUN=多抽1张；PASS=看顶部3张后抽最上面1张且不能改顺序；INTERCEPTION=取消RUN、PASS或一次抽牌。',res:'谁先累计3个🏈，立即获胜。',f:['功能牌阶段','反应阶段','正常抽牌','FOOTBALL +1','3个🏈获胜'],button:'完成教程'}
],en:[
{t:'1. Goal & Setup',x:'This is a free-for-all game, not Red vs Blue. You and the AI players race to collect football points. Deal 5 Action Cards to each player and shuffle 1 FOOTBALL CARD into the shared deck.',r:'Win condition: the first player to successfully collect 3 FOOTBALL draws wins immediately.',res:'The FOOTBALL CARD is a special card inside the shared deck, not a normal Action Card in your hand.',f:['5 cards each','Shared deck','1 FOOTBALL','First to 3 wins'],button:'Start'},
{t:'2. Full Turn Structure',x:'At the start of your turn, look at your hand. You may play 0 or more Action Cards. When you are done, make your normal draw; after that draw resolves, your turn ends.',r:'Turn order: Start → Action phase → Normal draw 1 → End turn → Next player.',res:'Extra draws from RUN / PASS / BLITZ do not automatically replace your normal end-of-turn draw unless a rule explicitly says so.',f:['Start','Action phase','Normal draw 1','End turn'],button:'Try a Normal Draw'},
{t:'3. Normal Draw',x:'Tap the shared deck. Assume you draw a normal TACKLE card. It enters your hand and your turn ends.',r:'A normal draw can also be canceled by INTERCEPTION.',res:'If your normal end-of-turn draw is canceled, you draw nothing and your turn ends.',f:['Tap deck','Draw normal card','Add to hand','End turn'],deck:true},
{t:'4. RUN: Gain One Extra Draw',x:'RUN does not peek at cards. It gives you one extra draw this turn. Tap the moving RUN card.',r:'If RUN resolves, immediately gain 1 extra draw. Your normal end-of-turn draw still remains.',res:'A RUN turn can give you one more chance to find the FOOTBALL than a normal turn.',f:['RUN','Extra draw 1','Normal draw remains'],list:['RUN','PASS','BLOCK'],target:'RUN'},
{t:'5. INTERCEPTION Cancels RUN',x:'After you play RUN, an opponent may immediately respond with INTERCEPTION. Tap INTERCEPTION to see the result.',r:'INTERCEPTION must be played before RUN resolves.',res:'RUN is canceled: no extra RUN draw, but you still keep your normal end-of-turn draw later.',f:['RUN','INTERCEPTION','RUN canceled','Extra draw lost'],list:['INTERCEPTION','BLOCK'],target:'INTERCEPTION'},
{t:'6. BLOCK Cancels INTERCEPTION',x:'If you have BLOCK, you may counter the INTERCEPTION. Tap BLOCK.',r:'BLOCK can cancel INTERCEPTION or TACKLE.',res:'RUN → INTERCEPTION → BLOCK: the INTERCEPTION is canceled and RUN works again.',f:['RUN','INTERCEPTION','BLOCK','RUN restored'],list:['BLOCK','PASS','TACKLE'],target:'BLOCK'},
{t:'7. Resolve the RUN Extra Draw',x:'RUN is active again. Tap the shared deck to make the extra draw created by RUN.',r:'This is the RUN extra draw, not your normal end-of-turn draw.',res:'After this draw, you may continue playing Action Cards; you still make your normal draw later.',f:['RUN restored','Extra draw 1','Action phase continues'],deck:true},
{t:'8. PASS: Look at Top 3',x:'Now learn PASS. Tap PASS. It lets you look at the top 3 cards of the shared deck, but you may not rearrange, swap, or change their order.',r:'PASS = Look at top 3 → keep the exact order → draw the top card.',res:'PASS does not let you choose one of the three cards.',f:['PASS','Look top 3','Order locked','Must draw #1'],list:['PASS','RUN','TACKLE'],target:'PASS'},

{t:'10. Resolving a FOOTBALL Draw',x:'You drew the FOOTBALL CARD through PASS. There is no rule where INTERCEPTION steals the football point after it is already drawn. If the draw was not canceled beforehand, you gain 1 🏈.',r:'After scoring, secretly reinsert the FOOTBALL CARD into the shared deck.',res:'Your score is now 🏈 1 / 3.',f:['Draw FOOTBALL','+1 🏈','Reinsert FOOTBALL'],button:'Score Point'},

function q(id){return document.getElementById(id)}function wrong(el){el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');q('toast').textContent=lang==='zh'?'这一步不是点这里，跟着黄色箭头操作。':'Not here. Follow the yellow arrow.'}function flash(t){q('flash').textContent=t;q('flash').classList.remove('show');void q('flash').offsetWidth;q('flash').classList.add('show')}function next(){if(step<15){step++;render()}else q('done').classList.add('show')}
function cardClick(type,el){const d=copy[lang][step];if(d.target!==type){wrong(el);return}flash(type+'!');if(step===3)setTimeout(next,450);else if(step===4)setTimeout(next,450);else if(step===5)setTimeout(next,450);else if(step===7){setTimeout(()=>{step=8;render()},450)}else if(step===10)setTimeout(next,450);else if(step===12)setTimeout(next,450);else if(step===14){setTimeout(()=>{step=15;render()},450)}else setTimeout(next,450)}
function deckClick(){const d=copy[lang][step];const el=q('deck');if(!d.deck){wrong(el);return}flash(lang==='zh'?'抽牌!':'DRAW!');el.textContent=step===2?'💥':'🛡️';setTimeout(()=>{el.textContent='🂠';next()},520)}
function playerClick(i){const d=copy[lang][step];const el=q('p'+i);if(d.player!==i){wrong(el);return}if(step===13){flash(lang==='zh'?'TACKLE成功!':'TACKLE SUCCESS!');q('youCount').textContent=lang==='zh'?'6张手牌':'6 cards';setTimeout(next,520)}else wrong(el)}
function render(){const d=copy[lang][step];document.documentElement.lang=lang==='zh'?'zh-CN':'en';q('lessonNo').textContent=(lang==='zh'?'教程 ':'LESSON ')+(step+1)+' / 16';q('lessonTitle').textContent=d.t;q('lessonText').textContent=d.x;q('ruleBox').innerHTML='<b>'+(lang==='zh'?'规则：':'RULE: ')+'</b>'+d.r;q('resultBox').innerHTML='<b>'+(lang==='zh'?'结果：':'RESULT: ')+'</b>'+d.res;q('backBtn').textContent=lang==='zh'?'← 休闲模式':'← Casual Mode';q('youName').textContent=lang==='zh'?'你':'YOU';q('deckLabel').textContent=lang==='zh'?'公共牌库':'SHARED DECK';q('handTitle').textContent=lang==='zh'?'你的手牌':'YOUR HAND';q('peekLabel').textContent=d.peek?(lang==='zh'?'从左到右：第1张 / 第2张 / 第3张。顺序不能改变。':'Left to right: #1 / #2 / #3. Order cannot change.') : '';
q('stepbar').innerHTML='';for(let i=0;i<16;i++){const x=document.createElement('div');x.className='dot '+(i<=step?'on':'');q('stepbar').appendChild(x)}q('flow').innerHTML='';d.f.forEach((v,i)=>{const s=document.createElement('span');s.textContent=v;if(i===Math.min(1,d.f.length-1))s.className='now';q('flow').appendChild(s)});
const deck=q('deck');deck.className='deck'+(d.deck?' target':'');deck.onclick=deckClick;deck.textContent='🂠';q('peek').className='peek'+(d.peek?' show':'');q('actions').innerHTML='';if(d.button){const b=document.createElement('button');b.className='teachBtn target';b.textContent=d.button;b.onclick=()=>{if(step===8){flash('FOOTBALL!');step=9;render();return}if(step===9){q('youScore').textContent='🏈 1 / 3';flash('+1 🏈');setTimeout(next,450);return}next()};q('actions').appendChild(b)}
q('hand').innerHTML='';const list=d.list||['RUN','PASS','TACKLE','INTERCEPTION','BLOCK','BLITZ'];list.forEach(type=>{const c=document.createElement('div');c.className='card'+(d.target===type?' target':'');c.dataset.tip=lang==='zh'?'点这张':'PLAY THIS';c.innerHTML='<div class="icon">'+cards[type][0]+'</div><div class="name">'+type+'</div><div class="desc">'+desc[lang][type]+'</div>';c.onclick=()=>cardClick(type,c);q('hand').appendChild(c)});
for(let i=0;i<3;i++){q('p'+i).classList.remove('target','wrong');q('p'+i).onclick=()=>playerClick(i)}if(Number.isInteger(d.player))q('p'+d.player).classList.add('target');q('toast').textContent='';q('doneTitle').textContent=lang==='zh'?'教程完成':'Tutorial Complete';q('doneText').textContent=lang==='zh'?'你已经学会休闲模式从开局、出牌、反应、抽牌到获胜的完整流程。':'You learned the full Casual Mode flow from setup and timing to drawing and winning.';q('playBtn').textContent=lang==='zh'?'进入单机AI游戏':'Play Solo vs AI';q('againBtn').textContent=lang==='zh'?'重新学习':'Restart Tutorial'}
q('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();
</script></body></html>
