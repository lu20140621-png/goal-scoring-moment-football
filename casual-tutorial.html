<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goal-Scoring Moment Football — Casual Tutorial</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07131d;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0c2941;border:2px solid #3477a6;border-radius:14px;padding:10px 12px}.brand{font-weight:950}.btn{border:1px solid #557c98;background:#123751;color:#fff;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;text-decoration:none}.btn.gold{background:#dfb34c;color:#251b07;border-color:#f1d078}.board{margin-top:12px;background:radial-gradient(circle at 50% 38%,#235a3d,#123a28 62%,#081b13);border:3px solid #4d8967;border-radius:22px;padding:14px;min-height:650px;position:relative;overflow:hidden}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.playerBox{background:#0a2336;border:2px solid #315a76;border-radius:13px;padding:10px;text-align:center}.playerBox.you{border-color:#e0b64f;box-shadow:0 0 0 2px #e0b64f22}.score{font-size:22px;font-weight:950;color:#f2cf73}.center{display:grid;place-items:center;min-height:200px}.deck{position:relative;width:112px;height:154px;border-radius:14px;background:linear-gradient(155deg,#2f744e,#17422d);border:4px solid #fff;display:grid;place-items:center;font-size:38px;box-shadow:0 14px 28px #0008;cursor:pointer;transition:.2s}.deck.target{animation:deckPulse .8s ease-in-out infinite alternate;box-shadow:0 0 0 5px #ffd75b35,0 0 32px #ffd75baa,0 14px 28px #0008}.deck.target:before{content:'▼';position:absolute;left:50%;top:-43px;transform:translateX(-50%);font-size:30px;color:#ffd75b;animation:arrowBounce .55s ease-in-out infinite alternate}.deck.wrong{animation:wrongShake .28s linear 2}.deckLabel{text-align:center;font-size:12px;font-weight:900;margin-top:7px}.coach{background:#0a2336;border:2px solid #dcb04d;border-radius:15px;padding:13px;margin:8px auto 0;max-width:900px}.stepbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:9px}.dot{height:6px;background:#294b62;border-radius:999px}.dot.on{background:#e2b84e}.lessonNo{font-size:11px;color:#e6bf62;font-weight:950}.coach h2{color:#f0cf78;margin:4px 0 5px}.coach p{color:#d3dee5;line-height:1.55;margin:4px 0;font-size:13px}.flow{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.flow span{background:#103852;border:1px solid #367093;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}.flow span.now{background:#dcb14b;color:#211707;border-color:#f0cf78}.handTitle{font-weight:950;margin:12px 0 4px}.hand{display:flex;justify-content:center;align-items:flex-end;gap:8px;overflow-x:auto;padding:46px 8px 10px;min-height:180px}.card{position:relative;flex:0 0 96px;height:132px;background:linear-gradient(155deg,#faf3e5,#ddd4c4);color:#182018;border-radius:13px;border:2px solid #fff;padding:8px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;cursor:pointer;transition:.2s;box-shadow:0 9px 18px #0006}.card .icon{font-size:27px}.card .name{font-weight:950;font-size:11px}.card .desc{font-size:8px;color:#465048;line-height:1.15}.card.target{outline:4px solid #ffd75b;box-shadow:0 0 0 4px #ffd75b35,0 0 28px #ffd75baa,0 10px 18px #0008;animation:cardFloat .8s ease-in-out infinite alternate;z-index:20}.card.target:before{content:'▼';position:absolute;left:50%;top:-39px;transform:translateX(-50%);font-size:29px;color:#ffd75b;text-shadow:0 3px 8px #000;animation:arrowBounce .55s ease-in-out infinite alternate}.card.target:after{content:attr(data-tip);position:absolute;left:50%;top:-65px;transform:translateX(-50%);background:#ffd75b;color:#211806;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:950;white-space:nowrap}.card.wrong{animation:wrongShake .28s linear 2}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}.teachBtn{position:relative;border:1px solid #527793;background:#143b57;color:#fff;border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer}.teachBtn.target{background:#dfb34c;color:#251b07;border-color:#f1d078;animation:btnPulse 1s infinite}.teachBtn.target:before{content:'↓';position:absolute;left:50%;top:-31px;transform:translateX(-50%);font-size:27px;color:#ffd85f;animation:arrowBounce .7s infinite alternate}.toast{min-height:22px;text-align:center;color:#ffdc76;font-size:12px;font-weight:900;margin-top:5px}.peek{display:none;gap:8px;justify-content:center;margin:12px 0}.peek.show{display:flex}.peekCard{width:84px;height:112px;border-radius:11px;background:#f5efdf;color:#172019;border:2px solid #fff;display:grid;place-items:center;font-weight:950;text-align:center;padding:6px}.peekCard:first-child{outline:3px solid #f0c95e}.flash{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:50;background:#06131ddd;border:2px solid #ffd75b;border-radius:15px;padding:13px 18px;font-size:22px;font-weight:950;color:#ffd75b;opacity:0;pointer-events:none}.flash.show{animation:flashPlay .8s ease}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:80}.overlay.show{display:flex}.dialog{width:min(560px,100%);background:#0d2940;border:2px solid #dcb14b;border-radius:20px;padding:20px;text-align:center}.dialog h2{color:#f0cf78}.dialogActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.dialogActions a{padding:14px;border-radius:12px;background:#183f5a;color:#fff;text-decoration:none;font-weight:900}.dialogActions a:first-child{background:#dfb34c;color:#211707}
@keyframes cardFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.055)}}@keyframes arrowBounce{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-8px)}}@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes deckPulse{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.04)}}@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 #ffd75b55}50%{box-shadow:0 0 0 8px #ffd75b10}}@keyframes flashPlay{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}25%,65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
@media(max-width:650px){.wrap{padding:9px}.players{grid-template-columns:1fr 1fr}.players .playerBox:last-child{grid-column:1/-1}.board{padding:10px}.hand{justify-content:flex-start}.card{flex-basis:78px;height:112px}.card.target:before{top:-35px}.card.target:after{top:-59px;font-size:8px}.coach p{font-size:12px}.dialogActions{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand">🎓🏈 GOAL-SCORING MOMENT · CASUAL TUTORIAL</div><div><a class="btn" href="casual.html" id="backBtn">← 休闲模式</a> <button class="btn" id="langBtn">中文 / EN</button></div></div>
<div class="board"><div class="players"><div class="playerBox you"><b id="youName">你</b><div class="score" id="youScore">🏈 0 / 3</div></div><div class="playerBox"><b>AI 1</b><div class="score" id="ai1Score">🏈 0 / 3</div></div><div class="playerBox"><b>AI 2</b><div class="score">🏈 0 / 3</div></div></div>
<div class="center"><div><div class="deck" id="deck">🂠</div><div class="deckLabel" id="deckLabel">公共牌库</div></div></div>
<div class="peek" id="peek"><div class="peekCard">🏈<br>FOOTBALL</div><div class="peekCard">💥<br>TACKLE</div><div class="peekCard">🛡️<br>BLOCK</div></div>
<div class="coach"><div class="stepbar" id="stepbar"></div><div class="lessonNo" id="lessonNo"></div><h2 id="lessonTitle"></h2><p id="lessonText"></p><div class="flow" id="flow"></div><div class="actions" id="actions"></div><div class="toast" id="toast"></div><div class="handTitle" id="handTitle">你的手牌</div><div class="hand" id="hand"></div></div>
<div class="flash" id="flash"></div></div></div>
<div class="overlay" id="done"><div class="dialog"><h2 id="doneTitle">教程完成</h2><p id="doneText">你已经学会休闲模式完整流程。</p><div class="dialogActions"><a href="casual-game.html" id="playBtn">进入单机AI游戏</a><a href="casual-tutorial.html" id="againBtn">重新学习</a></div></div></div>
<script>
let lang='zh',step=0,passPeeked=false;
const cards={RUN:['🏃','RUN'],PASS:['🎯','PASS'],TACKLE:['💥','TACKLE'],INTERCEPTION:['🦅','INTERCEPTION'],BLOCK:['🛡️','BLOCK'],BLITZ:['⚡','BLITZ']};
const copy={zh:[
{t:'1. 游戏目标',x:'休闲模式完全反转：抽到 FOOTBALL CARD 是好事。先累计获得 3 个🏈的人立即获胜。',f:['抽牌','FOOTBALL','+1🏈','先到3个获胜'],b:'开始教学'},
{t:'2. 正常回合',x:'轮到你时，可以先使用功能牌；最后从公共牌库抽1张结束回合。现在点击公共牌库，体验一次普通抽牌。',f:['你的回合','可出功能牌','最后抽1张'],deck:true},
{t:'3. RUN：本回合多抽1张',x:'RUN让你在本回合获得一次额外抽牌。点击正在跳动的 RUN。',f:['RUN','额外抽1张','之后仍有正常抽牌'],list:['RUN','PASS','BLOCK'],target:'RUN'},
{t:'4. INTERCEPTION 可以取消 RUN',x:'你刚打出 RUN，AI 使用 INTERCEPTION。INTERCEPTION 会取消这张 RUN，所以这次额外抽牌不会发生。',f:['RUN','INTERCEPTION','RUN被取消'],list:['INTERCEPTION','BLOCK'],target:'INTERCEPTION'},
{t:'5. BLOCK 可以救回 RUN',x:'如果你有 BLOCK，可以取消对方刚出的 INTERCEPTION。点击 BLOCK，RUN重新生效。',f:['RUN','INTERCEPTION','BLOCK','RUN恢复'],list:['BLOCK','PASS','TACKLE'],target:'BLOCK'},
{t:'6. PASS：看顶部3张，再抽最上面1张',x:'点击 PASS。你会看到牌库顶部3张牌；不能换顺序。看完后必须抽最上面的那1张。',f:['PASS','看顶部3张','不能换顺序','抽最上面1张'],list:['PASS','RUN','TACKLE'],target:'PASS'},
{t:'7. PASS 看牌结果',x:'现在顶部3张已经翻开。第一张就是 FOOTBALL。你不能调整顺序；点击“抽最上面1张”。',f:['顶部3张','顺序固定','抽第1张'],button:'抽最上面1张',peek:true},
{t:'8. INTERCEPTION 也可以取消 PASS',x:'如果对手在 PASS 生效前打出 INTERCEPTION，整个 PASS 被取消：不能看顶部3张，也不能执行 PASS 的抽牌。',f:['PASS','INTERCEPTION','PASS被取消'],list:['PASS','INTERCEPTION','BLOCK'],target:'INTERCEPTION'},
{t:'9. 其他功能牌',x:'TACKLE：指定一名玩家，随机拿走他1张功能牌。BLITZ：指定一名玩家立即额外抽1张。BLOCK：取消 INTERCEPTION 或 TACKLE。',f:['TACKLE=随机拿1张','BLITZ=强制额外抽1张','BLOCK=反制'],button:'继续'},
{t:'10. 抽到 FOOTBALL 与获胜',x:'抽到 FOOTBALL CARD 后你获得1个🏈，然后 FOOTBALL CARD 重新放回公共牌库。第一个累计3个🏈的玩家立即获胜。',f:['抽到FOOTBALL','+1🏈','放回牌库','3个=获胜'],button:'完成教程'}],
en:[
{t:'1. Goal',x:'Casual Mode is reversed: drawing the FOOTBALL CARD is good. The first player to collect 3 🏈 wins immediately.',f:['Draw','FOOTBALL','+1 🏈','First to 3 wins'],b:'Start Tutorial'},
{t:'2. Normal Turn',x:'On your turn, you may play action cards first. Then draw 1 card from the shared deck to end your turn. Tap the deck now.',f:['Your turn','Play actions','Draw 1 to end'],deck:true},
{t:'3. RUN: draw one extra card',x:'RUN gives you one extra draw this turn. Tap the moving RUN card.',f:['RUN','Extra draw 1','Normal draw still remains'],list:['RUN','PASS','BLOCK'],target:'RUN'},
{t:'4. INTERCEPTION cancels RUN',x:'After RUN is played, an opponent may use INTERCEPTION. It cancels RUN, so the extra draw does not happen.',f:['RUN','INTERCEPTION','RUN canceled'],list:['INTERCEPTION','BLOCK'],target:'INTERCEPTION'},
{t:'5. BLOCK restores RUN',x:'BLOCK can cancel that INTERCEPTION. Tap BLOCK and RUN becomes active again.',f:['RUN','INTERCEPTION','BLOCK','RUN restored'],list:['BLOCK','PASS','TACKLE'],target:'BLOCK'},
{t:'6. PASS: look at top 3, then draw the top card',x:'Tap PASS. Look at the top 3 cards without changing their order, then draw the top card.',f:['PASS','Look at top 3','Do not rearrange','Draw top card'],list:['PASS','RUN','TACKLE'],target:'PASS'},
{t:'7. PASS result',x:'The top 3 cards are revealed. The first card is FOOTBALL. You may not rearrange them. Tap “Draw Top Card”.',f:['Top 3','Order fixed','Draw #1'],button:'Draw Top Card',peek:true},
{t:'8. INTERCEPTION also cancels PASS',x:'If an opponent plays INTERCEPTION before PASS resolves, the entire PASS is canceled: no top-3 look and no PASS draw.',f:['PASS','INTERCEPTION','PASS canceled'],list:['PASS','INTERCEPTION','BLOCK'],target:'INTERCEPTION'},
{t:'9. Other action cards',x:'TACKLE: randomly take 1 action card from a chosen player. BLITZ: make a chosen player draw 1 extra card immediately. BLOCK: cancel INTERCEPTION or TACKLE.',f:['TACKLE=random steal 1','BLITZ=force extra draw','BLOCK=counter'],button:'Continue'},
{t:'10. FOOTBALL and winning',x:'When you draw the FOOTBALL CARD, gain 1 🏈, then return the FOOTBALL CARD to the shared deck. First player to 3 🏈 wins immediately.',f:['Draw FOOTBALL','+1 🏈','Return to deck','3 = win'],button:'Finish Tutorial'}]};
function flash(text){const f=document.getElementById('flash');f.textContent=text;f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function wrong(el){el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');document.getElementById('toast').textContent=lang==='zh'?'不是这一步要操作的对象，请跟着黄色箭头。':'Not this step. Follow the yellow arrow.'}
function next(){if(step<9){step++;render()}else document.getElementById('done').classList.add('show')}
function cardClick(type,el){const d=copy[lang][step];if(d.target!==type){wrong(el);return}document.getElementById('toast').textContent='';flash(type+'!');if(step===5){passPeeked=true;setTimeout(()=>{step=6;render()},450)}else setTimeout(next,420)}
function deckClick(){const d=copy[lang][step];const el=document.getElementById('deck');if(!d.deck){wrong(el);return}flash(lang==='zh'?'抽牌!':'DRAW!');el.textContent='💥';setTimeout(()=>{el.textContent='🂠';next()},500)}
function render(){const d=copy[lang][step];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('lessonNo').textContent=(lang==='zh'?'教程 ':'LESSON ')+(step+1)+' / 10';document.getElementById('lessonTitle').textContent=d.t;document.getElementById('lessonText').textContent=d.x;document.getElementById('backBtn').textContent=lang==='zh'?'← 休闲模式':'← Casual Mode';document.getElementById('youName').textContent=lang==='zh'?'你':'YOU';document.getElementById('deckLabel').textContent=lang==='zh'?'公共牌库':'SHARED DECK';document.getElementById('handTitle').textContent=lang==='zh'?'你的手牌':'YOUR HAND';document.getElementById('stepbar').innerHTML='';for(let i=0;i<10;i++){const x=document.createElement('div');x.className='dot '+(i<=step?'on':'');document.getElementById('stepbar').appendChild(x)}document.getElementById('flow').innerHTML='';d.f.forEach((v,i)=>{const s=document.createElement('span');s.textContent=v;if(i===Math.min(1,d.f.length-1))s.className='now';document.getElementById('flow').appendChild(s)});const deck=document.getElementById('deck');deck.className='deck'+(d.deck?' target':'');deck.onclick=deckClick;deck.textContent='🂠';document.getElementById('peek').className='peek'+(d.peek?' show':'');document.getElementById('actions').innerHTML='';if(d.b||d.button){const b=document.createElement('button');b.className='teachBtn target';b.textContent=d.b||d.button;b.onclick=()=>{if(step===6){document.getElementById('youScore').textContent='🏈 1 / 3';flash('FOOTBALL! +1 🏈')}next()};document.getElementById('actions').appendChild(b)}document.getElementById('hand').innerHTML='';const list=d.list||['RUN','PASS','TACKLE','INTERCEPTION','BLOCK','BLITZ'];list.forEach(type=>{const c=document.createElement('div');c.className='card'+(d.target===type?' target':'');c.dataset.tip=lang==='zh'?'点这张':'PLAY THIS';c.innerHTML='<div class="icon">'+cards[type][0]+'</div><div class="name">'+type+'</div><div class="desc">'+({zh:{RUN:'本回合额外抽1张',PASS:'看顶部3张后抽最上面1张',TACKLE:'随机拿对方1张功能牌',INTERCEPTION:'取消RUN或PASS',BLOCK:'取消INTERCEPTION或TACKLE',BLITZ:'指定玩家立即额外抽1张'},en:{RUN:'Draw 1 extra this turn',PASS:'Look top 3, then draw top',TACKLE:'Randomly take 1 action card',INTERCEPTION:'Cancel RUN or PASS',BLOCK:'Cancel INTERCEPTION or TACKLE',BLITZ:'Make a player draw 1 extra'}}[lang][type])+'</div>';c.onclick=()=>cardClick(type,c);document.getElementById('hand').appendChild(c)});document.getElementById('toast').textContent='';document.getElementById('doneTitle').textContent=lang==='zh'?'教程完成':'Tutorial Complete';document.getElementById('doneText').textContent=lang==='zh'?'你已经学会休闲模式完整流程。':'You learned the complete Casual Mode flow.';document.getElementById('playBtn').textContent=lang==='zh'?'进入单机AI游戏':'Play Solo vs AI';document.getElementById('againBtn').textContent=lang==='zh'?'重新学习':'Restart Tutorial'}
document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();
</script></body></html>
