<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Casual Mode Tutorial</title><link rel="stylesheet" href="football-console.css"><style>.wrap{max-width:980px;margin:18px auto;padding:12px}.table{background:radial-gradient(circle at 50% 40%,#214c35,#0f2d20 65%,#07160f);border:3px solid #4f7f62;border-radius:22px;padding:18px;min-height:620px;position:relative}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.p{background:#0b2134;border:2px solid #31556f;border-radius:12px;padding:10px;text-align:center}.p.you{border-color:#d6aa4d}.score{font-size:22px;font-weight:950;color:#f0cf78}.deck{width:110px;height:150px;border-radius:14px;background:linear-gradient(155deg,#2d6b48,#163e2a);border:4px solid #fff;display:grid;place-items:center;font-size:38px;margin:30px auto 10px;box-shadow:0 12px 25px #0008}.lesson{background:#0b2134;border:2px solid #d6aa4d;border-radius:14px;padding:13px;margin:12px auto;max-width:760px}.lesson h2{color:#f0cf78;margin:0 0 6px}.lesson p{color:#d1dce3;line-height:1.55}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:9px}.s{height:6px;background:#2b4b61;border-radius:999px}.s.on{background:#e1b64e}.actions{display:flex;gap:8px;flex-wrap:wrap}.teach{border:1px solid #537692;background:#143750;color:#fff;border-radius:9px;padding:9px 12px;font-weight:900}.teach.gold{background:#d8ac49;color:#261b07}.hand{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.c{flex:0 0 90px;height:120px;background:#f4f0df;color:#162018;border:3px solid #fff;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px;font-weight:950}.c .i{font-size:27px}@media(max-width:650px){.players{grid-template-columns:1fr}.table{min-height:760px}.c{flex-basis:76px;height:105px}}</style></head><body><div class="wrap"><div class="consoleActions" style="justify-content:space-between;margin-bottom:8px"><a class="consoleBtn" href="casual.html" id="back">← 休闲模式</a><button class="consoleBtn" id="langBtn">中文 / EN</button></div><div class="table"><div class="players"><div class="p you"><b id="you">你</b><div class="score" id="ys">🏈 0 / 3</div></div><div class="p"><b>AI 1</b><div class="score">🏈 0 / 3</div></div><div class="p"><b>AI 2</b><div class="score">🏈 0 / 3</div></div></div><div class="deck" id="deck">🂠</div><div style="text-align:center;font-weight:900" id="deckText">公共牌库</div><div class="lesson"><div class="steps" id="steps"></div><div style="font-size:11px;color:#e3bf64;font-weight:950" id="no"></div><h2 id="title"></h2><p id="text"></p><div class="actions" id="actions"></div><div class="hand" id="hand"></div></div></div></div><div class="overlay" id="done"><div class="dialog"><h2 id="doneTitle">教程完成</h2><p id="doneText">你已经学会休闲模式。</p><div class="modeGrid"><a class="modeChoice gold" href="casual-game.html"><h3 id="play">进入单机AI游戏</h3><p>和2名电脑玩家争抢3个🏈。</p></a><a class="modeChoice" href="casual-tutorial.html"><h3 id="again">重新学习</h3><p>从第一步再来一次。</p></a></div></div></div><script>let lang='zh',step=0;const z=[['目标','先拿到3个🏈的人获胜。这里不是怕抽到橄榄球，而是大家都想抽到FOOTBALL CARD。','继续'],['回合开始','轮到你时，可以先打0张或多张功能牌。最后一定要抽1张公共牌结束回合。','查看手牌'],['RUN','RUN可以看牌库顶部3张，然后按任意顺序放回。它能帮你把FOOTBALL CARD安排到想要的位置。','使用 RUN'],['抽牌','功能牌用完后，从公共牌库抽1张。普通牌加入手牌并结束回合。','抽1张'],['抽到 FOOTBALL','如果抽到FOOTBALL CARD，你准备获得1个🏈。这时其他玩家可以反应。','抽到 FOOTBALL'],['INTERCEPTION + BLOCK','别人可以用INTERCEPTION抢走这1个🏈。你可以用BLOCK取消它；BLOCK也能被另一张BLOCK取消。','使用 BLOCK'],['获胜','结算后，FOOTBALL CARD重新秘密插回牌库。谁先累计3个🏈，谁立即获胜。','完成教程']];const e=[['Goal','First player to collect 3 🏈 wins. In this mode, everyone wants to draw the FOOTBALL CARD.','Continue'],['Turn Start','On your turn, play 0 or more action cards. You must finally draw 1 card to end your turn.','View Hand'],['RUN','RUN lets you look at the top 3 cards and return them in any order, helping you position the FOOTBALL CARD.','Use RUN'],['Draw','After actions, draw 1 card. A normal card joins your hand and ends your turn.','Draw 1'],['Draw FOOTBALL','If you draw the FOOTBALL CARD, you are about to gain 1 🏈. Other players may react.','Draw FOOTBALL'],['INTERCEPTION + BLOCK','Another player may use INTERCEPTION to steal the point. You may BLOCK it, and another BLOCK can cancel your BLOCK.','Use BLOCK'],['Win','After scoring, secretly reinsert the FOOTBALL CARD into the deck. First to 3 🏈 wins immediately.','Finish Tutorial']];const defs={RUN:['🏃','RUN'],PASS:['🎯','PASS'],TACKLE:['💥','TACKLE'],INTERCEPTION:['🦅','INTERCEPTION'],BLOCK:['🛡️','BLOCK'],BLITZ:['⚡','BLITZ']};function render(){const d=(lang==='zh'?z:e)[step];no.textContent=(lang==='zh'?'教程 ':'LESSON ')+(step+1)+' / 7';title.textContent=d[0];text.textContent=d[1];actions.innerHTML='';let b=document.createElement('button');b.className='teach gold';b.textContent=d[2];b.onclick=next;actions.appendChild(b);steps.innerHTML='';for(let i=0;i<7;i++){let s=document.createElement('div');s.className='s '+(i<=step?'on':'');steps.appendChild(s)}hand.innerHTML='';let list=step<2?['RUN','PASS','TACKLE']:step===2?['RUN','BLOCK','PASS']:step===5?['BLOCK','INTERCEPTION']:['RUN','PASS','TACKLE','INTERCEPTION','BLOCK','BLITZ'];list.forEach(k=>{let c=document.createElement('div');c.className='c';c.innerHTML='<div class="i">'+defs[k][0]+'</div><b>'+k+'</b><small>'+(lang==='zh'?'功能牌':'Action card')+'</small>';hand.appendChild(c)});back.textContent=lang==='zh'?'← 休闲模式':'← Casual Mode';you.textContent=lang==='zh'?'你':'YOU';deckText.textContent=lang==='zh'?'公共牌库':'SHARED DECK';document.documentElement.lang=lang==='zh'?'zh-CN':'en'}function next(){if(step<6){step++;if(step===4){deck.textContent='🏈';ys.textContent='🏈 1 / 3'}render()}else done.classList.add('show')}langBtn.onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();</script></body></html>
