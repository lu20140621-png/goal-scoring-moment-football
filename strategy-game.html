<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07101a;color:#f5f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,a{font:inherit}.app{max-width:1500px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:#0c2d53;border:2px solid #2d6395;border-radius:12px;padding:10px 12px}.brand{font-weight:950}.score{display:flex;gap:8px;align-items:center;justify-content:center}.team{background:#0f447f;border:2px solid #2d71b4;border-radius:7px;padding:7px 12px;font-weight:950}.num{background:#d7a53e;color:#1e1606;border:3px solid #f0d07c;border-radius:7px;min-width:48px;text-align:center;font-size:26px;font-weight:950}.nav{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}.btn{border:1px solid #547da2;background:#12365b;color:#fff;border-radius:8px;padding:8px 11px;font-weight:900;cursor:pointer}.btn.gold{background:#d8ad49;color:#211708;border-color:#f3d37e}.arena{display:grid;grid-template-columns:190px minmax(560px,1fr) 190px;gap:10px;margin-top:10px}.panel{background:#092845;border:2px solid #2d6192;border-radius:11px;box-shadow:inset 0 0 24px #0006}.roster{padding:10px}.roster h3{margin:0 0 8px;text-align:center;background:#10457f;border:1px solid #3475b4;border-radius:6px;padding:7px;font-size:14px}.rrow{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid #2a4f70;padding:8px 4px;font-size:12px}.rrow.active{background:#ffffff10}.rrow b{color:#f1cc72}.fieldWrap{padding:9px;background:#0a2034}.fieldHead{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:12px}.field{position:relative;aspect-ratio:16/9;min-height:390px;overflow:hidden;border:3px solid #d9e3e7;border-radius:6px;background:linear-gradient(90deg,#4d472a 0 9%,transparent 9% 91%,#17485b 91%),repeating-linear-gradient(90deg,#168143 0 10%,#1c934d 10% 20%)}.fieldBorder{position:absolute;inset:5% 9%;border:2px solid #fff;pointer-events:none}.midline{position:absolute;top:5%;bottom:5%;left:50%;border-left:2px solid #fff;opacity:.8}.yardLine{position:absolute;top:5%;bottom:5%;width:1px;background:#ffffff5c}.yardText{position:absolute;top:11%;transform:translateX(-50%);font-size:21px;font-weight:950;color:#ffffff70}.yardText.bottom{top:auto;bottom:11%}.endzone{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:950;font-size:19px;letter-spacing:.12em}.endzone.left{left:2.2%}.endzone.right{right:2.2%}.los{position:absolute;top:5%;bottom:5%;width:3px;background:#ffd54a;box-shadow:0 0 10px #ffd54a;transition:.35s}.ballBadge{position:absolute;top:50%;transform:translate(-50%,-50%);background:#211807;border:2px solid #d1a83f;border-radius:999px;padding:5px 9px;color:#ffe28d;font-weight:950;font-size:11px;white-space:nowrap;transition:.35s}.player{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;font-size:11px;font-weight:950;box-shadow:0 5px 12px #0008;cursor:pointer;transition:.3s;z-index:5}.player.red{background:#d34a4a}.player.blue{background:#3f77d9}.player.selected{outline:4px solid #ffd75b;box-shadow:0 0 20px #ffd75b}.player .ball{position:absolute;right:-12px;top:-15px;font-size:21px}.drive{position:absolute;left:50%;top:2%;transform:translateX(-50%);font-size:10px;font-weight:950;background:#03101acc;padding:5px 8px;border-radius:999px}.lower{display:grid;grid-template-columns:1.15fr 2fr;gap:10px;margin-top:10px}.logPanel,.handPanel{padding:10px}.logPanel h3,.handPanel h3{margin:0 0 8px;color:#f0ce77}.log{height:170px;overflow:auto;background:#061522;border:1px solid #244d70;border-radius:7px;padding:8px;font-size:12px;line-height:1.5}.status{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pill{background:#061a2b;border:1px solid #315573;border-radius:999px;padding:5px 8px;font-size:11px}.switches{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.switch{border:1px solid #496d8d;background:#102f4d;color:#fff;border-radius:8px;padding:7px 10px;font-weight:850;cursor:pointer}.switch.active{background:#d8ad49;color:#211708;border-color:#f1d17c}.prompt{display:none;background:#2a220d;border:1px solid #d0a94e;border-radius:10px;padding:9px;margin-bottom:8px}.prompt.show{display:block}.promptTitle{font-weight:950;color:#f1cf7c;margin-bottom:7px}.promptBtns{display:flex;gap:7px;flex-wrap:wrap}.cards{display:flex;gap:8px;overflow-x:auto;padding:10px 4px 4px;min-height:146px}.card{flex:0 0 94px;height:132px;border-radius:12px;background:linear-gradient(155deg,#fcf8e8,#ddd4bd);border:3px solid #fff;color:#172018;padding:9px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;font-weight:950;box-shadow:0 8px 14px #0006;cursor:pointer}.card .ico{font-size:28px}.card small{font-size:9px;color:#4b554d}.card.disabled{opacity:.35;filter:grayscale(.9);cursor:not-allowed}.overlay{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:16px;z-index:100}.overlay.show{display:grid}.dialog{width:min(820px,100%);max-height:90vh;overflow:auto;background:#0a2135;border:2px solid #d6aa4d;border-radius:16px;padding:18px}.dialog h2{margin-top:0;color:#f0cf79}.setupGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{border:1px solid #547897;background:#102f4d;color:#fff;border-radius:10px;padding:12px;font-weight:950;cursor:pointer}.choice.active{background:#d8ad49;color:#211708}.rps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.rps button{font-size:31px;padding:13px 18px}.toc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;background:#0a2135;padding:6px 0;z-index:2}.toc a{background:#174a72;color:#fff;text-decoration:none;text-align:center;padding:7px;border-radius:6px;font-size:11px;font-weight:900}.sec{scroll-margin-top:60px;background:#0c2b41;border:1px solid #31566f;border-radius:10px;padding:11px;margin:9px 0}.sec h3{margin:0 0 6px;color:#f0cf78}.chain{background:#071723;border-left:4px solid #e0b64f;padding:7px 9px;margin:5px 0;border-radius:5px}.footballs{font-size:18px}.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#06121de8;border:2px solid #ffd75b;border-radius:14px;padding:12px 16px;font-size:24px;font-weight:950;color:#ffd75b;z-index:20;opacity:0;pointer-events:none}.flash.show{animation:flash .8s ease}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
@media(max-width:900px){.top{grid-template-columns:1fr}.score{order:-1}.brand{text-align:center}.nav{justify-content:center}.arena{grid-template-columns:1fr}.roster{display:none}.lower{grid-template-columns:1fr}.field{min-height:320px}.toc{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:5px}.team{padding:6px 7px;font-size:11px}.num{font-size:20px;min-width:39px}.field{aspect-ratio:10/12;min-height:520px}.yardText{font-size:15px}.player{width:36px;height:36px;font-size:9px}.endzone{font-size:14px}.cards{min-height:120px}.card{flex-basis:77px;height:110px}.card .ico{font-size:23px}.setupGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">🏈 GOAL-SCORING MOMENT · STRATEGY · SOLO</div><div class="score"><div class="team">RED</div><div class="num" id="redScore">0</div><b>-</b><div class="num" id="blueScore">0</div><div class="team">BLUE AI</div></div><div class="nav"><a class="btn" href="index.html">← 首页</a><button class="btn gold" id="manualBtn">说明书</button><button class="btn" id="rulesBtn">玩法说明</button><button class="btn" id="resetBtn">重新开始</button><button class="btn" id="langBtn">中文 / EN</button></div></div>
<div class="arena"><aside class="panel roster"><h3 id="redRosterTitle">红队球员</h3><div id="redRoster"></div></aside><main class="panel fieldWrap"><div class="fieldHead"><b id="stadiumTitle">俯视美式橄榄球比赛现场</b><span id="phaseLabel">等待开始</span></div><div class="field" id="field"><div class="fieldBorder"></div><div class="midline"></div><div class="endzone left">红队端区</div><div class="endzone right">蓝队端区</div><div id="yardLayer"></div><div class="los" id="los" style="left:50%"></div><div class="ballBadge" id="ballBadge" style="left:50%">BALL ON 50</div><div class="drive" id="driveText">4次成功 = TOUCHDOWN</div><div id="playersLayer"></div><div class="flash" id="flash"></div></div></main><aside class="panel roster"><h3 id="blueRosterTitle">蓝队电脑</h3><div id="blueRoster"></div></aside></div>
<div class="lower"><section class="panel logPanel"><h3 id="logTitle">比赛记录</h3><div class="log" id="log"></div><div class="status" style="margin-top:8px"><span class="pill" id="roundPill">第1回合</span><span class="pill" id="posPill">球权：--</span><span class="pill" id="yardPill">BALL ON 50</span></div></section><section class="panel handPanel"><h3 id="handTitle">你的手牌</h3><div class="status"><span class="pill" id="rolePill">身份：--</span><span class="pill" id="skillPill">技能：--</span><span class="pill">FOOTBALL = 球权卡</span></div><div class="switches" id="switches"></div><div class="prompt" id="prompt"><div class="promptTitle" id="promptTitle"></div><div class="promptBtns" id="promptBtns"></div></div><div class="cards" id="cards"></div></section></div>
</div>
<div class="overlay show" id="setup"><div class="dialog"><h2>策略模式 · 单人对电脑</h2><p>只保留单人模式：你控制红队，蓝队全部由电脑控制。</p><h3>选择人数</h3><div class="setupGrid"><button class="choice active" data-size="2">2v2<br><small>每人7张</small></button><button class="choice" data-size="3">3v3<br><small>每人6张</small></button><button class="choice" data-size="4">4v4<br><small>每人5张</small></button></div><div style="text-align:center;margin-top:14px"><button class="btn gold" id="startBtn">开始比赛</button></div></div></div>
<div class="overlay" id="rps"><div class="dialog" style="max-width:600px;text-align:center"><h2>石头剪刀布决定第一轮先攻</h2><p>你代表红队。电脑会同时随机出拳。</p><div class="rps"><button class="choice" data-rps="rock">✊</button><button class="choice" data-rps="paper">🖐️</button><button class="choice" data-rps="scissors">✌️</button></div><p id="rpsResult"></p></div></div>
<div class="overlay" id="doc"><div class="dialog"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 id="docTitle">说明书</h2><button class="btn" id="closeDoc">关闭</button></div><div id="docBody"></div></div></div>
<div class="overlay" id="gameOver"><div class="dialog" style="text-align:center"><h2 id="gameOverTitle">比赛结束</h2><p id="gameOverText"></p><a class="btn gold" href="strategy-game.html">重新开始</a></div></div>
<script>
const $=id=>document.getElementById(id);const Y=[50,40,30,20,10],HAND={2:7,3:6,4:5};const POOLS={2:{RUN:6,PASS:6,TACKLE:5,INTERCEPTION:3,BLOCK:5,BLITZ:3},3:{RUN:8,PASS:8,TACKLE:7,INTERCEPTION:4,BLOCK:7,BLITZ:4},4:{RUN:10,PASS:10,TACKLE:9,INTERCEPTION:5,BLOCK:9,BLITZ:5}};const ICON={RUN:'🏃',PASS:'🎯',TACKLE:'💥',INTERCEPTION:'🦅',BLOCK:'🛡️',BLITZ:'⚡'};let lang='zh';let G={size:2,players:[],deck:[],discard:[],round:1,firstTeam:null,offense:null,holder:null,redProgress:0,blueProgress:0,redBalls:0,blueBalls:0,phase:'setup',pending:null,currentRed:'R1'};
const zh={manual:'说明书',rules:'玩法说明',close:'关闭',stadium:'俯视美式橄榄球比赛现场',log:'比赛记录',hand:'你的手牌',red:'红队球员',blue:'蓝队电脑',reset:'重新开始',phase:{choose:'选择持球者',attack:'进攻时刻',defense:'防守时刻',block:'BLOCK反制',final:'最后BLITZ反制',ai:'电脑行动',gameover:'比赛结束'}};const en={manual:'Rulebook',rules:'How to Play',close:'Close',stadium:'Top-Down American Football Field',log:'Game Log',hand:'Your Hand',red:'Red Players',blue:'Blue AI',reset:'Restart',phase:{choose:'Choose Ball Carrier',attack:'Offense',defense:'Defense',block:'BLOCK Response',final:'Final BLITZ',ai:'Computer Turn',gameover:'Game Over'}};const tx=()=>lang==='zh'?zh:en;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function teamPlayers(t){return G.players.filter(p=>p.team===t)}function byId(id){return G.players.find(p=>p.id===id)}function holder(){return byId(G.holder)}function yard(t){return Y[Math.min(4,t==='red'?G.redProgress:G.blueProgress)]}function xFor(t){let p=t==='red'?G.redProgress:G.blueProgress;return t==='red'?[50,58,66,74,82][p]:[50,42,34,26,18][p]}function hasOff(p){return p.hand.includes('RUN')||p.hand.includes('PASS')}function teamHasOff(t){return teamPlayers(t).some(hasOff)}function consume(p,c){let i=p.hand.indexOf(c);if(i<0)return false;p.hand.splice(i,1);G.discard.push(c);return true}function log(s){$('log').innerHTML+=s+'<br>';$('log').scrollTop=$('log').scrollHeight}function flash(s){$('flash').textContent=s;$('flash').classList.remove('show');void $('flash').offsetWidth;$('flash').classList.add('show')}
function buildYards(){let vals=[10,20,30,40,50,40,30,20,10],xs=[18,26,34,42,50,58,66,74,82],h='';xs.forEach((x,i)=>{h+=`<div class="yardLine" style="left:${x}%"></div><div class="yardText" style="left:${x}%">${vals[i]}</div><div class="yardText bottom" style="left:${x}%">${vals[i]}</div>`});$('yardLayer').innerHTML=h}buildYards();
function makeDeck(){let d=[];Object.entries(POOLS[G.size]).forEach(([c,n])=>{for(let i=0;i<n;i++)d.push(c)});return shuffle(d)}function deal(){G.deck=makeDeck();G.discard=[];G.players.forEach(p=>p.hand=[]);for(let r=0;r<HAND[G.size];r++)for(const p of G.players){let c=G.deck.pop();if(c)p.hand.push(c)}}
function init(){G.players=[];for(let i=1;i<=G.size;i++)G.players.push({id:'R'+i,team:'red',num:i,role:'PLAYER',skill:false,hand:[]});for(let i=1;i<=G.size;i++)G.players.push({id:'B'+i,team:'blue',num:i,role:'PLAYER',skill:false,hand:[]});teamPlayers('red')[Math.floor(Math.random()*G.size)].role='QB';teamPlayers('blue')[Math.floor(Math.random()*G.size)].role='QB';deal();G.round=1;G.firstTeam=null;G.offense=null;G.holder=null;G.redProgress=G.blueProgress=G.redBalls=G.blueBalls=0;G.phase='rps';G.pending=null;G.currentRed='R1';$('log').innerHTML='';log('开局：先用石头剪刀布决定第一轮先攻。');render();$('rps').classList.add('show')}
function render(){renderRoster();renderField();renderHand();$('redScore').textContent=G.redBalls;$('blueScore').textContent=G.blueBalls;$('roundPill').textContent=(lang==='zh'?'第':'Round ')+G.round+(lang==='zh'?'回合':'');$('posPill').textContent=(lang==='zh'?'球权：':'Possession: ')+(G.offense==='red'?'RED':G.offense==='blue'?'BLUE':'--');$('yardPill').textContent='BALL ON '+(G.offense?yard(G.offense):50);$('phaseLabel').textContent=tx().phase[G.phase]||G.phase;$('stadiumTitle').textContent=tx().stadium;$('logTitle').textContent=tx().log;$('handTitle').textContent=tx().hand;$('redRosterTitle').textContent=tx().red;$('blueRosterTitle').textContent=tx().blue;$('manualBtn').textContent=tx().manual;$('rulesBtn').textContent=tx().rules;$('resetBtn').textContent=tx().reset}
function renderRoster(){let rr='',bb='';teamPlayers('red').forEach(p=>rr+=`<div class="rrow ${p.id===G.currentRed?'active':''}"><span>${p.id} · ${p.role}</span><b>${p.hand.length}</b></div>`);teamPlayers('blue').forEach(p=>bb+=`<div class="rrow"><span>${p.id} · ${p.role==='QB'&&G.offense==='blue'?'QB':'?'}</span><b>${p.hand.length}</b></div>`);$('redRoster').innerHTML=rr;$('blueRoster').innerHTML=bb}
function renderField(){let off=G.offense||'red',line=xFor(off),dir=off==='red'?1:-1,ys={2:[36,62],3:[25,50,75],4:[19,39,59,79]}[G.size],h='';$('los').style.left=line+'%';$('ballBadge').style.left=line+'%';$('ballBadge').textContent=(G.offense?(G.offense==='red'?'RED':'BLUE'):'--')+' · BALL ON '+(G.offense?yard(G.offense):50);G.players.forEach(p=>{let i=p.num-1,isOff=p.team===off,x=isOff?(p.id===G.holder?line:line-dir*(6+(i%2)*2)):line+dir*(6+(i%2)*2);x=Math.max(11,Math.min(89,x));h+=`<div class="player ${p.team} ${p.id===G.currentRed?'selected':''}" data-id="${p.id}" style="left:calc(${x}% - 22px);top:calc(${ys[i]}% - 22px)">${p.id}${p.id===G.holder?'<span class="ball">🏈</span>':''}</div>`});$('playersLayer').innerHTML=h;document.querySelectorAll('.player').forEach(el=>el.onclick=()=>fieldPlayerClick(el.dataset.id))}
function renderHand(){let p=byId(G.currentRed);$('rolePill').textContent=(lang==='zh'?'身份：':'Role: ')+p.role;$('skillPill').textContent=(lang==='zh'?'技能：':'Skill: ')+(p.role==='QB'?(p.skill?'已使用':'可用'):'无主动技能');$('switches').innerHTML=teamPlayers('red').map(x=>`<button class="switch ${x.id===G.currentRed?'active':''}" data-id="${x.id}">${x.id} · ${x.role} · ${x.hand.length}</button>`).join('');document.querySelectorAll('.switch').forEach(b=>b.onclick=()=>{G.currentRed=b.dataset.id;render()});$('cards').innerHTML=p.hand.map((c,i)=>`<div class="card ${canUse(p,c)?'':'disabled'}" data-card="${c}" data-i="${i}"><div class="ico">${ICON[c]}</div><div>${c}</div><small>${desc(c)}</small></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{if(!c.classList.contains('disabled'))playHumanCard(c.dataset.card)})}
function desc(c){return ({RUN:'持球推进',PASS:'传给队友',TACKLE:'防RUN',INTERCEPTION:'抄截PASS',BLOCK:'取消防守',BLITZ:'强力阻止'})[c]}
function canUse(p,c){if(p.team!=='red')return false;if(G.phase==='attack'&&G.offense==='red'&&p.id===G.holder)return c==='RUN'||c==='PASS';if(G.phase==='defense'&&G.offense==='blue')return G.pending.action==='RUN'?c==='TACKLE'||c==='BLITZ':c==='INTERCEPTION'||c==='BLITZ';if(G.phase==='block'&&G.offense==='red')return c==='BLOCK';if(G.phase==='final'&&G.offense==='blue')return c==='BLITZ';return false}
function showPrompt(title,buttons){$('promptTitle').textContent=title;$('promptBtns').innerHTML='';buttons.forEach(b=>{let x=document.createElement('button');x.className='btn'+(b.gold?' gold':'');x.textContent=b.label;x.onclick=()=>{hidePrompt();b.fn()};$('promptBtns').appendChild(x)});$('prompt').classList.add('show')}function hidePrompt(){$('prompt').classList.remove('show')}
function fieldPlayerClick(id){let p=byId(id);if(G.phase==='choose'&&G.offense==='red'&&p.team==='red'&&hasOff(p)){G.holder=id;G.currentRed=id;G.phase='attack';log(`红队选择 ${id} 持有 FOOTBALL CARD。`);render();return}if(G.phase==='receiver'&&G.offense==='red'&&p.team==='red'&&id!==G.holder){G.pending.receiver=id;afterHumanPassReceiver();return}if(p.team==='red'){G.currentRed=id;render()}}
function playHumanCard(c){let p=byId(G.currentRed);if(G.phase==='attack'){if(!consume(p,c))return;if(c==='RUN'){G.pending={action:'RUN',attacker:p.id};flash('RUN!');log(`${p.id} 打出 RUN。`);aiDefend()}else{G.pending={action:'PASS',attacker:p.id,receiver:null,qbBoost:false};G.phase='receiver';log(`${p.id} 打出 PASS，请点击场上的接球队友。`);showPrompt('PASS：点击场上的一名红队队友作为接球人。',[]);render()}}else if(G.phase==='defense'){consume(p,c);if(c==='BLITZ'){flash('BLITZ!');log(`${p.id} 使用 BLITZ，电脑进攻失败。`);resolveFail()}else{G.pending.defender=p.id;G.pending.defense=c;flash(c+'!');log(`${p.id} 使用 ${c}。`);setTimeout(aiBlockDecision,500)}}else if(G.phase==='block'&&c==='BLOCK'){consume(p,c);flash('BLOCK!');log(`${p.id} 使用 BLOCK，取消电脑防守。`);G.phase='final';setTimeout(aiFinalBlitz,500)}else if(G.phase==='final'&&c==='BLITZ'){consume(p,c);flash('BLITZ!');log(`${p.id} 使用最后 BLITZ，电脑进攻失败。`);resolveFail()}render()}
function afterHumanPassReceiver(){hidePrompt();let passer=byId(G.pending.attacker);if(passer.role==='QB'&&!passer.skill){showPrompt('是否使用 QB 身份技能？成功时本次推进2格；如果失败，技能也消耗。',[{label:'使用QB技能',gold:true,fn:()=>{passer.skill=true;G.pending.qbBoost=true;aiDefend()}},{label:'暂不使用',fn:()=>aiDefend()}])}else aiDefend();render()}
function aiDefend(){G.phase='ai';render();setTimeout(()=>{let pool=teamPlayers('blue');let target=G.pending.action==='RUN'?'TACKLE':'INTERCEPTION';let blitz=pool.find(p=>p.hand.includes('BLITZ'));let normal=pool.find(p=>p.hand.includes(target));let roll=Math.random();if(blitz&&roll<.22){consume(blitz,'BLITZ');flash('BLITZ!');log(`蓝队电脑使用 BLITZ。`);resolveFail();return}if(normal&&roll<.72){consume(normal,target);G.pending.defender=normal.id;G.pending.defense=target;flash(target+'!');log(`蓝队电脑使用 ${target}。`);let blocker=teamPlayers('red').find(p=>p.hand.includes('BLOCK'));if(blocker){G.currentRed=blocker.id;G.phase='block';showPrompt(`${target} 正在阻止你。是否使用 BLOCK？`,[{label:'使用 BLOCK',gold:true,fn:()=>{G.currentRed=blocker.id;playHumanCard('BLOCK')}},{label:'不用 BLOCK',fn:()=>resolveDefenseSuccess()}]);render()}else resolveDefenseSuccess();return}log('蓝队电脑选择不防守。');resolveSuccess()},650)}
function aiFinalBlitz(){let p=teamPlayers('blue').find(x=>x.hand.includes('BLITZ'));if(p&&Math.random()<.35){consume(p,'BLITZ');flash('BLITZ!');log('蓝队电脑在 BLOCK 后使用 BLITZ。');resolveFail()}else{log('蓝队电脑放弃最后 BLITZ。');resolveSuccess()}}
function resolveDefenseSuccess(){if(G.pending.defense==='INTERCEPTION'){G.holder=G.pending.defender;G.offense='blue';G.phase='ai';log(`INTERCEPTION 成功！FOOTBALL CARD 转移给 ${G.holder}。`);afterPlay()}else resolveFail()}
function resolveSuccess(){let adv=G.pending&&G.pending.qbBoost?2:1;if(G.pending.action==='PASS'&&G.pending.receiver)G.holder=G.pending.receiver;advance(G.offense,adv);if(G.phase!=='gameover'&&G.phase!=='touchdown')afterPlay()}
function resolveFail(){log('❌ 本次进攻失败，不推进。');afterPlay()}
function advance(t,n){let key=t==='red'?'redProgress':'blueProgress',old=G[key];G[key]=Math.min(4,G[key]+n);log(`✅ ${t==='red'?'红队':'蓝队'}进攻成功，推进${n}格。`);if(G[key]>=4){G.phase='touchdown';flash('TOUCHDOWN!');setTimeout(()=>{if(t==='red')G.redBalls++;else G.blueBalls++;log(`🏈 ${t==='red'?'红队':'蓝队'} TOUCHDOWN！获得1个🏈。`);G[key]=0;if((t==='red'?G.redBalls:G.blueBalls)>=3){G.phase='gameover';render();$('gameOverTitle').textContent=(t==='red'?'RED':'BLUE AI')+' WINS!';$('gameOverText').textContent='先获得3个🏈，比赛结束。';$('gameOver').classList.add('show');return}afterPlay()},900)}}
function afterPlay(){hidePrompt();if(G.phase==='gameover')return;G.pending=null;if(!teamHasOff('red')&&!teamHasOff('blue')){G.round++;G.firstTeam=G.firstTeam==='red'?'blue':'red';deal();G.offense=G.firstTeam;G.holder=null;log(`第${G.round}回合开始，重新发牌。先攻方交替为${G.firstTeam==='red'?'红队':'蓝队'}。`);beginPossession();return}if(!teamHasOff(G.offense)){G.offense=G.offense==='red'?'blue':'red';G.holder=null;log('当前进攻方已经没有 RUN/PASS，球权交给另一队。');beginPossession();return}if(!holder()||!hasOff(holder())){G.holder=null;beginPossession();return}if(G.offense==='red'){G.phase='attack';G.currentRed=G.holder;render()}else{G.phase='ai';render();setTimeout(aiAttack,650)}}
function beginPossession(){if(G.offense==='red'){G.phase='choose';let p=teamPlayers('red').find(hasOff);if(p)G.currentRed=p.id;log('红队进攻：请点击场上有 RUN/PASS 的红队球员选择持球者。');render()}else{G.phase='ai';let p=teamPlayers('blue').filter(hasOff);if(!p.length){afterPlay();return}let h=p[Math.floor(Math.random()*p.length)];G.holder=h.id;log(`蓝队电脑选择 ${h.id} 持有 FOOTBALL CARD。`);render();setTimeout(aiAttack,650)}}
function aiAttack(){let p=holder();if(!p||p.team!=='blue'||!hasOff(p)){beginPossession();return}let opts=p.hand.filter(c=>c==='RUN'||c==='PASS'),c=opts[Math.floor(Math.random()*opts.length)];consume(p,c);G.pending={action:c,attacker:p.id,receiver:null,qbBoost:false};if(c==='PASS'){let rec=teamPlayers('blue').filter(x=>x.id!==p.id);G.pending.receiver=rec[Math.floor(Math.random()*rec.length)].id;if(p.role==='QB'&&!p.skill&&Math.random()<.45){p.skill=true;G.pending.qbBoost=true;log('蓝队QB使用身份技能。')}}flash(c+'!');log(`蓝队电脑 ${p.id} 打出 ${c}。`);G.phase='defense';let need=c==='RUN'?'TACKLE':'INTERCEPTION';let eligible=teamPlayers('red').filter(x=>x.hand.includes(need)||x.hand.includes('BLITZ'));if(!eligible.length){log('红队没有可用防守牌，电脑进攻自动成功。');setTimeout(resolveSuccess,500);return}G.currentRed=eligible[0].id;showPrompt(`电脑打出 ${c}。请选择红队球员并使用 ${need} / BLITZ，或不防守。`,[{label:'不防守',fn:()=>resolveSuccess()}]);render()}
function aiBlockDecision(){let p=teamPlayers('blue').find(x=>x.hand.includes('BLOCK'));if(p&&Math.random()<.55){consume(p,'BLOCK');flash('BLOCK!');log('蓝队电脑使用 BLOCK，取消你的防守。');let blitzer=teamPlayers('red').find(x=>x.hand.includes('BLITZ'));if(blitzer){G.currentRed=blitzer.id;G.phase='final';showPrompt('电脑用 BLOCK 取消了你的防守。是否使用最后 BLITZ？',[{label:'使用 BLITZ',gold:true,fn:()=>{G.currentRed=blitzer.id;playHumanCard('BLITZ')}},{label:'放弃 BLITZ',fn:()=>resolveSuccess()}]);render()}else resolveSuccess()}else{log('蓝队电脑没有使用 BLOCK。');if(G.pending.defense==='INTERCEPTION'){G.holder=G.pending.defender;G.offense='red';log(`🦅 抄截成功！${G.holder} 获得 FOOTBALL CARD。`);afterPlay()}else resolveFail()}}
function doRps(me){let arr=['rock','paper','scissors'],ai=arr[Math.floor(Math.random()*3)],win=(me==='rock'&&ai==='scissors')||(me==='paper'&&ai==='rock')||(me==='scissors'&&ai==='paper');if(me===ai){$('rpsResult').textContent='平局！请再选一次。';return}$('rpsResult').textContent=`你：${me} / 电脑：${ai}。${win?'红队先攻！':'蓝队先攻！'}`;G.firstTeam=win?'red':'blue';G.offense=G.firstTeam;setTimeout(()=>{$('rps').classList.remove('show');beginPossession()},700)}
const manual=`<div class="toc"><a href="#s1">开局与分队</a><a href="#s2">石头剪刀布</a><a href="#s3">发牌</a><a href="#s4">每轮开始</a><a href="#s5">RUN</a><a href="#s6">PASS</a><a href="#s7">防守</a><a href="#s8">成功/失败</a><a href="#s9">换球权</a><a href="#s10">回合结束</a><a href="#s11">TOUCHDOWN</a><a href="#s12">获胜</a></div><div class="sec" id="s1"><h3>1 开局与分队</h3>选择2v2/3v3/4v4。你只控制红队，蓝队全部由电脑控制。每队随机1名QB。<br><b>FOOTBALL本身是一张FOOTBALL CARD，整场只有1张，单独代表球权。</b></div><div class="sec" id="s2"><h3>2 石头剪刀布</h3>第一轮由你和电脑石头剪刀布决定先攻。平局重来。之后每轮先攻方自动交替。</div><div class="sec" id="s3"><h3>3 发牌</h3>2v2每人7张；3v3每人6张；4v4每人5张。牌包括RUN/PASS/TACKLE/INTERCEPTION/BLOCK/BLITZ。不是出一张补一张，一轮结束才统一重发。</div><div class="sec" id="s4"><h3>4 每轮开始</h3>先攻方选择一名有RUN或PASS的球员持有FOOTBALL CARD。只有持球者发动进攻。</div><div class="sec" id="s5"><h3>5 RUN完整流程</h3><div class="chain">RUN → 不防守 = ✅成功</div><div class="chain">RUN → BLITZ = ❌失败</div><div class="chain">RUN → TACKLE → 不BLOCK = ❌失败</div><div class="chain">RUN → TACKLE → BLOCK → 不BLITZ = ✅成功</div><div class="chain">RUN → TACKLE → BLOCK → BLITZ = ❌失败</div>TACKLE不能抢走FOOTBALL CARD。</div><div class="sec" id="s6"><h3>6 PASS完整流程</h3><div class="chain">PASS → 不防守 = ✅成功</div><div class="chain">PASS → BLITZ = ❌失败</div><div class="chain">PASS → INTERCEPTION → 不BLOCK = 🦅抄截成功，换球权</div><div class="chain">PASS → INTERCEPTION → BLOCK → 不BLITZ = ✅成功</div><div class="chain">PASS → INTERCEPTION → BLOCK → BLITZ = ❌失败</div>PASS成功后FOOTBALL CARD交给接球队友。</div><div class="sec" id="s7"><h3>7 防守</h3>对RUN：TACKLE / BLITZ / 不防守。对PASS：INTERCEPTION / BLITZ / 不防守。TACKLE或INTERCEPTION被BLOCK后，防守方还有最后BLITZ机会。</div><div class="sec" id="s8"><h3>8 成功/失败</h3>✅成功：系统自动推进。❌失败：不推进。🦅抄截成功：FOOTBALL CARD直接转移给成功抄截球员。</div><div class="sec" id="s9"><h3>9 换球权</h3>INTERCEPTION成功立即换球权。持球者没RUN/PASS但队友还有，则同队换持球者。整队没RUN/PASS则球权给另一队。</div><div class="sec" id="s10"><h3>10 回合结束</h3>双方都没有RUN/PASS时一轮结束，统一收牌、洗牌、重新发牌；码线推进不清零；下一轮先攻方交替。</div><div class="sec" id="s11"><h3>11 TOUCHDOWN</h3>50→40→30→20→10。第4次成功后自动冲入END ZONE，直接TOUCHDOWN，获得1个🏈，不需要第5次进攻。</div><div class="sec" id="s12"><h3>12 获胜</h3>先获得3个🏈的队伍立即获胜。</div>`;
const rules=`<div class="toc"><a href="#r1">进攻</a><a href="#r2">防守</a><a href="#r3">QB技能</a><a href="#r4">结果</a></div><div class="sec" id="r1"><h3>进攻流程</h3>持球者选择RUN或PASS。RUN成功后球仍在原持球者。PASS先选接球队友，成功后FOOTBALL CARD交给接球人。</div><div class="sec" id="r2"><h3>防守流程</h3>RUN可用TACKLE或BLITZ；PASS可用INTERCEPTION或BLITZ。TACKLE/INTERCEPTION出现后，进攻方可BLOCK；BLOCK后防守方还可BLITZ。</div><div class="sec" id="r3"><h3>QB技能</h3>QB打PASS并选择接球人后，可选择使用一次技能。若PASS最终成功，本次推进2格；如果最终失败，技能也消耗，不返还。</div><div class="sec" id="r4"><h3>系统结算</h3>成功/失败由系统自动判断。成功推进；失败不推进；INTERCEPTION成功立即换球权。第4次成功自动TOUCHDOWN。</div>`;
$('manualBtn').onclick=()=>{$('docTitle').textContent='说明书';$('docBody').innerHTML=manual;$('doc').classList.add('show')};$('rulesBtn').onclick=()=>{$('docTitle').textContent='玩法说明';$('docBody').innerHTML=rules;$('doc').classList.add('show')};$('closeDoc').onclick=()=>$('doc').classList.remove('show');$('resetBtn').onclick=()=>location.reload();$('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');G.size=+b.dataset.size});$('startBtn').onclick=()=>{$('setup').classList.remove('show');init()};document.querySelectorAll('[data-rps]').forEach(b=>b.onclick=()=>doRps(b.dataset.rps));render();
</script>
