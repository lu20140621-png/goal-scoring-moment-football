<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goal-Scoring Moment Football — Strategy Tutorial</title>
<link rel="stylesheet" href="strategy-tutorial-v3.css?v=20260825-cards2">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">🎓🏈 GOAL-SCORING MOMENT · STRATEGY TUTORIAL</div>
    <div class="topBtns"><a class="btn" href="index.html" id="homeBtn">← 首页</a><a class="btn" href="strategy-game.html" id="gameBtn">单机游戏</a><button class="btn gold" id="selectLessonBtn">选择教程</button><button class="btn" id="restartBtn">重新学习</button><button class="btn" id="langBtn">Switch to English</button></div>
  </div>
  <div class="grid">
    <div class="panel">
      <div class="stepbar" id="stepbar"></div>
      <div class="pitch" id="pitch"><div class="pitchBorder"></div><div class="end left">RED END ZONE</div><div class="end right">BLUE END ZONE</div><div id="yards"></div><div class="los" id="los"></div><div class="badge" id="badge">BALL ON 50</div>
        <div class="player red" id="r1" style="left:42%;top:34%">R1<img class="footballCardMini" id="ball1" style="display:none" src="cards/football-card.png" alt="FOOTBALL CARD"></div>
        <div class="player red" id="r2" style="left:42%;top:61%">R2<small>QB</small><img class="footballCardMini" id="ball2" style="display:none" src="cards/football-card.png" alt="FOOTBALL CARD"></div>
        <div class="player blue" id="b1" style="left:58%;top:34%">B1<img class="footballCardMini" id="ball3" style="display:none" src="cards/football-card.png" alt="FOOTBALL CARD"></div>
        <div class="player blue" id="b2" style="left:58%;top:61%">B2<small>QB</small></div><div class="flash" id="flash"></div>
      </div>
      <div class="scoreline"><div class="scorebox">RED<b id="rs">🏈 0 / 3</b></div><div class="scorebox"><span id="round">ROUND 1 · RED OFFENSE</span><b id="pos">50 YD</b></div><div class="scorebox">BLUE<b id="bs">🏈 0 / 3</b></div></div>
    </div>
    <div class="panel side"><div id="lessonNo" style="font-size:11px;color:#e6bf62;font-weight:950"></div><h2 id="title"></h2><p id="text"></p><div class="rulebox" id="rule"></div><div class="flow" id="flow"></div><div class="cards" id="cards"></div><div class="actions" id="actions"></div><div class="result" id="result"></div><div class="toast" id="toast"></div></div>
  </div>
</div>
<div class="overlay" id="lessonModal"><div class="dialog"><h2 id="lessonModalTitle">选择要重新学习的教程</h2><p id="lessonModalText">点击任意章节，会直接回到该步骤重新学习。</p><div class="lessonGrid" id="lessonGrid"></div><div class="dialogBtns"><button class="secondary" id="closeLessonBtn">关闭</button><button class="primary" id="restartFromModalBtn">从第1步重新学习</button></div></div></div>
<div class="overlay" id="finishModal"><div class="dialog"><h2 id="finishTitle">🎉 教程完成</h2><p id="finishText">你已经完成策略模式完整教程。你可以从第1步重新学习，或者回到主页选择游戏模式。</p><div class="dialogBtns"><button class="primary" id="finishRestartBtn">重新学习</button><a class="secondary" href="index.html" id="finishHomeBtn">回到主页</a></div></div></div>

</html>
