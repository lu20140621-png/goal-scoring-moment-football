<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strategy Tutorial</title><style>*{box-sizing:border-box}html,body{margin:0;background:#07101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,a{font:inherit}.app{max-width:1420px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0c2d53;border:2px solid #2d6395;border-radius:12px;padding:10px 12px}.brand{font-weight:950}.btn{border:1px solid #567da0;background:#12365b;color:#fff;border-radius:8px;padding:8px 11px;font-weight:900;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 390px;gap:10px;margin-top:10px}.panel{background:#092845;border:2px solid #2d6192;border-radius:11px;padding:10px}.field{position:relative;aspect-ratio:16/9;min-height:430px;overflow:hidden;border:3px solid #dce6ea;border-radius:7px;background:linear-gradient(90deg,#51472b 0 9%,transparent 9% 91%,#16465a 91%),repeating-linear-gradient(90deg,#168143 0 10%,#1c934d 10% 20%)}.fieldBorder{position:absolute;inset:5% 9%;border:2px solid #fff;pointer-events:none}.yardLine{position:absolute;top:5%;bottom:5%;width:1px;background:#ffffff55}.yardText{position:absolute;top:10%;transform:translateX(-50%);font-size:20px;font-weight:950;color:#ffffff77}.yardText.bottom{top:auto;bottom:10%}.end{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:950;letter-spacing:.1em}.end.left{left:2%}.end.right{right:2%}.los{position:absolute;top:5%;bottom:5%;left:50%;width:3px;background:#ffd54a;transition:.5s}.badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#211807;border:2px solid #d1a83f;border-radius:999px;padding:5px 9px;color:#ffe28d;font-weight:950;font-size:11px;transition:.5s}.player{position:absolute;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;font-weight:950;cursor:pointer;z-index:5;transition:.25s}.player small{display:block;font-size:8px}.player.red{background:#d34a4a}.player.blue{background:#3f77d9}.player.target{outline:5px solid #ffd75b;box-shadow:0 0 28px #ffd75b;animation:pulse .75s infinite alternate}.player.target:before{content:'▼';position:absolute;top:-42px;left:50%;transform:translateX(-50%);font-size:28px;color:#ffd75b;animation:bounce .55s infinite alternate}.ball{position:absolute;right:-13px;top:-15px;font-size:22px}.side h2{margin:0 0 5px;color:#f0cf78}.side p{line-height:1.58;color:#d4e0e8;margin:6px 0}.rulebox{margin:8px 0;background:#0d3657;border-left:4px solid #f0c85d;padding:9px 10px;border-radius:8px;font-size:12px;line-height:1.55;color:#e4edf3}.result{margin-top:8px;padding:8px 10px;border-radius:8px;background:#102f26;border:1px solid #3c7e61;font-size:12px;font-weight:850}.stepbar{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin:10px 0}.dot{height:6px;background:#27435c;border-radius:999px}.dot.on{background:#e0b84e}.cards{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:34px}.card{position:relative;width:96px;height:134px;border-radius:12px;background:linear-gradient(155deg,#fcf8e8,#ddd4bd);border:3px solid #fff;color:#172018;padding:9px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-weight:950;cursor:pointer}.card .ico{font-size:28px}.card small{text-align:center;font-size:8px;color:#465148}.card.target{outline:4px solid #ffd75b;box-shadow:0 0 28px #ffd75b;animation:float .8s ease-in-out infinite alternate}.card.target:before{content:'▼';position:absolute;top:-39px;left:50%;transform:translateX(-50%);font-size:29px;color:#ffd75b;animation:bounce .55s infinite alternate}.card.target:after{content:attr(data-tip);position:absolute;top:-63px;left:50%;transform:translateX(-50%);background:#ffd75b;color:#211806;border-radius:999px;padding:3px 7px;font-size:9px;white-space:nowrap}.card.wrong,.player.wrong{animation:shake .28s linear 2}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:28px}.act{position:relative;border:1px solid #567da0;background:#12365b;color:#fff;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.act.target{background:#d8ad49;color:#211708;animation:glow 1s infinite}.act.target:before{content:'↓';position:absolute;top:-31px;left:50%;transform:translateX(-50%);font-size:25px;color:#ffd75b}.toast{min-height:28px;margin-top:8px;color:#ffdc78;font-weight:900}.flow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.flow span{background:#0e3b5b;border:1px solid #397093;border-radius:999px;padding:4px 7px;font-size:10px}.flow span.on{background:#d9ad49;color:#211708}.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#06121de8;border:2px solid #ffd75b;border-radius:14px;padding:12px 16px;font-size:24px;font-weight:950;color:#ffd75b;z-index:20;opacity:0}.flash.show{animation:flash .8s ease}.scoreline{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.scorebox{flex:1;background:#071b2d;border:1px solid #35668d;border-radius:8px;padding:7px;text-align:center;font-size:11px}.scorebox b{display:block;color:#f0cf78;font-size:16px}@keyframes pulse{to{transform:scale(1.09)}}@keyframes float{to{transform:translateY(-10px) scale(1.05)}}@keyframes bounce{to{transform:translateX(-50%) translateY(-8px)}}@keyframes glow{50%{box-shadow:0 0 0 8px #ffd75b18}}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:940px){.grid{grid-template-columns:1fr}.field{min-height:370px}}@media(max-width:560px){.app{padding:5px}.top{align-items:flex-start}.field{aspect-ratio:10/12;min-height:520px}.player{width:40px;height:40px;font-size:10px}.yardText{font-size:14px}.card{width:78px;height:112px}.card .ico{font-size:23px}.stepbar{gap:2px}.side h2{font-size:18px}}</style></head><body><div class="app"><div class="top"><div class="brand">🎓🏈 GOAL-SCORING MOMENT · STRATEGY TUTORIAL</div><div><a class="btn" href="index.html" id="home">← 首页</a> <a class="btn" href="strategy-game.html" id="game">单机游戏</a> <button class="btn" id="lang">中文 / EN</button></div></div><div class="grid"><div class="panel"><div class="stepbar" id="stepbar"></div><div class="field" id="field"><div class="fieldBorder"></div><div class="end left">RED END ZONE</div><div class="end right">BLUE END ZONE</div><div id="yards"></div><div class="los" id="los"></div><div class="badge" id="badge">BALL ON 50</div><div class="player red" id="r1" style="left:42%;top:34%">R1<div class="ball" id="ball1" style="display:none">🏈</div></div><div class="player red" id="r2" style="left:42%;top:61%">R2<small>QB</small><div class="ball" id="ball2" style="display:none">🏈</div></div><div class="player blue" id="b1" style="left:58%;top:34%">B1<div class="ball" id="ball3" style="display:none">🏈</div></div><div class="player blue" id="b2" style="left:58%;top:61%">B2<small>QB</small></div><div class="flash" id="flash"></div></div><div class="scoreline"><div class="scorebox">RED<b id="rs">🏈 0 / 3</b></div><div class="scorebox"><span id="round">ROUND 1 · RED OFFENSE</span><b id="pos">50 YD</b></div><div class="scorebox">BLUE<b>🏈 0 / 3</b></div></div></div><div class="panel side"><div id="lessonNo" style="font-size:11px;color:#e6bf62;font-weight:950"></div><h2 id="title"></h2><p id="text"></p><div class="rulebox" id="rule"></div><div class="flow" id="flow"></div><div class="cards" id="cards"></div><div class="actions" id="actions"></div><div class="result" id="result"></div><div class="toast" id="toast"></div></div></div></div><script>const $=id=>document.getElementById(id);let step=0,lang='zh',holder=null;const IC={RUN:'🏃',PASS:'🎯',TACKLE:'💥',INTERCEPTION:'🦅',BLOCK:'🛡️',BLITZ:'⚡'};const Z=[
{t:'1. 先知道整场游戏怎么组成',x:'策略模式可以选择 2v2、3v3 或 4v4。单机游戏里你只控制红队，蓝队全部由电脑控制。每队系统分配1名 QB，其余是普通球员。',r:'发牌数量：2v2 每人7张；3v3 每人6张；4v4 每人5张。功能牌不会“出1张马上补1张”。',f:['选择人数','系统分队','每队1名QB'],b:'我明白了'},
{t:'2. FOOTBALL 本身是一张卡',x:'整场比赛只有1张 FOOTBALL CARD。它不是普通功能牌，也不是棋子；它专门表示球权。谁拿着它，谁就是当前持球者。',r:'RUN / PASS / TACKLE / INTERCEPTION / BLOCK / BLITZ 是普通功能牌；FOOTBALL CARD 独立跟随持球者。',f:['FOOTBALL CARD','=球权','只有1张'],b:'继续'},
{t:'3. 第一轮先用石头剪刀布',x:'正式比赛开局先用石头剪刀布决定第一轮谁先攻。你代表红队，电脑代表蓝队。这里请点“石头”，教程设定红队获胜。',r:'只有第一轮需要猜拳。之后每一轮的先攻方自动红→蓝→红→蓝交替。',f:['石头剪刀布','决定第一轮先攻','之后轮流先攻'],choices:['✊ 石头','🖐️ 布','✌️ 剪刀'],targetButton:0},
{t:'4. 先攻方选择持球者',x:'红队赢得第一轮先攻。现在请点击球场上的 R1，把 FOOTBALL CARD 交给 R1。',r:'一轮开始时，先攻方应选择手里有 RUN 或 PASS 的球员作为持球者。只有当前持球者可以发动下一次进攻。',f:['红队先攻','选择R1','FOOTBALL CARD→R1'],player:'r1'},
{t:'5. 一个进攻动作怎么开始',x:'持球者 R1 现在可以选择 RUN 或 PASS。这里先学习跑球，请点击正在跳动的 RUN。',r:'进攻方每次先由当前持球者打出 RUN 或 PASS，然后才进入防守反应阶段。',f:['持球者行动','RUN / PASS','进入防守'],cards:['RUN','PASS','BLOCK'],target:'RUN'},
{t:'6. RUN 后防守方有哪些选择',x:'R1 打出 RUN 后，蓝队可以：① TACKLE；② BLITZ；③ 不防守。这里模拟蓝队打出 TACKLE，请点击 TACKLE。',r:'TACKLE 只用于阻止 RUN。它不会直接把 FOOTBALL CARD 抢走。BLITZ 也可以直接让这次 RUN 失败。',f:['RUN','TACKLE / BLITZ / 不防守'],cards:['TACKLE','BLITZ'],target:'TACKLE'},
{t:'7. TACKLE 后进攻方可以 BLOCK',x:'蓝队 TACKLE 正在阻止这次 RUN。红队如果有 BLOCK，可以取消这张 TACKLE。请点击 BLOCK。',r:'如果红队不出 BLOCK：RUN 立即失败，不推进，FOOTBALL CARD 仍留在 R1。',f:['RUN','TACKLE','BLOCK'],cards:['BLOCK','PASS','RUN'],target:'BLOCK'},
{t:'8. BLOCK 后还有最后一次防守机会',x:'BLOCK 取消了 TACKLE。此时蓝队如果还有 BLITZ，可以做最后反制。这里选择“不使用 BLITZ”。',r:'结果对照：RUN→TACKLE→BLOCK→不BLITZ = RUN成功；如果最后再出BLITZ = RUN失败。',f:['TACKLE被取消','是否BLITZ','不BLITZ=成功'],choices:['不使用 BLITZ','使用 BLITZ'],targetButton:0},
{t:'9. RUN 成功后发生什么',x:'这次 RUN 成功，系统自动把红队从 50 推进到 40。R1 仍然拿着 FOOTBALL CARD，不需要换持球者。',r:'成功=推进1格；失败=不推进。系统自动结算，不需要玩家自己点“+1”。',f:['RUN成功','50→40','R1继续持球'],b:'查看推进结果',advance:1},
{t:'10. 现在学习 PASS',x:'R1 继续持球。请点击 PASS。PASS 不会立刻完成，还必须先选择接球队友。',r:'PASS 成功后，FOOTBALL CARD 会从传球者转移给你选择的接球人。',f:['R1持球','PASS','选择接球人'],cards:['PASS','RUN','BLOCK'],target:'PASS'},
{t:'11. PASS 后选择接球人',x:'请点击同队的 R2。这里 R2 是 QB，但此刻他只是作为接球人。',r:'选择接球人只是指定 PASS 的目标。防守还没有结束，所以此时球权尚未最终转移。',f:['PASS','选择R2','等待防守'],player:'r2'},
{t:'12. PASS 后防守方怎么反应',x:'PASS 发出后，蓝队可以：① INTERCEPTION；② BLITZ；③ 不防守。这里请点击 INTERCEPTION。',r:'INTERCEPTION 只针对 PASS。若最终抄截成功，FOOTBALL CARD 会直接转给成功抄截的防守球员，并立即换球权。',f:['PASS','INTERCEPTION / BLITZ / 不防守'],cards:['INTERCEPTION','BLITZ'],target:'INTERCEPTION'},
{t:'13. INTERCEPTION 也可以被 BLOCK',x:'如果红队有 BLOCK，可以取消这次 INTERCEPTION。这里请点击 BLOCK。',r:'如果不出 BLOCK：INTERCEPTION 成功，球权直接给蓝队；如果 BLOCK 成功取消抄截，则 PASS 继续存活。',f:['INTERCEPTION','BLOCK','抄截被取消'],cards:['BLOCK','RUN'],target:'BLOCK'},
{t:'14. PASS 成功后的球权',x:'假设蓝队没有最后 BLITZ，这次 PASS 成功。FOOTBALL CARD 从 R1 交给 R2，R2 成为新的持球者，同时红队推进1格。',r:'PASS成功=接球人成为新持球者；PASS失败=不推进；INTERCEPTION成功=立即换成防守方持球。',f:['PASS成功','球→R2','推进1格'],b:'完成这次PASS',advance:1,passToR2:true},
{t:'15. QB 身份技能什么时候用',x:'现在持球者 R2 是 QB。QB 打出 PASS 并选好接球人后，会弹出“是否使用身份技能”。请点击 PASS，再选择“使用QB技能”。',r:'QB技能每局只能使用1次。使用后，如果这次 PASS 最终成功，本次推进2格；如果最终失败，技能也已经消耗，不返还。',f:['QB持球','PASS','是否使用技能','成功=推进2格'],cards:['PASS','RUN'],target:'PASS',after:'使用 QB 技能'},
{t:'16. INTERCEPTION 成功时怎么换球权',x:'现在看失败分支：假设 PASS 被 B1 的 INTERCEPTION 成功抄截，而且红队没有 BLOCK。请点击 B1，模拟 FOOTBALL CARD 转移。',r:'抄截成功后不只是“这次PASS失败”，而是球权立即改变：B1 成为蓝队持球者，蓝队接下来可以进攻。',f:['PASS','INTERCEPTION成功','FOOTBALL→B1','蓝队球权'],player:'b1',intercept:true},
{t:'17. 一轮什么时候结束',x:'一轮不是一次进攻。双方会继续使用各自现有手牌。只有当红蓝双方都没有 RUN / PASS 可以继续发动进攻时，这一轮才结束。',r:'一轮结束后：收回普通功能牌→洗牌→按2v2/3v3/4v4重新发7/6/5张。不是每出一张就补一张。下一轮先攻方与上一轮相反。',f:['双方都无RUN/PASS','收牌洗牌','统一重发','先攻方交替'],b:'模拟回合结束'},
{t:'18. TOUCHDOWN 与最终获胜',x:'每个进攻方向从50码开始。成功推进依次是 50→40→30→20→10；第4次成功后持球者自动冲入 END ZONE，判定 TOUCHDOWN。',r:'一次 TOUCHDOWN 获得1个🏈。达阵后开始新的推进。先获得3个🏈的队伍立即赢得整场比赛。',f:['4次成功','TOUCHDOWN','+1🏈','先到3个获胜'],b:'完成教程',finish:true}
];const E=Z.map((s,i)=>({...s,t:['1. Game setup','2. The FOOTBALL is a card','3. Rock-Paper-Scissors','4. Choose the ball carrier','5. Start an offensive play','6. Defense against RUN','7. BLOCK the TACKLE','8. Final BLITZ window','9. Resolve a successful RUN','10. Learn PASS','11. Choose the receiver','12. Defense against PASS','13. BLOCK the INTERCEPTION','14. Resolve a successful PASS','15. QB role skill','16. Successful INTERCEPTION','17. When a round ends','18. TOUCHDOWN and winning'][i],x:['Choose 2v2, 3v3, or 4v4. In Solo Mode you control Red only; Blue is fully computer-controlled. Each team has one QB.','There is exactly one FOOTBALL CARD. It is not a normal Action Card; it represents possession. Whoever holds it is the ball carrier.','Round 1 uses Rock-Paper-Scissors to decide first offense. Choose Rock here; the tutorial gives Red the win.','Red won first offense. Tap R1 to give R1 the FOOTBALL CARD.','R1 is the ball carrier. Start offense by playing RUN or PASS. Play RUN now.','After RUN, Blue may TACKLE, BLITZ, or play no defense. Play TACKLE here.','TACKLE is stopping RUN. Red may use BLOCK to cancel TACKLE. Play BLOCK.','After BLOCK cancels TACKLE, Blue may still use a final BLITZ. Choose No BLITZ here.','RUN succeeds. The system advances Red from the 50 to the 40. R1 keeps the FOOTBALL CARD.','Now play PASS. A PASS still needs a receiver before it can resolve.','Tap teammate R2 as the intended receiver.','After PASS, Blue may INTERCEPTION, BLITZ, or play no defense. Play INTERCEPTION.','Red may BLOCK the INTERCEPTION. Play BLOCK now.','With no final BLITZ, PASS succeeds. Move the FOOTBALL CARD from R1 to R2 and advance one space.','R2 is a QB. When a QB plays PASS and chooses a receiver, the game asks whether to use the once-per-game QB skill.','Now see the failure branch: a successful INTERCEPTION transfers the FOOTBALL CARD to B1 and changes possession immediately.','A round is not one play. It ends only when both teams have no RUN/PASS left. Then gather, shuffle, and redeal all normal Action Cards.','Start at the 50. Successful plays move 50→40→30→20→10; the 4th success triggers the run into the END ZONE for a TOUCHDOWN. First to 3 🏈 wins.'][i],r:['Hand size: 2v2 = 7 each; 3v3 = 6 each; 4v4 = 5 each. Do not replace a card immediately after playing it.','RUN / PASS / TACKLE / INTERCEPTION / BLOCK / BLITZ are normal Action Cards. The FOOTBALL CARD is separate.','Only Round 1 uses RPS. First offense alternates in later rounds.','At round start, choose a player who has RUN or PASS. Only the current ball carrier can start the next offensive play.','Every play begins with the ball carrier choosing RUN or PASS, then defense gets a response window.','TACKLE only stops RUN; it does not steal the FOOTBALL CARD. BLITZ can also make the RUN fail.','Without BLOCK, the RUN fails and does not advance. The FOOTBALL CARD stays with R1.','RUN→TACKLE→BLOCK→No BLITZ = success. A final BLITZ makes it fail.','Success advances automatically. Failure does not advance. Players never press a manual +1 button.','On a successful PASS, the FOOTBALL CARD moves to the selected receiver.','Choosing the receiver does not finish the PASS; defense still responds next.','INTERCEPTION is for PASS. If it succeeds, possession changes immediately.','No BLOCK = interception succeeds. BLOCK cancels the interception and keeps PASS alive.','Successful PASS = receiver becomes new ball carrier and the offense advances.','QB skill is once per game. If used, a finally successful PASS advances 2 spaces. If the play finally fails, the skill is still spent.','A successful interception is both a failed PASS and an immediate possession change.','Round end: collect normal Action Cards, shuffle, redeal 7/6/5 by mode. Next round first offense alternates.','A TOUCHDOWN awards 1 🏈. First team to collect 3 🏈 wins immediately.'][i]}));function data(){return lang==='zh'?Z:E}function yards(){const root=$('yards');root.innerHTML='';[18,26,34,42,50,58,66,74,82].forEach((x,i)=>{let l=document.createElement('div');l.className='yardLine';l.style.left=x+'%';root.appendChild(l);let n=document.createElement('div');n.className='yardText';n.style.left=x+'%';n.textContent=[10,20,30,40,50,40,30,20,10][i];root.appendChild(n);let b=n.cloneNode(true);b.className='yardText bottom';root.appendChild(b)})}function wrong(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),650)}function fx(t){$('flash').textContent=t;$('flash').classList.remove('show');void $('flash').offsetWidth;$('flash').classList.add('show')}function clearTargets(){['r1','r2','b1','b2'].forEach(id=>$(id).classList.remove('target'))}function setBall(who){holder=who;['ball1','ball2','ball3'].forEach(x=>$(x).style.display='none');if(who==='r1')$('ball1').style.display='block';if(who==='r2')$('ball2').style.display='block';if(who==='b1')$('ball3').style.display='block'}function advance(n){let current=parseInt($('pos').textContent)||50;let seq=[50,40,30,20,10],idx=seq.indexOf(current);idx=Math.min(4,Math.max(0,idx+n));$('pos').textContent=seq[idx]+' YD';let x=[50,58,66,74,82][idx];$('los').style.left=x+'%';$('badge').style.left=x+'%';$('badge').textContent='BALL ON '+seq[idx]}function next(){if(step<17){step++;render()}else $('toast').textContent=lang==='zh'?'✅ 教程完成！现在可以进入单机游戏。':'✅ Tutorial complete! You are ready for Solo Game.'}function cardClick(type,el){let d=data()[step];if(d.target!==type){wrong(el);$('toast').textContent=lang==='zh'?'这一步不是这张牌，看黄色箭头。':'Not this card. Follow the yellow arrow.';return}fx(type+'!');if(step===4){}if(step===9){}if(step===14){setTimeout(()=>showAfter(d.after),400);return}setTimeout(next,450)}function playerClick(id){let d=data()[step];if(d.player!==id){wrong($(id));return}if(id==='r1')setBall('r1');if(id==='r2'&&step===10){}if(d.intercept)setBall('b1');fx(id.toUpperCase()+(d.intercept?' · INTERCEPTION!':'!'));setTimeout(next,450)}function showAfter(label){$('actions').innerHTML='';let b=document.createElement('button');b.classNam
