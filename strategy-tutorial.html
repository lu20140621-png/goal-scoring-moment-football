<style>
*{box-sizing:border-box}html,body{margin:0;background:#07101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,a{font:inherit}.app{max-width:1420px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0c2d53;border:2px solid #2d6395;border-radius:12px;padding:10px 12px}.brand{font-weight:950}.topBtns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #567da0;background:#12365b;color:#fff;border-radius:8px;padding:8px 11px;font-weight:900;text-decoration:none;cursor:pointer}.btn.gold{background:#d8ad49;color:#211708;border-color:#f0cf78}.grid{display:grid;grid-template-columns:1fr 390px;gap:10px;margin-top:10px}.panel{background:#092845;border:2px solid #2d6192;border-radius:11px;padding:10px}.field{position:relative;aspect-ratio:16/9;min-height:430px;overflow:hidden;border:3px solid #dce6ea;border-radius:7px;background:linear-gradient(90deg,#51472b 0 9%,transparent 9% 91%,#16465a 91%),repeating-linear-gradient(90deg,#168143 0 10%,#1c934d 10% 20%)}.fieldBorder{position:absolute;inset:5% 9%;border:2px solid #fff;pointer-events:none}.yardLine{position:absolute;top:5%;bottom:5%;width:1px;background:#ffffff55}.yardText{position:absolute;top:10%;transform:translateX(-50%);font-size:20px;font-weight:950;color:#ffffff77}.yardText.bottom{top:auto;bottom:10%}.end{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:950;letter-spacing:.1em}.end.left{left:2%}.end.right{right:2%}.los{position:absolute;top:5%;bottom:5%;left:50%;width:3px;background:#ffd54a;transition:.5s}.badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#211807;border:2px solid #d1a83f;border-radius:999px;padding:5px 9px;color:#ffe28d;font-weight:950;font-size:11px;transition:.5s}.player{position:absolute;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;font-weight:950;cursor:pointer;z-index:5;transition:.25s}.player small{display:block;font-size:8px}.player.red{background:#d34a4a}.player.blue{background:#3f77d9}.player.target{outline:5px solid #ffd75b;box-shadow:0 0 28px #ffd75b;animation:pulse .75s infinite alternate}.player.target:before{content:'▼';position:absolute;top:-42px;left:50%;transform:translateX(-50%);font-size:28px;color:#ffd75b;animation:bounce .55s infinite alternate}.ball{position:absolute;right:-13px;top:-15px;font-size:22px}.side h2{margin:0 0 5px;color:#f0cf78}.side p{line-height:1.58;color:#d4e0e8;margin:6px 0}.rulebox{margin:8px 0;background:#0d3657;border-left:4px solid #f0c85d;padding:9px 10px;border-radius:8px;font-size:12px;line-height:1.55;color:#e4edf3}.result{margin-top:8px;padding:8px 10px;border-radius:8px;background:#102f26;border:1px solid #3c7e61;font-size:12px;font-weight:850}.stepbar{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin:10px 0}.dot{height:6px;background:#27435c;border-radius:999px}.dot.on{background:#e0b84e}.cards{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:34px}.card{position:relative;width:96px;height:134px;border-radius:12px;background:linear-gradient(155deg,#fcf8e8,#ddd4bd);border:3px solid #fff;color:#172018;padding:9px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-weight:950;cursor:pointer}.card .ico{font-size:28px}.card small{text-align:center;font-size:8px;color:#465148}.card.target{outline:4px solid #ffd75b;box-shadow:0 0 28px #ffd75b;animation:float .8s ease-in-out infinite alternate}.card.target:before{content:'▼';position:absolute;top:-39px;left:50%;transform:translateX(-50%);font-size:29px;color:#ffd75b;animation:bounce .55s infinite alternate}.card.target:after{content:attr(data-tip);position:absolute;top:-63px;left:50%;transform:translateX(-50%);background:#ffd75b;color:#211806;border-radius:999px;padding:3px 7px;font-size:9px;white-space:nowrap}.card.wrong,.player.wrong,.act.wrong{animation:shake .28s linear 2}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:28px}.act{position:relative;border:1px solid #567da0;background:#12365b;color:#fff;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.act.target{background:#d8ad49;color:#211708;animation:glow 1s infinite}.act.target:before{content:'↓';position:absolute;top:-31px;left:50%;transform:translateX(-50%);font-size:25px;color:#ffd75b}.toast{min-height:28px;margin-top:8px;color:#ffdc78;font-weight:900}.flow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.flow span{background:#0e3b5b;border:1px solid #397093;border-radius:999px;padding:4px 7px;font-size:10px}.flow span.on{background:#d9ad49;color:#211708}.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#06121de8;border:2px solid #ffd75b;border-radius:14px;padding:12px 16px;font-size:24px;font-weight:950;color:#ffd75b;z-index:20;opacity:0}.flash.show{animation:flash .8s ease}.scoreline{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.scorebox{flex:1;background:#071b2d;border:1px solid #35668d;border-radius:8px;padding:7px;text-align:center;font-size:11px}.scorebox b{display:block;color:#f0cf78;font-size:16px}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.overlay.show{display:flex}.dialog{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0d2940;border:2px solid #dcb14b;border-radius:18px;padding:18px}.dialog h2{margin:0 0 6px;color:#f0cf78}.dialog p{color:#d4e0e8;line-height:1.55}.dialogBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.dialogBtns button,.dialogBtns a{display:block;text-align:center;border:0;border-radius:11px;padding:13px;font-weight:950;text-decoration:none;cursor:pointer}.dialogBtns .primary{background:#dfb34c;color:#251b07}.dialogBtns .secondary{background:#173f5c;color:#fff}.lessonGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.lessonPick{border:1px solid #416f92;background:#10344e;color:#fff;border-radius:10px;padding:10px;text-align:left;cursor:pointer;font-size:12px;line-height:1.35}.lessonPick:hover{background:#174c70}.lessonPick b{display:block;color:#f3cf78;margin-bottom:3px}@keyframes pulse{to{transform:scale(1.09)}}@keyframes float{to{transform:translateY(-10px) scale(1.05)}}@keyframes bounce{to{transform:translateX(-50%) translateY(-8px)}}@keyframes glow{50%{box-shadow:0 0 0 8px #ffd75b18}}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:940px){.grid{grid-template-columns:1fr}.field{min-height:370px}.lessonGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:5px}.top{align-items:flex-start;flex-direction:column}.topBtns{justify-content:flex-start}.field{aspect-ratio:10/12;min-height:520px}.player{width:40px;height:40px;font-size:10px}.yardText{font-size:14px}.card{width:78px;height:112px}.card .ico{font-size:23px}.stepbar{gap:2px}.side h2{font-size:18px}.lessonGrid{grid-template-columns:1fr}.dialogBtns{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">🎓🏈 GOAL-SCORING MOMENT · STRATEGY TUTORIAL</div>
    <div class="topBtns">
      <a class="btn" href="index.html" id="homeBtn">← 首页</a>
      <a class="btn" href="strategy-game.html" id="gameBtn">单机游戏</a>
      <button class="btn gold" id="selectLessonBtn">选择教程</button>
      <button class="btn" id="restartBtn">重新学习</button>
      <button class="btn" id="langBtn">切换到英文</button>
    </div>
  </div>
  <div class="grid">
    <div class="panel">
      <div class="stepbar" id="stepbar"></div>
      <div class="field" id="field">
        <div class="fieldBorder"></div><div class="end left">RED END ZONE</div><div class="end right">BLUE END ZONE</div><div id="yards"></div><div class="los" id="los"></div><div class="badge" id="badge">BALL ON 50</div>
        <div class="player red" id="r1" style="left:42%;top:34%">R1<div class="ball" id="ball1" style="display:none">🏈</div></div>
        <div class="player red" id="r2" style="left:42%;top:61%">R2<small>QB</small><div class="ball" id="ball2" style="display:none">🏈</div></div>
        <div class="player blue" id="b1" style="left:58%;top:34%">B1<div class="ball" id="ball3" style="display:none">🏈</div></div>
        <div class="player blue" id="b2" style="left:58%;top:61%">B2<small>QB</small></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="scoreline"><div class="scorebox">RED<b id="rs">🏈 0 / 3</b></div><div class="scorebox"><span id="round">ROUND 1 · RED OFFENSE</span><b id="pos">50 YD</b></div><div class="scorebox">BLUE<b id="bs">🏈 0 / 3</b></div></div>
    </div>
    <div class="panel side"><div id="lessonNo" style="font-size:11px;color:#e6bf62;font-weight:950"></div><h2 id="title"></h2><p id="text"></p><div class="rulebox" id="rule"></div><div class="flow" id="flow"></div><div class="cards" id="cards"></div><div class="actions" id="actions"></div><div class="result" id="result"></div><div class="toast" id="toast"></div></div>
  </div>
</div>
<div class="overlay" id="lessonModal"><div class="dialog"><h2 id="lessonModalTitle">选择要重新学习的教程</h2><p id="lessonModalText">点击任意章节，会直接回到该步骤重新学习。</p><div class="lessonGrid" id="lessonGrid"></div><div class="dialogBtns"><button class="secondary" id="closeLessonBtn">关闭</button><button class="primary" id="restartFromModalBtn">从第1步重新学习</button></div></div></div>
<div class="overlay" id="finishModal"><div class="dialog"><h2 id="finishTitle">🎉 教程完成</h2><p id="finishText">你已经完成策略模式完整教程。你可以从第1步重新学习，或者回到主页选择游戏模式。</p><div class="dialogBtns"><button class="primary" id="finishRestartBtn">重新学习</button><a class="secondary" href="index.html" id="finishHomeBtn">回到主页</a></div></div></div>
<script>
const $=id=>document.getElementById(id);let step=0,lang='zh',holder=null;const IC={RUN:'🏃',PASS:'🎯',TACKLE:'💥',INTERCEPTION:'🦅',BLOCK:'🛡️',BLITZ:'⚡'};
const Z=[
{t:'1. 先了解整场游戏怎么组成',x:'策略模式可选择 2v2、3v3 或 4v4。单机游戏里你只控制红队，蓝队由电脑控制。每队系统分配1名 QB，其余是普通球员。',r:'发牌数量：2v2 每人7张；3v3 每人6张；4v4 每人5张。功能牌不会“出1张马上补1张”。',f:['选择人数','系统分队','每队1名QB'],b:'我明白了'},
{t:'2. FOOTBALL 本身是一张卡',x:'整场比赛只有1张 FOOTBALL CARD。它不是普通功能牌，也不是棋子；它专门表示球权。谁拿着它，谁就是当前持球者。',r:'RUN / PASS / TACKLE / INTERCEPTION / BLOCK / BLITZ 是普通功能牌；FOOTBALL CARD 独立跟随持球者。',f:['FOOTBALL CARD','=球权','只有1张'],b:'继续'},
{t:'3. 第一轮先用石头剪刀布',x:'正式比赛开局先用石头剪刀布决定第一轮谁先攻。你代表红队，电脑代表蓝队。这里请点“石头”，教程设定红队获胜。',r:'只有第一轮需要猜拳。之后每一轮的先攻方自动红→蓝→红→蓝交替。',f:['石头剪刀布','决定第一轮先攻','之后轮流先攻'],choices:['✊ 石头','🖐️ 布','✌️ 剪刀'],targetButton:0},
{t:'4. 先攻方选择持球者',x:'红队赢得第一轮先攻。现在 R1 或 R2 都可以成为持球者，请点击任意一名红队球员，把 FOOTBALL CARD 交给他。',r:'持球者不是固定某一个人。先攻方可以从自己队伍中选择任意一名手里有 RUN 或 PASS 的球员作为持球者。',f:['红队先攻','R1 或 R2 都可选','FOOTBALL CARD→你选择的队友'],players:['r1','r2']},
{t:'5. 一个进攻动作怎么开始',x:'你刚刚选择的球员现在就是持球者，可以选择 RUN 或 PASS。这里先学习跑球，请点击正在跳动的 RUN。',r:'进攻方每次先由当前持球者打出 RUN 或 PASS，然后才进入防守反应阶段。',f:['当前持球者行动','RUN / PASS','进入防守'],cards:['RUN','PASS','BLOCK'],target:'RUN'},
{t:'6. RUN 后防守方有哪些选择',x:'持球者打出 RUN 后，蓝队可以：TACKLE、BLITZ 或不防守。这里模拟蓝队打出 TACKLE，请点击 TACKLE。',r:'TACKLE 只用于阻止 RUN，不会抢走 FOOTBALL CARD。BLITZ 也可以直接让这次 RUN 失败。',f:['RUN','TACKLE / BLITZ / 不防守'],cards:['TACKLE','BLITZ'],target:'TACKLE'},
{t:'7. TACKLE 后进攻方可以 BLOCK',x:'蓝队 TACKLE 正在阻止这次 RUN。红队如果有 BLOCK，可以取消这张 TACKLE。请点击 BLOCK。',r:'如果红队不出 BLOCK：RUN 立即失败，不推进，FOOTBALL CARD 仍留在当前持球者。',f:['RUN','TACKLE','BLOCK'],cards:['BLOCK','PASS','RUN'],target:'BLOCK'},
{t:'8. BLOCK 后还有最后一次防守机会',x:'BLOCK 取消了 TACKLE。蓝队如果还有 BLITZ，可以做最后反制。这里选择“不使用 BLITZ”。',r:'RUN→TACKLE→BLOCK→不BLITZ = RUN成功；如果最后再出BLITZ = RUN失败。',f:['TACKLE被取消','是否BLITZ','不BLITZ=成功'],choices:['不使用 BLITZ','使用 BLITZ'],targetButton:0},
{t:'9. RUN 成功后发生什么',x:'这次 RUN 成功，系统自动把红队从 50 推进到 40。刚才你选择的持球者继续拿着 FOOTBALL CARD。',r:'成功=推进1格；失败=不推进。RUN成功不会自动更换持球者。',f:['RUN成功','50→40','原持球者继续持球'],b:'查看推进结果',advance:1},
{t:'10. 现在学习 PASS',x:'现在切换到一个新的 PASS 示例。为了后续演示一致，系统让 R1 持有 FOOTBALL CARD。请点击 PASS。',r:'PASS 不会立刻完成；打出 PASS 后还必须选择同队接球人。PASS 最终成功后，FOOTBALL CARD 才转给接球人。',f:['R1持球','PASS','选择接球人'],cards:['PASS','RUN','BLOCK'],target:'PASS'},
{t:'11. PASS 后选择接球人',x:'请点击同队的 R2。这里 R2 是 QB，但此刻他只是作为接球人。',r:'选择接球人只是指定 PASS 的目标。防守还没有结束，所以此时球权尚未最终转移。',f:['PASS','选择R2','等待防守'],player:'r2'},
{t:'12. PASS 后防守方怎么反应',x:'PASS 发出后，蓝队可以：INTERCEPTION、BLITZ 或不防守。这里请点击 INTERCEPTION。',r:'INTERCEPTION 只针对 PASS。若最终抄截成功，FOOTBALL CARD 会直接转给成功抄截的防守球员，并立即换球权。',f:['PASS','INTERCEPTION / BLITZ / 不防守'],cards:['INTERCEPTION','BLITZ'],target:'INTERCEPTION'},
{t:'13. INTERCEPTION 也可以被 BLOCK',x:'如果红队有 BLOCK，可以取消这次 INTERCEPTION。这里请点击 BLOCK。',r:'如果不出 BLOCK：INTERCEPTION 成功，球权直接给蓝队；如果 BLOCK 取消抄截，则 PASS 继续。',f:['INTERCEPTION','BLOCK','抄截被取消'],cards:['BLOCK','RUN'],target:'BLOCK'},
{t:'14. PASS 成功后的球权',x:'假设蓝队没有最后 BLITZ，这次 PASS 成功。FOOTBALL CARD 从 R1 交给 R2，R2 成为新的持球者，同时红队推进1格。',r:'PASS成功=接球人成为新持球者；PASS失败=不推进；INTERCEPTION成功=立即换成防守方持球。',f:['PASS成功','FOOTBALL→R2','推进1格'],b:'完成这次PASS',advance:1,passToR2:true},
{t:'15. QB 身份技能什么时候用',x:'现在持球者 R2 是 QB。QB 打出 PASS 并选好接球人后，会弹出“是否使用身份技能”。请点击 PASS，再点击“使用QB技能”。',r:'QB技能每局只能使用1次。使用后，如果这次 PASS 最终成功，本次推进2格；如果最终失败，技能也已经消耗，不返还。',f:['QB持球','PASS','是否使用技能','成功=推进2格'],cards:['PASS','RUN'],target:'PASS',after:true},
{t:'16. INTERCEPTION 成功时怎么换球权',x:'现在看失败分支：假设 PASS 被 B1 的 INTERCEPTION 成功抄截，而且红队没有 BLOCK。请点击 B1，模拟 FOOTBALL CARD 转移。',r:'抄截成功后不只是“这次PASS失败”，而是球权立即改变：B1 成为蓝队持球者，蓝队接下来可以进攻。',f:['PASS','INTERCEPTION成功','FOOTBALL→B1','蓝队球权'],player:'b1',intercept:true},
{t:'17. 一轮什么时候结束',x:'一轮不是一次进攻。双方会继续使用各自现有手牌。只有当红蓝双方都没有 RUN / PASS 可以继续发动进攻时，这一轮才结束。',r:'一轮结束后：收回普通功能牌→洗牌→按2v2/3v3/4v4重新发7/6/5张。不是每出一张就补一张。下一轮先攻方与上一轮相反。',f:['双方都无RUN/PASS','收牌洗牌','统一重发','先攻方交替'],b:'模拟回合结束'},
{t:'18. TOUCHDOWN 与最终获胜',x:'每个进攻方向从50码开始。成功推进依次是 50→40→30→20→10；第4次成功后持球者自动冲入 END ZONE，判定 TOUCHDOWN。',r:'一次 TOUCHDOWN 获得1个🏈。达阵后开始新的推进。先获得3个🏈的队伍立即赢得整场比赛。',f:['4次成功','TOUCHDOWN','+1🏈','先到3个获胜'],b:'完成教程',finish:true}
];
const E=[
{t:'1. Understand the game setup',x:'Strategy Mode supports 2v2, 3v3, or 4v4. In Solo Game, you control Red only and the computer controls Blue. Each team has one QB; all other players are regular players.',r:'Hand size: 2v2 = 7 cards each, 3v3 = 6 each, 4v4 = 5 each. You do not draw a replacement immediately after playing a card.',f:['Choose team size','Teams are assigned','1 QB per team'],b:'Got it'},
{t:'2. The FOOTBALL is a card',x:'There is exactly one FOOTBALL CARD in the game. It is not a normal Action Card and it is not a separate token. It represents possession. Whoever holds it is the current ball carrier.',r:'RUN / PASS / TACKLE / INTERCEPTION / BLOCK / BLITZ are normal Action Cards. The FOOTBALL CARD is separate and follows possession.',f:['FOOTBALL CARD','= possession','Exactly 1 card'],b:'Continue'},
{t:'3. Round 1 uses Rock-Paper-Scissors',x:'At the start of the match, Rock-Paper-Scissors decides who attacks first in Round 1. You represent Red and the computer represents Blue. Tap Rock here; the tutorial gives Red the win.',r:'Only Round 1 uses Rock-Paper-Scissors. In later rounds, first offense alternates between Red and Blue.',f:['Rock-Paper-Scissors','Decide Round 1 offense','Alternate later rounds'],choices:['✊ Rock','🖐️ Paper','✌️ Scissors'],targetButton:0},
{t:'4. Choose the ball carrier',x:'Red won first offense. Either R1 or R2 may become the ball carrier. Tap either Red player to give that player the FOOTBALL CARD.',r:'The ball carrier is not fixed. The offense may choose any teammate who has RUN or PASS as the ball carrier.',f:['Red attacks first','R1 or R2 may be chosen','FOOTBALL CARD→chosen teammate'],players:['r1','r2']},
{t:'5. Start an offensive play',x:'The player you just chose is now the ball carrier and may choose RUN or PASS. Learn the running play first by tapping the moving RUN card.',r:'Every offensive play starts with the current ball carrier playing RUN or PASS. Then the defense gets a response window.',f:['Current ball carrier acts','RUN / PASS','Defense responds'],cards:['RUN','PASS','BLOCK'],target:'RUN'},
{t:'6. Defense options after RUN',x:'After the ball carrier plays RUN, Blue may play TACKLE, BLITZ, or no defense. In this example, Blue plays TACKLE. Tap TACKLE.',r:'TACKLE only stops RUN and never steals the FOOTBALL CARD. BLITZ can also make the RUN fail immediately.',f:['RUN','TACKLE / BLITZ / No defense'],cards:['TACKLE','BLITZ'],target:'TACKLE'},
{t:'7. Offense may BLOCK a TACKLE',x:'Blue TACKLE is stopping the RUN. If Red has BLOCK, Red may cancel that TACKLE. Tap BLOCK.',r:'If Red does not play BLOCK, the RUN fails immediately, there is no advance, and the FOOTBALL CARD stays with the current ball carrier.',f:['RUN','TACKLE','BLOCK'],cards:['BLOCK','PASS','RUN'],target:'BLOCK'},
{t:'8. Final BLITZ window after BLOCK',x:'BLOCK canceled TACKLE. If Blue still has BLITZ, Blue gets one final defensive response. Choose No BLITZ here.',r:'RUN→TACKLE→BLOCK→No BLITZ = successful RUN. A final BLITZ makes the RUN fail.',f:['TACKLE canceled','Final BLITZ?','No BLITZ = success'],choices:['No BLITZ','Use BLITZ'],targetButton:0},
{t:'9. Resolve a successful RUN',x:'The RUN succeeds. The system automatically advances Red from the 50 to the 40. The ball carrier you chose keeps the FOOTBALL CARD.',r:'Success = advance 1 space. Failure = no advance. A successful RUN does not automatically change the ball carrier.',f:['RUN succeeds','50→40','Same ball carrier keeps possession'],b:'Show the result',advance:1},
{t:'10. Learn PASS',x:'Now switch to a new PASS example. To keep the next demonstration consistent, the tutorial gives the FOOTBALL CARD to R1. Tap PASS.',r:'A PASS is not complete immediately. After playing PASS, you must choose a teammate as the receiver. The FOOTBALL CARD moves only if the PASS finally succeeds.',f:['R1 has possession','PASS','Choose receiver'],cards:['PASS','RUN','BLOCK'],target:'PASS'},
{t:'11. Choose the receiver',x:'Tap teammate R2. R2 is a QB, but in this step R2 is simply the intended receiver.',r:'Choosing a receiver only sets the PASS target. Defense still gets a response, so possession has not transferred yet.',f:['PASS','Choose R2','Wait for defense'],player:'r2'},
{t:'12. Defense options after PASS',x:'After PASS, Blue may play INTERCEPTION, BLITZ, or no defense. Tap INTERCEPTION here.',r:'INTERCEPTION only targets PASS. If it finally succeeds, the FOOTBALL CARD moves directly to the defender who intercepted it and possession changes immediately.',f:['PASS','INTERCEPTION / BLITZ / No defense'],cards:['INTERCEPTION','BLITZ'],target:'INTERCEPTION'},
{t:'13. BLOCK can cancel INTERCEPTION',x:'If Red has BLOCK, Red may cancel the INTERCEPTION. Tap BLOCK here.',r:'No BLOCK = the interception succeeds and Blue gets possession. BLOCK cancels the interception and keeps the PASS alive.',f:['INTERCEPTION','BLOCK','Interception canceled'],cards:['BLOCK','RUN'],target:'BLOCK'},
{t:'14. Possession after a successful PASS',x:'Assume Blue does not play a final BLITZ. The PASS succeeds. Move the FOOTBALL CARD from R1 to R2; R2 becomes the new ball carrier and Red advances 1 space.',r:'Successful PASS = receiver becomes the new ball carrier. Failed PASS = no advance. Successful INTERCEPTION = immediate possession change.',f:['PASS succeeds','FOOTBALL→R2','Advance 1 space'],b:'Resolve the PASS',advance:1,passToR2:true},

{t:'16. What happens on a successful INTERCEPTION',x:'Now learn the failure branch. Assume B1 successfully intercepts a PASS and Red does not have BLOCK. Tap B1 to transfer the FOOTBALL CARD.',r:'A successful interception is more than a failed PASS. Possession changes immediately: B1 becomes the Blue ball carrier and Blue may attack next.',f:['PASS','INTERCEPTION succeeds','FOOTBALL→B1','Blue possession'],player:'b1',intercept:true},
{t:'17. When a round ends',x:'A round is not a single play. Both teams continue using their current hands. The round ends only when neither team has any RUN or PASS left to start another offense.',r:'At round end, gather normal Action Cards, shuffle them, and redeal 7 / 6 / 5 cards per player for 2v2 / 3v3 / 4v4. Do not replace cards after each play. First offense alternates next round.',f:['Neither team has RUN/PASS','Gather and shuffle','Redeal all hands','Alternate first offense'],b:'Simulate round end'},

function data(){return lang==='zh'?Z:E}
function yards(){const root=$('yards');root.innerHTML='';[18,26,34,42,50,58,66,74,82].forEach((x,i)=>{let l=document.createElement('div');l.className='yardLine';l.style.left=x+'%';root.appendChild(l);let n=document.createElement('div');n.className='yardText';n.style.left=x+'%';n.textContent=[10,20,30,40,50,40,30,20,10][i];root.appendChild(n);let b=n.cloneNode(true);b.className='yardText bottom';root.appendChild(b)})}
function wrong(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),650)}
function fx(t){$('flash').textContent=t;$('flash').classList.remove('show');void $('flash').offsetWidth;$('flash').classList.add('show')}
function clearTargets(){['r1','r2','b1','b2'].forEach(id=>$(id).classList.remove('target'))}
function setBall(who){holder=who;['ball1','ball2','ball3'].forEach(x=>$(x).style.display='none');if(who==='r1')$('ball1').style.display='block';if(who==='r2')$('ball2').style.display='block';if(who==='b1')$('ball3').style.display='block'}
function setYard(y){$('pos').textContent=y+' YD';const seq=[50,40,30,20,10],idx=Math.max(0,seq.indexOf(y)),x=[50,58,66,74,82][idx];$('los').style.left=x+'%';$('badge').style.left=x+'%';$('badge').textContent='BALL ON '+y}
function advance(n){let current=parseInt($('pos').textContent)||50,seq=[50,40,30,20,10],idx=seq.indexOf(current);idx=Math.min(4,Math.max(0,idx+n));setYard(seq[idx])}
function restoreStateForStep(n){$('rs').textContent='🏈 0 / 3';$('bs').textContent='🏈 0 / 3';$('round').textContent=lang==='zh'?'第1轮 · 红队先攻':'ROUND 1 · RED OFFENSE';if(n<4){setBall(null);setYard(50)}else if(n<=8){setBall('r1');setYard(50)}else if(n<=12){setBall('r1');setYard(40)}else if(n<=14){setBall('r2');setYard(30)}else if(n<=16){setBall('b1');setYard(30)}else{setBall('r1');setYard(10)}}
function restartTutorial(){step=0;restoreStateForStep(0);$('lessonModal').classList.remove('show');$('finishModal').classList.remove('show');render();window.scrollTo({top:0,behavior:'smooth'})}
function jumpToLesson(i){step=i;restoreStateForStep(i);$('lessonModal').classList.remove('show');$('finishModal').classList.remove('show');render();window.scrollTo({top:0,behavior:'smooth'})}
function finishTutorial(){fx('TOUCHDOWN!');$('rs').textContent='🏈 1 / 3';setTimeout(()=>$('finishModal').classList.add('show'),700)}
function next(){if(step<17){step++;if(step===9)setBall('r1');render()}else finishTutorial()}
function cardClick(type,el){let d=data()[step];if(d.target!==type){wrong(el);$('toast').textContent=lang==='zh'?'这一步不是这张牌，请看黄色箭头。':'That is not the card for this step. Follow the yellow arrow.';return}fx(type+'!');if(d.after){setTimeout(showQBSkill,400);return}setTimeout(next,450)}
function playerClick(id){let d=data()[step],allowed=d.players?d.players.includes(id):d.player===id;if(!allowed){wrong($(id));$('toast').textContent=lang==='zh'?'这一步不能选择这个球员，请点击黄色高亮的队友。':'You cannot choose that player in this step. Tap one of the highlighted teammates.';return}if(d.players)setBall(id);else if(id==='r1')setBall('r1');if(d.intercept)setBall('b1');fx(id.toUpperCase()+(d.intercept?' · INTERCEPTION!':'!'));setTimeout(next,450)}
function showQBSkill(){$('actions').innerHTML='';let b=document.createElement('button');b.className='act target';b.textContent=lang==='zh'?'使用 QB 技能':'Use QB Skill';b.onclick=()=>{fx(lang==='zh'?'QB技能已使用!':'QB SKILL USED!');advance(2);setTimeout(next,500)};$('actions').appendChild(b)}
function renderLessonPicker(){const list=data(),grid=$('lessonGrid');grid.innerHTML='';list.forEach((d,i)=>{const b=document.createElement('button');b.className='lessonPick';b.innerHTML='<b>'+(lang==='zh'?'第 '+(i+1)+' 步':'Lesson '+(i+1))+'</b>'+d.t.replace(/^\d+\.\s*/,'');b.onclick=()=>jumpToLesson(i);grid.appendChild(b)})}
function render(){let d=data()[step];document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('homeBtn').textContent=lang==='zh'?'← 首页':'← Home';$('gameBtn').textContent=lang==='zh'?'单机游戏':'Solo Game';$('selectLessonBtn').textContent=lang==='zh'?'选择教程':'Choose Lesson';$('restartBtn').textContent=lang==='zh'?'重新学习':'Restart Tutorial';$('langBtn').textContent=lang==='zh'?'切换到英文':'Switch to Chinese';$('lessonNo').textContent=(lang==='zh'?'教程 ':'LESSON ')+(step+1)+' / 18';$('title').textContent=d.t;$('text').textContent=d.x;$('rule').textContent=(lang==='zh'?'规则：':'RULE: ')+d.r;$('result').textContent=(lang==='zh'?'这一步要记住：':'REMEMBER: ')+d.f.join(' → ');$('flow').innerHTML='';d.f.forEach((v,i)=>{let s=document.createElement('span');s.textContent=v;if(i===Math.min(1,d.f.length-1))s.className='on';$('flow').appendChild(s)});$('stepbar').innerHTML='';for(let i=0;i<18;i++){let q=document.createElement('div');q.className='dot '+(i<=step?'on':'');$('stepbar').appendChild(q)}clearTargets();if(d.player)$(d.player).classList.add('target');if(d.players)d.players.forEach(id=>$(id).classList.add('target'));$('cards').innerHTML='';(d.cards||[]).forEach(type=>{let c=document.createElement('div');c.className='card'+(d.target===type?' target':'');c.dataset.tip=lang==='zh'?'点这张':'PLAY THIS';const desc=lang==='zh'?{RUN:'持球推进',PASS:'传给队友',TACKLE:'阻止RUN',INTERCEPTION:'抄截PASS',BLOCK:'取消防守',BLITZ:'最终突袭'}:{RUN:'Run the ball',PASS:'Pass to teammate',TACKLE:'Stop RUN',INTERCEPTION:'Intercept PASS',BLOCK:'Cancel defense',BLITZ:'Final pressure'};c.innerHTML='<div class="ico">'+IC[type]+'</div><b>'+type+'</b><small>'+desc[type]+'</small>';c.onclick=()=>cardClick(type,c);$('cards').appendChild(c)});$('actions').innerHTML='';if(d.choices){d.choices.forEach((x,i)=>{let b=document.createElement('button');b.className='act '+(i===d.targetButton?'target':'');b.textContent=x;b.onclick=()=>{if(i!==d.targetButton){wrong(b);return}fx(step===2?(lang==='zh'?'红队获胜!':'RED WINS!'):(lang==='zh'?'成功!':'SUCCESS!'));setTimeout(next,450)};$('actions').appendChild(b)})}else if(d.b){let b=document.createElement('button');b.className='act target';b.textContent=d.b;b.onclick=()=>{if(d.advance)advance(d.advance);if(d.passToR2)setBall('r2');if(d.finish){finishTutorial();return}setTimeout(next,450)};$('actions').appendChild(b)}$('toast').textContent='';$('lessonModalTitle').textContent=lang==='zh'?'选择要重新学习的教程':'Choose a Lesson to Review';$('lessonModalText').textContent=lang==='zh'?'点击任意章节，会直接回到该步骤重新学习。':'Choose any lesson to jump directly to that step and study it again.';$('closeLessonBtn').textContent=lang==='zh'?'关闭':'Close';$('restartFromModalBtn').textContent=lang==='zh'?'从第1步重新学习':'Restart from Lesson 1';$('finishTitle').textContent=lang==='zh'?'🎉 教程完成':'🎉 Tutorial Complete';$('finishText').textContent=lang==='zh'?'你已经完成策略模式完整教程。你可以从第1步重新学习，或者回到主页选择游戏模式。':'You completed the full Strategy Mode tutorial. You can restart from Lesson 1 or return to the home page.';$('finishRestartBtn').textContent=lang==='zh'?'重新学习':'Restart Tutorial';$('finishHomeBtn').textContent=lang==='zh'?'回到主页':'Return Home';renderLessonPicker();$('round').textContent=lang==='zh'?'第1轮 · 红队先攻':'ROUND 1 · RED OFFENSE'}
['r1','r2','b1','b2'].forEach(id=>$(id).onclick=()=>playerClick(id));$('selectLessonBtn').onclick=()=>{$('lessonModal').classList.add('show');renderLessonPicker()};$('closeLessonBtn').onclick=()=>$('lessonModal').classList.remove('show');$('restartBtn').onclick=restartTutorial;$('restartFromModalBtn').onclick=restartTutorial;$('finishRestartBtn').onclick=restartTutorial;$('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};$('lessonModal').onclick=e=>{if(e.target===$('lessonModal'))$('lessonModal').classList.remove('show')};yards();restoreStateForStep(0);render();
</script>
