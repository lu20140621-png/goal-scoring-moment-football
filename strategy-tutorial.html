<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goal-Scoring Moment Football — Strategy Tutorial</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07130d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:#0b2015;border-bottom:2px solid #b9903d;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:950}.actions{display:flex;gap:7px}.btn{border:1px solid #ffffff25;background:#153821;color:#fff;border-radius:10px;padding:8px 10px;font-weight:900}.btn.gold{background:#e7bd61;color:#241c08;border:0}.wrap{max-width:960px;margin:auto;padding:12px}.progress{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:10px}.dot{height:6px;background:#23432f;border-radius:999px}.dot.on{background:#e7bd61}.stage{position:relative;min-height:620px;border:2px solid #31583c;border-radius:20px;overflow:hidden;background:linear-gradient(90deg,#302a18 0 9%,#16703d 9% 91%,#173b32 91% 100%)}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.9%,#ffffff16 10%,transparent 10.2%);pointer-events:none}.end{position:absolute;top:0;bottom:0;width:9%;display:grid;place-items:center;font-weight:950;writing-mode:vertical-rl;letter-spacing:.08em}.end.left{left:0}.end.right{right:0}.yard{position:absolute;top:45%;transform:translate(-50%,-50%);font-size:34px;font-weight:950;color:#ffffff20}.player{position:absolute;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:950;border:3px solid #fff;box-shadow:0 7px 18px #0007;z-index:3}.red{background:#c44343}.blue{background:#3874d4}.ball{position:absolute;right:-8px;top:-10px;font-size:25px}.p1{left:39%;top:31%}.p2{left:39%;top:58%}.p3{left:57%;top:31%}.p4{left:57%;top:58%}.lesson{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:5;width:min(680px,90%);background:#0b1710ee;border:2px solid #e7bd61;border-radius:16px;padding:12px;text-align:center}.lessonNo{font-size:11px;color:#e7bd61;font-weight:950}.lesson h2{margin:5px 0 6px;font-size:24px}.hint{font-size:13px;line-height:1.55;color:#d6e0d9}.flow{margin-top:8px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.flow span{background:#173622;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.panel{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;width:min(850px,94%);background:#08120dcc;border:1px solid #365b41;border-radius:16px;padding:10px}.todo{font-size:12px;color:#e9ce87;font-weight:900;margin-bottom:8px}.choices{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.choice{min-width:110px;border:2px solid #3f7350;background:#112b1a;color:#fff;border-radius:12px;padding:10px;font-weight:950}.choice.primary{background:#e7bd61;color:#251d08;border-color:#e7bd61}.choice:disabled{opacity:.35}.cards{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:9px}.card{width:92px;height:124px;border-radius:12px;background:#f3efe1;color:#162018;border:3px solid #d9d1b7;padding:8px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;font-weight:950}.card strong{font-size:16px}.card small{font-size:10px;line-height:1.25}.card.active{outline:4px solid #e7bd61;cursor:pointer}.log{margin-top:12px;background:#0b1a11;border:1px solid #294432;border-radius:12px;padding:9px;font-size:12px;color:#cdd9d1;min-height:42px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:50;padding:16px}.modal.show{display:grid}.box{width:min(620px,100%);background:#0e2116;border:2px solid #e7bd61;border-radius:18px;padding:18px;text-align:center}.box h2{margin:5px 0}.box p{color:#d2ddd5;line-height:1.6;font-size:14px}@media(max-width:700px){.wrap{padding:7px}.stage{min-height:700px}.lesson{top:2%;padding:9px}.lesson h2{font-size:19px}.hint{font-size:12px}.player{width:60px;height:60px}.p1{left:31%;top:35%}.p2{left:31%;top:56%}.p3{left:59%;top:35%}.p4{left:59%;top:56%}.yard{font-size:24px}.panel{bottom:6px}.card{width:72px;height:104px;padding:6px}.card strong{font-size:13px}.choice{min-width:92px;padding:9px 7px;font-size:12px}.brand{font-size:12px}}
</style></head>
<body>
<div class="top"><div class="brand">🏈 GOAL-SCORING MOMENT · <span id="topTitle">策略模式教程</span></div><div class="actions"><button class="btn" onclick="location.href='index.html'" id="homeBtn">首页</button><button class="btn" id="langBtn">中文 / EN</button></div></div>
<div class="wrap"><div class="progress" id="progress"></div><div class="stage"><div class="field"></div><div class="end left" id="redEnd">红队端区</div><div class="end right" id="blueEnd">蓝队端区</div><div class="yard" style="left:20%">10</div><div class="yard" style="left:30%">20</div><div class="yard" style="left:40%">30</div><div class="yard" style="left:50%">50</div><div class="yard" style="left:60%">30</div><div class="yard" style="left:70%">20</div><div class="yard" style="left:80%">10</div><div class="player red p1">R1<div class="ball" id="ball">🏈</div></div><div class="player red p2">R2</div><div class="player blue p3">B1</div><div class="player blue p4">B2</div><div class="lesson"><div class="lessonNo" id="lessonNo"></div><h2 id="lessonTitle"></h2><div class="hint" id="lessonHint"></div><div class="flow" id="flow"></div></div><div class="panel"><div class="todo" id="todo"></div><div class="choices" id="choices"></div><div class="cards" id="cards"></div><div class="log" id="log"></div></div></div></div>
<div class="modal" id="done"><div class="box"><div style="font-size:42px">🏈🏆</div><h2 id="doneTitle">教程完成</h2><p id="doneText"></p><div class="choices"><button class="choice primary" onclick="location.href='strategy.html'" id="playBtn">进入单机游戏</button><button class="choice" onclick="location.reload()" id="againBtn">再学一次</button></div></div></div>
<script>
let lang='zh',step=0;
const lessons={zh:[
{t:'1. 开局：决定第一轮先攻',h:'正式游戏先用石头剪刀布决定第一轮谁先进攻。你代表红队，电脑代表蓝队。',f:['石头剪刀布','赢的一方先攻'],todo:'教程里先假设红队赢了。点击“红队先攻”。',choices:['红队先攻'],cards:[]},
{t:'2. 选择持球者',h:'先攻方必须先选一名手里有 RUN 或 PASS 的球员作为持球者。只有持球者能发动下一次进攻。',f:['先攻方','选择持球者','开始进攻'],todo:'选择 R1 作为持球者。',choices:['选择 R1 持球'],cards:[]},
{t:'3. RUN：什么时候出',h:'RUN 是持球者自己带球推进。轮到你进攻，而且你就是持球者时，才可以打 RUN。',f:['持球者','RUN','进入防守时刻'],todo:'点击 RUN 发动一次跑球进攻。',choices:[],cards:[['RUN','🏃','持球推进']]},
{t:'4. RUN 后怎么防守',h:'对方看到 RUN 后，可以选择 TACKLE、BLITZ 或不防守。TACKLE只阻止RUN，不会自动抢走球。',f:['RUN','TACKLE','BLOCK?','BLITZ?'],todo:'先模拟蓝队打出 TACKLE。',choices:['蓝队：TACKLE'],cards:[['TACKLE','💥','防守RUN']]},
{t:'5. BLOCK：什么时候出',h:'当你的 RUN 被 TACKLE 阻止时，如果你有 BLOCK，可以用 BLOCK 取消这张 TACKLE。',f:['TACKLE','BLOCK','取消TACKLE'],todo:'点击 BLOCK 反制。',choices:[],cards:[['BLOCK','🛡️','取消防守']]},
{t:'6. PASS + INTERCEPTION',h:'PASS 要先选择接球队友。对方可以用 INTERCEPTION 抄截；如果抄截没有被 BLOCK 取消，防守方直接获得球权。',f:['PASS','选接球人','INTERCEPTION','BLOCK?'],todo:'点击 PASS，然后学习抄截流程。',choices:[],cards:[['PASS','🎯','传给队友'],['INTERCEPTION','🦅','防守PASS']]},
{t:'7. QB 技能',h:'只有 QB 打出 PASS 且技能没用过时，才会询问是否使用技能。使用后，PASS最终成功会推进2格；如果后来失败，技能也不返还。',f:['QB PASS','选择接球人','使用技能?','成功=推进2格'],todo:'点击“使用QB技能”完成这一步。',choices:['使用QB技能'],cards:[]},
{t:'8. 成功、失败与 TOUCHDOWN',h:'进攻成功系统自动推进；失败不推进。第4次成功到10码后，持球者自动冲入 END ZONE，获得1个🏈。先拿3个🏈获胜。',f:['50→40','40→30','30→20','20→10','TOUCHDOWN'],todo:'点击“完成教程”，然后进入真正的单机游戏。',choices:['完成教程'],cards:[]}
],en:[
{t:'1. Opening: Decide First Offense',h:'Use Rock-Paper-Scissors to decide who attacks first in Round 1. You are Red; the computer is Blue.',f:['Rock-Paper-Scissors','Winner attacks first'],todo:'For the tutorial, assume Red wins. Tap “Red attacks first”.',choices:['Red attacks first'],cards:[]},
{t:'2. Choose the Ball Carrier',h:'The attacking team chooses a player with RUN or PASS. Only the ball carrier can start the next offensive play.',f:['First offense','Choose carrier','Start attack'],todo:'Choose R1 as the ball carrier.',choices:['Choose R1'],cards:[]},
{t:'3. RUN: When to Play It',h:'RUN means the ball carrier runs with the ball. Play RUN only when your team is on offense and this player has the ball.',f:['Ball carrier','RUN','Defense phase'],todo:'Tap RUN to start a rushing play.',choices:[],cards:[['RUN','🏃','Run with the ball']]},
{t:'4. How to Defend RUN',h:'After RUN, the defense may use TACKLE, BLITZ, or No Defense. TACKLE stops RUN but does not automatically steal possession.',f:['RUN','TACKLE','BLOCK?','BLITZ?'],todo:'Simulate Blue playing TACKLE.',choices:['Blue: TACKLE'],cards:[['TACKLE','💥','Defend RUN']]},
{t:'5. BLOCK: When to Play It',h:'If TACKLE stops your RUN, you may play BLOCK to cancel that TACKLE.',f:['TACKLE','BLOCK','Cancel TACKLE'],todo:'Tap BLOCK to counter.',choices:[],cards:[['BLOCK','🛡️','Cancel defense']]},
{t:'6. PASS + INTERCEPTION',h:'PASS requires choosing a teammate receiver. The defense may use INTERCEPTION. If it is not canceled by BLOCK, the defender takes possession.',f:['PASS','Choose receiver','INTERCEPTION','BLOCK?'],todo:'Tap PASS and learn the interception chain.',choices:[],cards:[['PASS','🎯','Pass to teammate'],['INTERCEPTION','🦅','Defend PASS']]},
{t:'7. QB Skill',h:'Only an unused QB skill appears after the QB plays PASS. If used and the PASS succeeds, advance 2 spaces. If the play fails later, the skill is still spent.',f:['QB PASS','Choose receiver','Use skill?','Success = 2 spaces'],todo:'Tap “Use QB Skill”.',choices:['Use QB Skill'],cards:[]},
{t:'8. Success, Failure & TOUCHDOWN',h:'Success advances automatically; failure does not. On the 4th success, reach the 10 and automatically run into the END ZONE for 1 🏈. First to 3 🏈 wins.',f:['50→40','40→30','30→20','20→10','TOUCHDOWN'],todo:'Tap “Finish Tutorial” and enter the real solo game.',choices:['Finish Tutorial'],cards:[]}
]};
function render(){let L=lessons[lang][step];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('topTitle').textContent=lang==='zh'?'策略模式教程':'STRATEGY TUTORIAL';document.getElementById('homeBtn').textContent=lang==='zh'?'首页':'Home';document.getElementById('redEnd').textContent=lang==='zh'?'红队端区':'RED END ZONE';document.getElementById('blueEnd').textContent=lang==='zh'?'蓝队端区':'BLUE END ZONE';document.getElementById('lessonNo').textContent=(lang==='zh'?'教程 ':'LESSON ')+(step+1)+' / 8';document.getElementById('lessonTitle').textContent=L.t;document.getElementById('lessonHint').textContent=L.h;document.getElementById('todo').textContent=(lang==='zh'?'现在做什么：':'WHAT TO DO: ')+L.todo;let p=document.getElementById('progress');p.innerHTML='';for(let i=0;i<8;i++){let d=document.createElement('div');d.className='dot '+(i<=step?'on':'');p.appendChild(d)}let f=document.getElementById('flow');f.innerHTML='';L.f.forEach((x,i)=>{let s=document.createElement('span');s.textContent=x;f.appendChild(s)});let ch=document.getElementById('choices');ch.innerHTML='';L.choices.forEach((x,i)=>{let b=document.createElement('button');b.className='choice '+(i===0?'primary':'');b.textContent=x;b.onclick=next;ch.appendChild(b)});let cards=document.getElementById('cards');cards.innerHTML='';L.cards.forEach((c,i)=>{let d=document.createElement('div');d.className='card active';d.innerHTML=`<div style="font-size:28px">${c[1]}</div><strong>${c[0]}</strong><small>${c[2]}</small>`;d.onclick=next;cards.appendChild(d)});document.getElementById('log').textContent=lang==='zh'?'提示：这里只是教学演示。真正游戏中，系统会根据当前阶段只让你点击合法的牌。':'Tip: this is a guided demo. In the real game, only legal cards for the current phase are clickable.';document.getElementById('doneTitle').textContent=lang==='zh'?'教程完成！':'Tutorial Complete!';document.getElementById('doneText').textContent=lang==='zh'?'你已经学会什么时候进攻、什么时候防守、什么时候用BLOCK和QB技能。现在可以进入真正的策略模式单机游戏。':'You now know when to attack, defend, use BLOCK, and use the QB skill. You are ready for the real Strategy solo game.';document.getElementById('playBtn').textContent=lang==='zh'?'进入单机游戏':'Enter Solo Game';document.getElementById('againBtn').textContent=lang==='zh'?'再学一次':'Replay Tutorial';}
function next(){if(step<7){step++;render()}else document.getElementById('done').classList.add('show')}
document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();
</script></body></html>
