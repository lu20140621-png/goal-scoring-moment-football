<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Goal-Scoring Moment Football — Strategy Tutorial</title><link rel="stylesheet" href="football-console.css"><style>.coach{background:#0a2236;border:2px solid #d7aa4e;border-radius:12px;padding:10px;margin-top:8px}.coach h2{margin:0 0 5px;color:#f0cf78}.coach p{margin:4px 0;color:#d6e0e7;line-height:1.5;font-size:13px}.stepbar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}.stepdot{height:6px;background:#25415a;border-radius:999px}.stepdot.on{background:#e1b84e}.teachActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.teachBtn{border:1px solid #5b7d99;background:#113653;color:#fff;border-radius:8px;padding:8px 11px;font-weight:900}.teachBtn.gold{background:#dfb34c;color:#251b07;border-color:#f1d078}</style></head><body><div class="console"><div class="consoleTop"><div class="consoleBrand">🎓🏈 GOAL-SCORING MOMENT · STRATEGY TUTORIAL</div><div class="scoreBoard"><div class="scoreTeam">RED</div><div class="scoreNum" id="redScore">0</div><div class="scoreDash">-</div><div class="scoreNum" id="blueScore">0</div><div class="scoreTeam">BLUE</div></div><div class="consoleActions"><a class="consoleBtn" href="index.html" id="homeBtn">← 首页</a><button class="consoleBtn" id="langBtn">中文 / EN</button></div></div><div class="arena"><aside class="sideRoster"><h3 id="redRosterTitle">红队</h3><div class="rosterRow"><span>R1 · PLAYER</span><b>5</b></div><div class="rosterRow"><span>R2 · QB</span><b>5</b></div></aside><main class="fieldShell"><div class="fieldHeader"><b id="phaseTitle">教学比赛现场</b><span id="ballStatus">BALL ON 50</span></div><div class="stepbar" id="stepbar"></div><div class="field"><div class="endzoneLabel left" id="redEnd">红队端区</div><div class="endzoneLabel right" id="blueEnd">蓝队端区</div><div class="yardLine" style="left:18%"></div><div class="yardLine" style="left:26%"></div><div class="yardLine" style="left:34%"></div><div class="yardLine" style="left:42%"></div><div class="yardLine" style="left:50%"></div><div class="yardLine" style="left:58%"></div><div class="yardLine" style="left:66%"></div><div class="yardLine" style="left:74%"></div><div class="yardLine" style="left:82%"></div><div class="yardText" style="left:18%">10</div><div class="yardText" style="left:26%">20</div><div class="yardText" style="left:34%">30</div><div class="yardText" style="left:42%">40</div><div class="yardText" style="left:50%">50</div><div class="yardText" style="left:58%">40</div><div class="yardText" style="left:66%">30</div><div class="yardText" style="left:74%">20</div><div class="yardText" style="left:82%">10</div><div class="playerDot red" id="r1" style="left:42%;top:36%">R1<div class="ballMark" id="ballMark">🏈</div></div><div class="playerDot red" id="r2" style="left:42%;top:60%">R2</div><div class="playerDot blue" id="b1" style="left:58%;top:36%">B1</div><div class="playerDot blue" id="b2" style="left:58%;top:60%">B2</div><div class="ballLine" id="line" style="left:50%"></div><div class="ballBadge" id="badge" style="left:50%">BALL ON 50</div></div><div class="coach"><div style="font-size:11px;color:#e2bd63;font-weight:950" id="lessonNo"></div><h2 id="lessonTitle"></h2><p id="lessonText"></p><div class="teachActions" id="teachActions"></div></div></main><aside class="sideRoster"><h3 id="blueRosterTitle">蓝队</h3><div class="rosterRow"><span>B1 · PLAYER</span><b>?</b></div><div class="rosterRow"><span>B2 · QB</span><b>?</b></div></aside></div><div class="lower"><section class="eventPanel"><h3 id="logTitle">教学记录</h3><div class="logBox" id="log">欢迎进入策略模式教程。</div></section><section class="handPanel"><h3 id="handTitle">你的手牌</h3><div class="cardsRow" id="cards"></div></section></div></div><div class="overlay" id="done"><div class="dialog"><h2 id="doneTitle">教程完成</h2><p id="doneText">你已经学会完整攻防流程。</p><div class="modeGrid"><a class="modeChoice gold" href="strategy-game.html"><h3 id="playText">进入单机游戏</h3><p>用刚学会的规则打一场完整比赛。</p></a><a class="modeChoice" href="strategy-tutorial.html"><h3 id="againText">重新学习</h3><p>从第一步重新开始。</p></a></div></div></div><script>
let lang='zh',step=0;const data={zh:[['开局先攻','第一轮先用石头剪刀布决定谁先攻。这里假设红队获胜。','红队先攻'],['选择持球者','先攻方先选一名手里有 RUN 或 PASS 的球员。FOOTBALL 本身是一张球权卡，谁拿着它谁就是持球者。','选择 R1 持球'],['RUN 进攻','持球者打出 RUN，表示自己带着 FOOTBALL CARD 跑球推进。','打出 RUN'],['RUN 防守','对方看到 RUN 后，可以 TACKLE、BLITZ 或不防守。这里让蓝队打 TACKLE。','蓝队 TACKLE'],['BLOCK 反制','TACKLE 出现后，进攻方可以用 BLOCK 取消它。BLOCK 后防守方仍可能再用 BLITZ。','红队 BLOCK'],['PASS + INTERCEPTION','PASS 要先选择接球队友。对方可以用 INTERCEPTION 抄截；若没被 BLOCK 取消，FOOTBALL CARD 直接转移给防守者。','学习 PASS'],['QB 技能','只有 QB 打出 PASS 且技能没使用时才会弹出。使用后如果 PASS 最终成功，本次推进2格；失败也不会返还技能。','使用 QB 技能'],['成功 / 失败 / TOUCHDOWN','系统自动判断成功或失败。成功推进；失败不推进。第4次成功到10码后自动冲入 END ZONE，获得1个🏈。先拿3个🏈获胜。','完成教程']],en:[['Opening offense','Round 1 starts with Rock-Paper-Scissors. For this tutorial, Red wins.','Red attacks first'],['Choose ball carrier','Choose a player with RUN or PASS. The FOOTBALL itself is a card. Whoever holds the FOOTBALL CARD is the ball carrier.','Choose R1'],['RUN offense','The ball carrier plays RUN to advance while keeping the FOOTBALL CARD.','Play RUN'],['Defend RUN','Against RUN, the defense may use TACKLE, BLITZ, or No Defense. Here Blue uses TACKLE.','Blue TACKLE'],['BLOCK counter','After TACKLE, offense may use BLOCK to cancel it. Defense may still answer with BLITZ after BLOCK.','Red BLOCK'],['PASS + INTERCEPTION','PASS first chooses a teammate receiver. INTERCEPTION can steal the FOOTBALL CARD if it is not canceled by BLOCK.','Learn PASS'],['QB skill','Only a QB playing PASS can use this once. If the PASS succeeds, advance 2 spaces. If it later fails, the skill is still spent.','Use QB Skill'],['Success / Failure / TOUCHDOWN','The system resolves every play. Success advances; failure does not. The 4th success reaches the 10 and automatically runs into the END ZONE for 1 🏈. First to 3 wins.','Finish Tutorial']]};
const cardDefs={RUN:['🏃','RUN'],PASS:['🎯','PASS'],TACKLE:['💥','TACKLE'],INTERCEPTION:['🦅','INTERCEPTION'],BLOCK:['🛡️','BLOCK'],BLITZ:['⚡','BLITZ']};function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';const L=data[lang][step];lessonNo.textContent=(lang==='zh'?'教程 ':'LESSON ')+(step+1)+' / 8';lessonTitle.textContent=L[0];lessonText.textContent=L[1];teachActions.innerHTML='';const b=document.createElement('button');b.className='teachBtn gold';b.textContent=L[2];b.onclick=next;teachActions.appendChild(b);stepbar.innerHTML='';for(let i=0;i<8;i++){let d=document.createElement('div');d.className='stepdot '+(i<=step?'on':'');stepbar.appendChild(d)}cards.innerHTML='';let list=step<2?['RUN','PASS']:step===2?['RUN','PASS','BLOCK']:step===3?['TACKLE','BLITZ']:step===4?['BLOCK','RUN','PASS']:step===5?['PASS','INTERCEPTION','BLOCK']:step===6?['PASS','BLOCK']:['RUN','PASS','TACKLE','INTERCEPTION','BLOCK','BLITZ'];list.forEach(k=>{let c=document.createElement('div');c.className='gameCard';c.innerHTML='<div class="icon">'+cardDefs[k][0]+'</div><strong>'+k+'</strong><small>'+(lang==='zh'?'教学卡牌':'Tutorial card')+'</small>';cards.appendChild(c)});homeBtn.textContent=lang==='zh'?'← 首页':'← Home';redRosterTitle.textContent=lang==='zh'?'红队':'RED TEAM';blueRosterTitle.textContent=lang==='zh'?'蓝队':'BLUE TEAM';handTitle.textContent=lang==='zh'?'你的手牌':'YOUR HAND';logTitle.textContent=lang==='zh'?'教学记录':'TUTORIAL LOG';log.innerHTML=(lang==='zh'?'当前步骤：':'Current step: ')+L[0]}function next(){if(step<7){step++;if(step===2){badge.textContent='BALL ON 50'}if(step===7){line.style.left='42%';badge.style.left='42%';badge.textContent='BALL ON 40'}render()}else done.classList.add('show')}langBtn.onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();</script></body></html>
