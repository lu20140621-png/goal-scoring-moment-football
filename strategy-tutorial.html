<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strategy Tutorial</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,a{font:inherit}.app{max-width:1400px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0c2d53;border:2px solid #2d6395;border-radius:12px;padding:10px 12px}.brand{font-weight:950}.btn{border:1px solid #567da0;background:#12365b;color:#fff;border-radius:8px;padding:8px 11px;font-weight:900;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 340px;gap:10px;margin-top:10px}.panel{background:#092845;border:2px solid #2d6192;border-radius:11px;padding:10px}.field{position:relative;aspect-ratio:16/9;min-height:420px;overflow:hidden;border:3px solid #dce6ea;border-radius:7px;background:linear-gradient(90deg,#4d472a 0 9%,transparent 9% 91%,#17485b 91%),repeating-linear-gradient(90deg,#168143 0 10%,#1c934d 10% 20%)}.fieldBorder{position:absolute;inset:5% 9%;border:2px solid #fff}.yardLine{position:absolute;top:5%;bottom:5%;width:1px;background:#ffffff55}.yardText{position:absolute;top:10%;transform:translateX(-50%);font-size:20px;font-weight:950;color:#ffffff77}.yardText.bottom{top:auto;bottom:10%}.end{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:950;letter-spacing:.1em}.end.left{left:2%}.end.right{right:2%}.los{position:absolute;top:5%;bottom:5%;left:50%;width:3px;background:#ffd54a}.badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#211807;border:2px solid #d1a83f;border-radius:999px;padding:5px 9px;color:#ffe28d;font-weight:950;font-size:11px}.player{position:absolute;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;font-weight:950;cursor:pointer;z-index:5}.player.red{background:#d34a4a}.player.blue{background:#3f77d9}.player.target{outline:5px solid #ffd75b;box-shadow:0 0 28px #ffd75b;animation:pulse .75s infinite alternate}.player.target:before{content:'▼';position:absolute;top:-42px;left:50%;transform:translateX(-50%);font-size:28px;color:#ffd75b;animation:bounce .55s infinite alternate}.ball{position:absolute;right:-13px;top:-15px;font-size:22px}.side h2{margin:0 0 5px;color:#f0cf78}.side p{line-height:1.55;color:#d4e0e8}.stepbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}.dot{height:6px;background:#27435c;border-radius:999px}.dot.on{background:#e0b84e}.cards{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.card{position:relative;width:94px;height:132px;border-radius:12px;background:linear-gradient(155deg,#fcf8e8,#ddd4bd);border:3px solid #fff;color:#172018;padding:9px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-weight:950;cursor:pointer}.card .ico{font-size:28px}.card.target{outline:4px solid #ffd75b;box-shadow:0 0 28px #ffd75b;animation:float .8s ease-in-out infinite alternate}.card.target:before{content:'▼';position:absolute;top:-39px;left:50%;transform:translateX(-50%);font-size:29px;color:#ffd75b;animation:bounce .55s infinite alternate}.card.target:after{content:'点击这张';position:absolute;top:-63px;left:50%;transform:translateX(-50%);background:#ffd75b;color:#211806;border-radius:999px;padding:3px 7px;font-size:9px;white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.act{position:relative;border:1px solid #567da0;background:#12365b;color:#fff;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.act.target{background:#d8ad49;color:#211708;animation:glow 1s infinite}.act.target:before{content:'↓';position:absolute;top:-32px;left:50%;transform:translateX(-50%);font-size:26px;color:#ffd75b}.toast{min-height:28px;margin-top:8px;color:#ffdc78;font-weight:900}.flow{display:flex;gap:5px;flex-wrap:wrap}.flow span{background:#0e3b5b;border:1px solid #397093;border-radius:999px;padding:4px 7px;font-size:10px}.flow span.on{background:#d9ad49;color:#211708}.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#06121de8;border:2px solid #ffd75b;border-radius:14px;padding:12px 16px;font-size:24px;font-weight:950;color:#ffd75b;z-index:20;opacity:0}.flash.show{animation:flash .8s ease}@keyframes pulse{to{transform:scale(1.09)}}@keyframes float{to{transform:translateY(-10px) scale(1.05)}}@keyframes bounce{to{transform:translateX(-50%) translateY(-8px)}}@keyframes glow{50%{box-shadow:0 0 0 8px #ffd75b18}}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.field{min-height:360px}}@media(max-width:560px){.app{padding:5px}.field{aspect-ratio:10/12;min-height:520px}.player{width:38px;height:38px;font-size:10px}.yardText{font-size:15px}.card{width:78px;height:112px}.card .ico{font-size:23px}}
</style></head><body><div class="app"><div class="top"><div class="brand">🎓🏈 GOAL-SCORING MOMENT · STRATEGY TUTORIAL</div><div><a class="btn" href="index.html">← 首页</a> <a class="btn" href="strategy-game.html">单机游戏</a></div></div><div class="grid"><div class="panel"><div class="stepbar" id="stepbar"></div><div class="field" id="field"><div class="fieldBorder"></div><div class="end left">红队端区</div><div class="end right">蓝队端区</div><div id="yards"></div><div class="los"></div><div class="badge" id="badge">BALL ON 50</div><div class="player red" id="r1" style="left:42%;top:34%">R1</div><div class="player red" id="r2" style="left:42%;top:61%">R2</div><div class="player blue" id="b1" style="left:58%;top:34%">B1</div><div class="player blue" id="b2" style="left:58%;top:61%">B2</div><div class="flash" id="flash"></div></div></div><div class="panel side"><h2 id="title"></h2><p id="text"></p><div class="flow" id="flow"></div><div class="cards" id="cards"></div><div class="actions" id="actions"></div><div class="toast" id="toast"></div></div></div></div><script>
const $=id=>document.getElementById(id);let step=0;const steps=[
{title:'1. 第一轮先攻',text:'正式比赛先用石头剪刀布决定第一轮谁先攻。教程里假设红队获胜。',flow:['石头剪刀布','红队获胜','红队先攻'],button:'红队先攻'},
{title:'2. 选择持球者',text:'FOOTBALL 是一张独立的球权卡。请点击球场上的 R1，把 FOOTBALL CARD 交给 R1。',flow:['先攻方','选择球员','FOOTBALL CARD→R1'],player:'r1'},
{title:'3. 打出 RUN',text:'R1 成为持球者。黄色箭头会指向正确的牌，请点击正在跳动的 RUN。',flow:['R1持球','RUN','进入防守'],cards:['RUN','PASS','BLOCK'],target:'RUN'},
{title:'4. 电脑用 TACKLE',text:'RUN 后进入防守。这里模拟蓝队电脑打出 TACKLE。点击 TACKLE 继续。',flow:['RUN','TACKLE','等待BLOCK'],cards:['TACKLE','BLITZ'],target:'TACKLE'},
{title:'5. 用 BLOCK 反制',text:'TACKLE 正在阻止 RUN。点击 BLOCK 取消 TACKLE。',flow:['TACKLE','BLOCK','取消TACKLE'],cards:['BLOCK','RUN','PASS'],target:'BLOCK'},
{title:'6. RUN 成功',text:'电脑没有再出 BLITZ，因此 RUN 成功。点击推进，球从50推进到40。',flow:['BLOCK成功','RUN成功','50→40'],button:'推进到40码'},
{title:'7. 学习 PASS',text:'现在点击 PASS。PASS 后必须选择一名队友接球。',flow:['持球者','PASS','选择接球人'],cards:['RUN','PASS','BLOCK'],target:'PASS'},
{title:'8. 选择接球人',text:'PASS 已打出。请点击球场上的 R2 作为接球队友。成功后 FOOTBALL CARD 会交给 R2。',flow:['PASS','选择R2','FOOTBALL→R2'],player:'r2'},
{title:'9. INTERCEPTION 与 QB 技能',text:'PASS 可以被 INTERCEPTION 抄截；如果不用 BLOCK，防守方会直接获得球权。QB 打 PASS 时还可使用一次技能，成功推进2格，失败技能也消耗。',flow:['PASS','INTERCEPTION','BLOCK','QB技能'],button:'我明白了'},
{title:'10. 成功 / 失败 / TOUCHDOWN',text:'成功由系统自动推进，失败不推进。第4次成功后从10码自动进入END ZONE，获得1个🏈。先获得3个🏈获胜。',flow:['50→40','40→30','30→20','20→10','TOUCHDOWN'],button:'完成教程'}];
function buildYards(){let vals=[10,20,30,40,50,40,30,20,10],xs=[18,26,34,42,50,58,66,74,82],h='';xs.forEach((x,i)=>h+=`<div class="yardLine" style="left:${x}%"></div><div class="yardText" style="left:${x}%">${vals[i]}</div><div class="yardText bottom" style="left:${x}%">${vals[i]}</div>`);$('yards').innerHTML=h}buildYards();
function showFlash(t){$('flash').textContent=t;$('flash').classList.remove('show');void $('flash').offsetWidth;$('flash').classList.add('show')}function render(){document.querySelectorAll('.player').forEach(x=>x.classList.remove('target'));let s=steps[step];$('title').textContent=s.title;$('text').textContent=s.text;$('flow').innerHTML=s.flow.map((x,i)=>`<span class="${i===Math.min(step,s.flow.length-1)?'on':''}">${x}</span>`).join('');$('stepbar').innerHTML=steps.map((_,i)=>`<div class="dot ${i<=step?'on':''}"></div>`).join('');$('cards').innerHTML='';$('actions').innerHTML='';$('toast').textContent='';if(s.player)$(s.player).classList.add('target');if(s.cards)s.cards.forEach(c=>{let d=document.createElement('div');d.className='card '+(c===s.target?'target':'');d.innerHTML=`<div class="ico">${{RUN:'🏃',PASS:'🎯',BLOCK:'🛡️',TACKLE:'💥',BLITZ:'⚡'}[c]}</div><div>${c}</div>`;d.onclick=()=>cardClick(c,d);$('cards').appendChild(d)});if(s.button){let b=document.createElement('button');b.className='act target';b.textContent=s.button;b.onclick=()=>advance();$('actions').appendChild(b)}}
function cardClick(c,d){let s=steps[step];if(c!==s.target){d.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:300});$('toast').textContent='现在不是这张牌，跟着黄色箭头操作。';return}showFlash(c+'!');advance()}
function advance(){if(step===0)showFlash('RED BALL');if(step===2)showFlash('RUN!');if(step===3)showFlash('TACKLE!');if(step===4)showFlash('BLOCK!');if(step===5){$('badge').textContent='RED · BALL ON 40';showFlash('SUCCESS!')}if(step===6)showFlash('PASS!');if(step===8)showFlash('INTERCEPTION / QB');if(step===9){$('toast').textContent='教程完成！现在可以进入单机游戏。';setTimeout(()=>location.href='strategy-game.html',700);return}step++;render()}
$('r1').onclick=()=>{if(step===1){$('r1').innerHTML='R1<span class="ball">🏈</span>';showFlash('BALL CARRIER');step++;render()}else $('toast').textContent='现在还不是选择 R1 的步骤。'};$('r2').onclick=()=>{if(step===7){$('r1').innerHTML='R1';$('r2').innerHTML='R2<span class="ball">🏈</span>';showFlash('PASS COMPLETE');step++;render()}else $('toast').textContent='现在还不是选择 R2 的步骤。'};render();
</script></body></html>
