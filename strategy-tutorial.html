<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goal-Scoring Moment Football — Strategy Tutorial</title>
<link rel="stylesheet" href="football-console.css">
<style>
.coach{background:#0a2236;border:2px solid #d7aa4e;border-radius:12px;padding:11px;margin-top:8px}.coach h2{margin:0 0 5px;color:#f0cf78}.coach p{margin:4px 0;color:#d6e0e7;line-height:1.55;font-size:13px}.stepbar{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0}.stepdot{height:6px;background:#25415a;border-radius:999px}.stepdot.on{background:#e1b84e}.teachActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;justify-content:center}.teachBtn{position:relative;border:1px solid #5b7d99;background:#113653;color:#fff;border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer}.teachBtn.gold{background:#dfb34c;color:#251b07;border-color:#f1d078}.teachBtn.targetBtn{animation:btnPulse 1.1s infinite}.teachBtn.targetBtn:before{content:'↓';position:absolute;left:50%;top:-31px;transform:translateX(-50%);font-size:27px;color:#ffd85f;text-shadow:0 2px 6px #000;animation:arrowBounce .7s infinite alternate}.cardsRow{overflow:visible!important;padding-top:42px!important}.gameCard{position:relative;transition:.2s;cursor:pointer}.gameCard.targetCard{outline:4px solid #ffd75b;box-shadow:0 0 0 4px #ffd75b40,0 0 28px #ffd75baa,0 10px 18px #0008;animation:cardFloat .8s ease-in-out infinite alternate;z-index:20}.gameCard.targetCard:before{content:'▼';position:absolute;left:50%;top:-42px;transform:translateX(-50%);font-size:31px;color:#ffd75b;text-shadow:0 3px 8px #000;animation:arrowBounce .55s ease-in-out infinite alternate}.gameCard.targetCard:after{content:attr(data-tip);position:absolute;left:50%;top:-69px;transform:translateX(-50%);background:#ffd75b;color:#211806;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:950;white-space:nowrap;box-shadow:0 4px 9px #0007}.gameCard.wrong{animation:wrongShake .28s linear 2}.tutorialToast{min-height:24px;text-align:center;color:#ffdd78;font-weight:900;font-size:12px;margin-top:5px}.playerDot.targetPlayer{outline:5px solid #ffd75b;box-shadow:0 0 25px #ffd75b;animation:playerPulse .75s infinite alternate;cursor:pointer}.playerDot.targetPlayer:before{content:'▼';position:absolute;left:50%;top:-38px;transform:translateX(-50%);font-size:28px;color:#ffd75b;animation:arrowBounce .55s infinite alternate}.miniFlow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.miniFlow span{background:#0d3654;border:1px solid #2f668a;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}.miniFlow span.now{background:#dcb14b;color:#211707;border-color:#f0cf78}.playFlash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#06121ddd;border:2px solid #ffd75b;border-radius:14px;padding:13px 18px;font-weight:950;font-size:22px;color:#ffd75b;z-index:30;opacity:0;pointer-events:none}.playFlash.show{animation:flashPlay .75s ease}.field{overflow:visible!important}
@keyframes cardFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.055)}}@keyframes arrowBounce{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-8px)}}@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 #ffd75b55}50%{box-shadow:0 0 0 8px #ffd75b10}}@keyframes playerPulse{from{transform:scale(1)}to{transform:scale(1.09)}}@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes flashPlay{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}25%,65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
@media(max-width:560px){.cardsRow{padding-top:38px!important}.gameCard.targetCard:before{top:-36px;font-size:27px}.gameCard.targetCard:after{top:-61px;font-size:8px}.coach{padding:9px}.coach h2{font-size:17px}.coach p{font-size:12px}.stepbar{gap:3px}.teachBtn.targetBtn:before{top:-27px;font-size:23px}}
</style>
</head>
<body>
<div class="console">
  <div class="consoleTop">
    <div class="consoleBrand">🎓🏈 GOAL-SCORING MOMENT · STRATEGY TUTORIAL</div>
    <div class="scoreBoard"><div class="scoreTeam">RED</div><div class="scoreNum" id="redScore">0</div><div class="scoreDash">-</div><div class="scoreNum" id="blueScore">0</div><div class="scoreTeam">BLUE</div></div>
    <div class="consoleActions"><a class="consoleBtn" href="index.html" id="homeBtn">← 首页</a><button class="consoleBtn" id="langBtn">中文 / EN</button></div>
  </div>
  <div class="arena">
    <aside class="sideRoster"><h3 id="redRosterTitle">红队</h3><div class="rosterRow"><span>R1 · PLAYER</span><b>5</b></div><div class="rosterRow"><span>R2 · QB</span><b>5</b></div></aside>
    <main class="fieldShell">
      <div class="fieldHeader"><b id="phaseTitle">教学比赛现场</b><span id="ballStatus">BALL ON 50</span></div>
      <div class="stepbar" id="stepbar"></div>
      <div class="field" id="field">
        <div class="endzoneLabel left" id="redEnd">红队端区</div><div class="endzoneLabel right" id="blueEnd">蓝队端区</div>
        <div class="yardLine" style="left:18%"></div><div class="yardLine" style="left:26%"></div><div class="yardLine" style="left:34%"></div><div class="yardLine" style="left:42%"></div><div class="yardLine" style="left:50%"></div><div class="yardLine" style="left:58%"></div><div class="yardLine" style="left:66%"></div><div class="yardLine" style="left:74%"></div><div class="yardLine" style="left:82%"></div>
        <div class="yardText" style="left:18%">10</div><div class="yardText" style="left:26%">20</div><div class="yardText" style="left:34%">30</div><div class="yardText" style="left:42%">40</div><div class="yardText" style="left:50%">50</div><div class="yardText" style="left:58%">40</div><div class="yardText" style="left:66%">30</div><div class="yardText" style="left:74%">20</div><div class="yardText" style="left:82%">10</div>
        <div class="playerDot red" id="r1" style="left:42%;top:36%">R1<div class="ballMark" id="ballMark">🏈</div></div><div class="playerDot red" id="r2" style="left:42%;top:60%">R2</div><div class="playerDot blue" id="b1" style="left:58%;top:36%">B1</div><div class="playerDot blue" id="b2" style="left:58%;top:60%">B2</div>
        <div class="ballLine" id="line" style="left:50%"></div><div class="ballBadge" id="badge" style="left:50%">BALL ON 50</div><div class="playFlash" id="playFlash"></div>
      </div>
      <div class="coach"><div style="font-size:11px;color:#e2bd63;font-weight:950" id="lessonNo"></div><h2 id="lessonTitle"></h2><p id="lessonText"></p><div class="miniFlow" id="miniFlow"></div><div class="teachActions" id="teachActions"></div><div class="tutorialToast" id="toast"></div></div>
    </main>
    <aside class="sideRoster"><h3 id="blueRosterTitle">蓝队</h3><div class="rosterRow"><span>B1 · PLAYER</span><b>?</b></div><div class="rosterRow"><span>B2 · QB</span><b>?</b></div></aside>
  </div>
  <div class="lower"><section class="eventPanel"><h3 id="logTitle">教学记录</h3><div class="logBox" id="log">欢迎进入策略模式教程。</div></section><section class="handPanel"><h3 id="handTitle">你的手牌</h3><div class="cardsRow" id="cards"></div></section></div>
</div>
<div class="overlay" id="done"><div class="dialog"><h2 id="doneTitle">教程完成</h2><p id="doneText">你已经学会完整攻防流程。</p><div class="modeGrid"><a class="modeChoice gold" href="strategy-game.html"><h3 id="playText">进入单机游戏</h3><p id="playDesc">用刚学会的规则打一场完整比赛。</p></a><a class="modeChoice" href="strategy-tutorial.html"><h3 id="againText">重新学习</h3><p id="againDesc">从第一步重新开始。</p></a></div></div></div>
<script>
let lang='zh',step=0;
const steps={
zh:[
 {title:'1. 开局先攻',text:'正式比赛第一轮先用石头剪刀布决定谁先攻。教程中先假设红队获胜。',flow:['石头剪刀布','红队获胜','红队先攻'],button:'红队先攻'},
 {title:'2. 选择持球者',text:'FOOTBALL 本身是一张球权卡。请点击场上的 R1，把 FOOTBALL CARD 交给他，R1 就成为持球者。',flow:['先攻方','选择球员','FOOTBALL CARD→持球者'],player:'r1'},
 {title:'3. 打出 RUN',text:'现在轮到持球者进攻。黄色箭头指向可以出的牌。点击正在跳动的 RUN。',flow:['持球者','RUN','进入防守'],cards:['RUN','PASS','BLOCK'],target:'RUN'},
 {title:'4. 蓝队用 TACKLE',text:'RUN 打出后进入防守时刻。蓝队可以用 TACKLE 或 BLITZ。这里请点击箭头指向的 TACKLE。',flow:['RUN','TACKLE','等待BLOCK'],cards:['TACKLE','BLITZ'],target:'TACKLE'},
 {title:'5. 红队用 BLOCK',text:'TACKLE 正在阻止你的 RUN。此时可以打 BLOCK 取消 TACKLE。点击正在跳动的 BLOCK。',flow:['TACKLE','BLOCK','取消TACKLE'],cards:['BLOCK','RUN','PASS'],target:'BLOCK'},
 {title:'6. 打出 PASS',text:'现在学习传球。点击 PASS，然后系统会把 FOOTBALL CARD 从传球者交给接球队友。',flow:['持球者','PASS','选择接球人'],cards:['RUN','PASS','BLOCK'],target:'PASS'},
 {title:'7. 蓝队用 INTERCEPTION',text:'PASS 发出后，防守方可以用 INTERCEPTION 抄截。点击 INTERCEPTION；如果进攻方不用 BLOCK，FOOTBALL CARD 会转到防守球员。',flow:['PASS','INTERCEPTION','球权可能转换'],cards:['INTERCEPTION','BLITZ'],target:'INTERCEPTION'},
 {title:'8. QB 技能',text:'QB 打出 PASS 时可以使用一次身份技能。这里先点击 PASS，然后再点击“使用QB技能”。PASS最终成功时会推进2格。',flow:['QB','PASS','使用技能','成功=推进2格'],cards:['PASS','BLOCK'],target:'PASS',afterButton:'使用 QB 技能'},
 {title:'9. 成功 / 失败 / TOUCHDOWN',text:'系统会自动判断进攻成功或失败。成功推进，失败不推进。第4次成功后自动冲入 END ZONE，获得1个🏈；先拿3个🏈获胜。',flow:['50→40','40→30','30→20','20→10','TOUCHDOWN'],button:'完成教程'}
],
en:[
 {title:'1. Opening Offense',text:'Round 1 uses Rock-Paper-Scissors to decide first offense. For the tutorial, assume Red wins.',flow:['Rock-Paper-Scissors','Red wins','Red attacks'],button:'Red Attacks First'},
 {title:'2. Choose Ball Carrier',text:'The FOOTBALL itself is a possession card. Tap R1 on the field to give him the FOOTBALL CARD and make him the ball carrier.',flow:['Offense','Choose player','FOOTBALL CARD→carrier'],player:'r1'},
 {title:'3. Play RUN',text:'Now the ball carrier attacks. The yellow arrow shows the correct card. Tap the moving RUN card.',flow:['Ball carrier','RUN','Defense phase'],cards:['RUN','PASS','BLOCK'],target:'RUN'},
 {title:'4. Blue Plays TACKLE',text:'After RUN, Blue may answer with TACKLE or BLITZ. Tap the highlighted TACKLE.',flow:['RUN','TACKLE','Wait for BLOCK'],cards:['TACKLE','BLITZ'],target:'TACKLE'},
 {title:'5. Red Plays BLOCK',text:'TACKLE is stopping the RUN. Play BLOCK to cancel TACKLE. Tap the moving BLOCK card.',flow:['TACKLE','BLOCK','Cancel TACKLE'],cards:['BLOCK','RUN','PASS'],target:'BLOCK'},
 {title:'6. Play PASS',text:'Now learn passing. Tap PASS. A successful pass transfers the FOOTBALL CARD to the chosen receiver.',flow:['Carrier','PASS','Choose receiver'],cards:['RUN','PASS','BLOCK'],target:'PASS'},
 {title:'7. Blue Plays INTERCEPTION',text:'After PASS, defense may use INTERCEPTION. Tap it. If offense does not BLOCK, the FOOTBALL CARD changes possession.',flow:['PASS','INTERCEPTION','Possession may change'],cards:['INTERCEPTION','BLITZ'],target:'INTERCEPTION'},
 {title:'8. QB Skill',text:'A QB can use the role skill when playing PASS. First tap PASS, then choose “Use QB Skill”. A successful pass advances 2 spaces.',flow:['QB','PASS','Use skill','Success = 2 spaces'],cards:['PASS','BLOCK'],target:'PASS',afterButton:'Use QB Skill'},
 {title:'9. Success / Failure / TOUCHDOWN',text:'The system resolves success or failure automatically. Success advances; failure does not. The 4th success scores a TOUCHDOWN for 1 🏈. First to 3 🏈 wins.',flow:['50→40','40→30','30→20','20→10','TOUCHDOWN'],button:'Finish Tutorial'}
]};
const cardDefs={RUN:['🏃','RUN'],PASS:['🎯','PASS'],TACKLE:['💥','TACKLE'],INTERCEPTION:['🦅','INTERCEPTION'],BLOCK:['🛡️','BLOCK'],BLITZ:['⚡','BLITZ']};
let waitingAfter=false;
function flash(text){playFlash.textContent=text;playFlash.classList.remove('show');void playFlash.offsetWidth;playFlash.classList.add('show')}
function clearTargets(){document.querySelectorAll('.targetPlayer').forEach(x=>x.classList.remove('targetPlayer'));toast.textContent=''}
function logStep(text){log.innerHTML=(lang==='zh'?'✅ 你完成了：':'✅ Completed: ')+text}
function wrong(el){el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');toast.textContent=lang==='zh'?'不是这张。跟着黄色箭头点击。':'Not this card. Follow the yellow arrow.'}
function advance(){logStep(steps[lang][step].title);if(step<8){step++;waitingAfter=false;render()}else done.classList.add('show')}
function cardClicked(type,el){const S=steps[lang][step];if(type!==S.target){wrong(el);return}flash(type+'!');toast.textContent=lang==='zh'?'正确！':'Correct!';if(step===2){ballStatus.textContent='RUN → DEFENSE'}if(step===3){ballStatus.textContent='TACKLE'}if(step===4){line.style.left='58%';badge.style.left='58%';badge.textContent='BALL ON 40';ballStatus.textContent='RUN SUCCESS · BALL ON 40'}if(step===5){ballMark.parentElement===r1&&r2.appendChild(ballMark);ballStatus.textContent='PASS → R2'}if(step===6){ballStatus.textContent='INTERCEPTION'}if(S.afterButton){waitingAfter=true;renderAfterAction(S.afterButton);return}setTimeout(advance,450)}
function renderAfterAction(label){teachActions.innerHTML='';const b=document.createElement('button');b.className='teachBtn gold targetBtn';b.textContent=label;b.onclick=()=>{flash(lang==='zh'?'QB技能！':'QB SKILL!');ballStatus.textContent=lang==='zh'?'QB PASS · 技能已使用':'QB PASS · SKILL USED';setTimeout(advance,450)};teachActions.appendChild(b);toast.textContent=lang==='zh'?'继续点击黄色箭头指向的技能按钮。':'Now tap the skill button under the yellow arrow.'}
function render(){clearTargets();document.documentElement.lang=lang==='zh'?'zh-CN':'en';const S=steps[lang][step];lessonNo.textContent=(lang==='zh'?'教程 ':'LESSON ')+(step+1)+' / 9';lessonTitle.textContent=S.title;lessonText.textContent=S.text;stepbar.innerHTML='';for(let i=0;i<9;i++){const d=document.createElement('div');d.className='stepdot '+(i<=step?'on':'');stepbar.appendChild(d)}miniFlow.innerHTML='';S.flow.forEach((x,i)=>{const s=document.createElement('span');s.textContent=x;if(i===Math.min(step, S.flow.length-1))s.className='now';miniFlow.appendChild(s)});teachActions.innerHTML='';cards.innerHTML='';const list=S.cards||['RUN','PASS','TACKLE','INTERCEPTION','BLOCK','BLITZ'];list.forEach(k=>{const c=document.createElement('div');c.className='gameCard'+(S.target===k?' targetCard':'');c.dataset.tip=lang==='zh'?'点这张':'PLAY THIS';c.innerHTML='<div class="icon">'+cardDefs[k][0]+'</div><strong>'+k+'</strong><small>'+(lang==='zh'?'教学卡牌':'Tutorial card')+'</small>';c.onclick=()=>S.target?cardClicked(k,c):wrong(c);cards.appendChild(c)});if(S.button){const b=document.createElement('button');b.className='teachBtn gold targetBtn';b.textContent=S.button;b.onclick=advance;teachActions.appendChild(b)}if(S.player){const p=document.getElementById(S.player);p.classList.add('targetPlayer');p.onclick=()=>{flash(lang==='zh'?'R1 持球！':'R1 HAS BALL!');ballMark.remove();p.appendChild(ballMark);ballStatus.textContent='R1 · FOOTBALL CARD';setTimeout(advance,450)}}else{r1.onclick=null;r2.onclick=null}homeBtn.textContent=lang==='zh'?'← 首页':'← Home';redRosterTitle.textContent=lang==='zh'?'红队':'RED TEAM';blueRosterTitle.textContent=lang==='zh'?'蓝队':'BLUE TEAM';handTitle.textContent=lang==='zh'?'你的手牌':'YOUR HAND';logTitle.textContent=lang==='zh'?'教学记录':'TUTORIAL LOG';phaseTitle.textContent=lang==='zh'?'互动教学比赛现场':'INTERACTIVE TUTORIAL FIELD';doneTitle.textContent=lang==='zh'?'教程完成':'TUTORIAL COMPLETE';doneText.textContent=lang==='zh'?'你已经跟着箭头实际完成了主要攻防操作。':'You followed the arrows and completed the main offense and defense actions.';playText.textContent=lang==='zh'?'进入单机游戏':'PLAY SOLO GAME';playDesc.textContent=lang==='zh'?'用刚学会的规则打一场完整比赛。':'Play a full game with the rules you just learned.';againText.textContent=lang==='zh'?'重新学习':'RESTART TUTORIAL';againDesc.textContent=lang==='zh'?'从第一步重新开始。':'Start again from Lesson 1.';if(!waitingAfter)toast.textContent=S.target?(lang==='zh'?'跟着黄色箭头，点击正在跳动的卡牌。':'Follow the yellow arrow and tap the moving card.'):(S.player?(lang==='zh'?'点击场上正在发光的 R1。':'Tap the glowing R1 on the field.'):'')}
langBtn.onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();
</script>
</body>
</html>
