<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Casual Mode AI Game</title><link rel="stylesheet" href="football-console.css"><style>.gameWrap{max-width:1100px;margin:14px auto;padding:10px}.table{background:radial-gradient(circle at 50% 38%,#24563b,#0f3021 62%,#07160f);border:3px solid #4d7f60;border-radius:22px;padding:15px}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.playerBox{background:#0b2134;border:2px solid #31556f;border-radius:12px;padding:10px}.playerBox.active{border-color:#e0b54e;box-shadow:0 0 0 2px #e0b54e55}.playerName{font-weight:950}.points{font-size:21px;color:#f0cf78;font-weight:950;margin-top:5px}.cardsCount{font-size:11px;color:#b8c8d2}.center{display:grid;grid-template-columns:1fr 150px 1fr;gap:10px;align-items:center;margin:18px 0}.pile{width:110px;height:150px;margin:auto;border-radius:14px;background:linear-gradient(155deg,#2d6b48,#153c28);border:4px solid #fff;display:grid;place-items:center;text-align:center;font-weight:950;font-size:15px;box-shadow:0 12px 25px #0008}.turnBox{background:#0b2134;border:2px solid #31556f;border-radius:12px;padding:12px;min-height:120px}.turnBox h3{margin:0 0 7px;color:#f0cf78}.turnBox p{font-size:13px;line-height:1.5;color:#d0dce3}.actions{display:flex;gap:7px;flex-wrap:wrap}.btnA{border:1px solid #5b7c98;background:#143852;color:#fff;border-radius:9px;padding:9px 12px;font-weight:900}.btnA.gold{background:#d9ae4b;color:#251a06;border-color:#efd078}.handBox{background:#0b2134;border:2px solid #31556f;border-radius:14px;padding:11px}.hand{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;min-height:135px}.cg{flex:0 0 88px;height:124px;border-radius:12px;background:#f5f0de;color:#172019;border:3px solid #fff;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px;text-align:center;font-weight:950;cursor:pointer}.cg .ico{font-size:27px}.cg small{font-size:9px;color:#4e5850}.cg.off{opacity:.38;cursor:not-allowed}.log{margin-top:10px;background:#06141f;border:1px solid #274b64;border-radius:9px;padding:8px;min-height:100px;max-height:150px;overflow:auto;font-size:12px;line-height:1.45}.reaction{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:15px;z-index:80}.reaction.show{display:grid}.reactBox{width:min(560px,100%);background:#0b2134;border:2px solid #e0b24e;border-radius:16px;padding:17px}.reactBox h2{color:#f0cf78;margin-top:0}@media(max-width:720px){.players{grid-template-columns:1fr}.center{grid-template-columns:1fr}.pile{width:90px;height:125px}.cg{flex-basis:76px;height:108px}}</style></head><body><div class="gameWrap"><div class="consoleActions" style="justify-content:space-between;margin-bottom:8px"><a class="consoleBtn" href="casual.html" id="back">← 休闲模式</a><div><button class="consoleBtn" id="newBtn">重新开始</button><button class="consoleBtn" id="langBtn">中文 / EN</button></div></div><div class="table"><div class="players"><div class="playerBox" id="p0"><div class="playerName" id="n0">你</div><div class="points" id="s0">🏈 0 / 3</div><div class="cardsCount" id="c0">5张手牌</div></div><div class="playerBox" id="p1"><div class="playerName">AI 1</div><div class="points" id="s1">🏈 0 / 3</div><div class="cardsCount" id="c1">5张手牌</div></div><div class="playerBox" id="p2"><div class="playerName">AI 2</div><div class="points" id="s2">🏈 0 / 3</div><div class="cardsCount" id="c2">5张手牌</div></div></div><div class="center"><div class="turnBox"><h3 id="turnTitle">你的回合</h3><p id="turnText">可以先使用0张或多张功能牌，最后抽1张牌结束回合。</p><div class="actions"><button class="btnA gold" id="drawBtn">抽1张结束回合</button><button class="btnA" id="skipActionBtn">不再出功能牌</button></div></div><div><div class="pile" id="pile">🏈<br><small>SHARED DECK</small></div><div style="text-align:center;margin-top:6px;font-size:11px" id="deckCount"></div></div><div class="turnBox"><h3 id="goalTitle">胜利目标</h3><p id="goalText">先累计获得3个🏈。抽到FOOTBALL CARD后，其他玩家可能用INTERCEPTION抢走。</p></div></div><div class="handBox"><h3 id="handTitle" style="margin:0;color:#f0cf78">你的手牌</h3><div class="hand" id="hand"></div><div class="log" id="log"></div></div></div></div><div class="reaction" id="reaction"><div class="reactBox"><h2 id="reactTitle"></h2><p id="reactText"></p><div class="actions" id="reactActions"></div></div></div><script>
let lang='zh',deck=[],hands=[[],[],[]],score=[0,0,0],turn=0,busy=false,forcedDraw=false;const defs={RUN:['🏃','RUN'],PASS:['🎯','PASS'],TACKLE:['💥','TACKLE'],INTERCEPTION:['🦅','INTERCEPTION'],BLOCK:['🛡️','BLOCK'],BLITZ:['⚡','BLITZ'],FOOTBALL:['🏈','FOOTBALL']};const descZh={RUN:'查看顶部3张',PASS:'让对手给你1张',TACKLE:'随机拿对手1张',INTERCEPTION:'抢FOOTBALL的🏈',BLOCK:'取消反应牌',BLITZ:'洗牌后立即抽1张'};const descEn={RUN:'Peek top 3',PASS:'Opponent gives 1',TACKLE:'Take 1 random card',INTERCEPTION:'Steal football point',BLOCK:'Cancel response',BLITZ:'Shuffle then draw'};function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function baseDeck(){let a=[];for(const [k,n] of Object.entries({RUN:8,PASS:7,TACKLE:7,INTERCEPTION:6,BLOCK:7,BLITZ:5}))for(let i=0;i<n;i++)a.push(k);return shuffle(a)}function init(){deck=baseDeck();hands=[[],[],[]];score=[0,0,0];turn=0;busy=false;for(let p=0;p<3;p++)for(let i=0;i<5;i++)hands[p].push(deck.pop());deck.push('FOOTBALL');shuffle(deck);log.innerHTML='';add(lang==='zh'?'游戏开始：先拿3个🏈获胜。':'Game start: first to 3 🏈 wins.');render()}function add(t){log.innerHTML+=t+'<br>';log.scrollTop=log.scrollHeight}function render(){for(let i=0;i<3;i++){document.getElementById('p'+i).classList.toggle('active',i===turn);document.getElementById('s'+i).textContent='🏈 '+score[i]+' / 3';document.getElementById('c'+i).textContent=hands[i].length+(lang==='zh'?'张手牌':' cards')}n0.textContent=lang==='zh'?'你':'YOU';back.textContent=lang==='zh'?'← 休闲模式':'← Casual Mode';newBtn.textContent=lang==='zh'?'重新开始':'New Game';handTitle.textContent=lang==='zh'?'你的手牌':'YOUR HAND';goalTitle.textContent=lang==='zh'?'胜利目标':'GOAL';goalText.textContent=lang==='zh'?'先累计获得3个🏈。抽到FOOTBALL CARD后，其他玩家可能用INTERCEPTION抢走。':'First to 3 🏈 wins. When FOOTBALL is drawn, another player may use INTERCEPTION to steal the point.';deckCount.textContent=(lang==='zh'?'牌库：':'Deck: ')+deck.length;drawBtn.textContent=lang==='zh'?'抽1张结束回合':'Draw 1 & End Turn';skipActionBtn.textContent=lang==='zh'?'不再出功能牌':'No More Actions';turnTitle.textContent=turn===0?(lang==='zh'?'你的回合':'YOUR TURN'):(lang==='zh'?('AI '+turn+' 的回合'):('AI '+turn+' TURN'));turnText.textContent=turn===0?(lang==='zh'?'可以先使用0张或多张功能牌，最后抽1张牌结束回合。':'Play 0 or more action cards, then draw 1 to end your turn.'):(lang==='zh'?'电脑正在思考…':'Computer is thinking…');drawBtn.disabled=turn!==0||busy;skipActionBtn.disabled=turn!==0||busy;hand.innerHTML='';hands[0].forEach((k,idx)=>{let c=document.createElement('div');let active=turn===0&&!busy&&!['INTERCEPTION','BLOCK'].includes(k);c.className='cg '+(active?'':'off');c.innerHTML='<div class="ico">'+defs[k][0]+'</div><b>'+k+'</b><small>'+((lang==='zh'?descZh:descEn)[k]||'')+'</small>';if(active)c.onclick=()=>playHuman(idx,k);hand.appendChild(c)});document.documentElement.lang=lang==='zh'?'zh-CN':'en'}function removeCard(p,idx){return hands[p].splice(idx,1)[0]}function playHuman(idx,k){if(turn!==0||busy)return;removeCard(0,idx);add((lang==='zh'?'你使用 ':'You play ')+k);if(k==='RUN'){let top=deck.slice(-3).reverse();openReact(lang==='zh'?'RUN 查看顶部3张':'RUN: Top 3 cards',(lang==='zh'?'顶部依次是：':'Top cards: ')+top.join(' / '),[[lang==='zh'?'保持顺序':'Keep Order',closeReact],[lang==='zh'?'反转顺序':'Reverse',()=>{let x=deck.splice(Math.max(0,deck.length-3));x.reverse();deck.push(...x);closeReact()}]])}else if(k==='PASS'){let t=Math.random()<.5?1:2;if(hands[t].length){let j=Math.floor(Math.random()*hands[t].length);let got=removeCard(t,j);hands[0].push(got);add('AI '+t+(lang==='zh'?' 给了你 ':' gives you ')+got)}}else if(k==='TACKLE'){let t=Math.random()<.5?1:2;if(hands[t].length){let j=Math.floor(Math.random()*hands[t].length);let got=removeCard(t,j);hands[0].push(got);add((lang==='zh'?'你随机拿到 ':'You take ')+got)}}else if(k==='BLITZ'){shuffle(deck);add(lang==='zh'?'牌库已洗混，立即抽牌。':'Deck shuffled. Draw immediately.');render();setTimeout(()=>drawCard(0,true),350);return}render()}function drawCard(p,fromBlitz=false){if(busy)return;busy=true;let k=deck.pop();add((p===0?(lang==='zh'?'你':'You'):'AI '+p)+(lang==='zh'?' 抽到 ':' draws ')+k);if(k==='FOOTBALL'){footballDrawn(p)}else{hands[p].push(k);busy=false;endTurn()}}function footballDrawn(p){if(p===0){let interceptors=[1,2].filter(i=>hands[i].includes('INTERCEPTION')&&Math.random()<.55);if(interceptors.length){let a=interceptors[0];hands[a].splice(hands[a].indexOf('INTERCEPTION'),1);add('AI '+a+' INTERCEPTION!');if(hands[0].includes('BLOCK'))openReact('INTERCEPTION!',lang==='zh'?'AI要抢走这1个🏈。你要用BLOCK吗？':'AI is stealing this 🏈. Use BLOCK?',[[lang==='zh'?'使用BLOCK':'Use BLOCK',()=>{hands[0].splice(hands[0].indexOf('BLOCK'),1);let back=hands[a].includes('BLOCK')&&Math.random()<.35;if(back){hands[a].splice(hands[a].indexOf('BLOCK'),1);add('AI '+a+' BLOCK → INTERCEPTION重新生效');closeReact();award(a)}else{add(lang==='zh'?'你的BLOCK成功，保住🏈。':'Your BLOCK saves the point.');closeReact();award(0)}}],[lang==='zh'?'不用':'Pass',()=>{closeReact();award(a)}]]);else award(a)}else award(0)}else{if(hands[0].includes('INTERCEPTION'))openReact(lang==='zh'?'AI抽到FOOTBALL！':'AI drew FOOTBALL!',lang==='zh'?'是否使用INTERCEPTION抢走这1个🏈？':'Use INTERCEPTION to steal this 🏈?',[[lang==='zh'?'使用INTERCEPTION':'Use INTERCEPTION',()=>{hands[0].splice(hands[0].indexOf('INTERCEPTION'),1);let block=hands[p].includes('BLOCK')&&Math.random()<.45;if(block){hands[p].splice(hands[p].indexOf('BLOCK'),1);add('AI '+p+' BLOCK → '+(lang==='zh'?'你的抄截被取消':'your interception is canceled'));closeReact();award(p)}else{closeReact();award(0)}}],[lang==='zh'?'不抢':'Pass',()=>{closeReact();award(p)}]]);else award(p)}}function award(p){score[p]++;add((p===0?(lang==='zh'?'你':'You'):'AI '+p)+(lang==='zh'?' 获得1个🏈！':' gains 1 🏈!'));deck.splice(Math.floor(Math.random()*(deck.length+1)),0,'FOOTBALL');busy=false;render();if(score[p]>=3){openReact(lang==='zh'?'比赛结束':'GAME OVER',(p===0?(lang==='zh'?'你获胜！':'You win!'):'AI '+p+(lang==='zh'?' 获胜！':' wins!')), [[lang==='zh'?'再来一局':'Play Again',()=>{closeReact();init()}]]);return}endTurn()}function endTurn(){turn=(turn+1)%3;render();if(turn!==0)setTimeout(aiTurn,650)}function aiTurn(){if(turn===0)return;let p=turn;let playable=hands[p].map((k,i)=>[k,i]).filter(x=>['RUN','PASS','TACKLE','BLITZ'].includes(x[0]));if(playable.length&&Math.random()<.55){let [k,i]=playable[Math.floor(Math.random()*playable.length)];removeCard(p,i);add('AI '+p+(lang==='zh'?' 使用 ':' plays ')+k);if(k==='PASS'||k==='TACKLE'){let target=Math.random()<.6?0:(p===1?2:1);if(hands[target].length){let j=Math.floor(Math.random()*hands[target].length);let got=removeCard(target,j);hands[p].push(got);add('AI '+p+(lang==='zh'?' 获得一张牌':' gets a card'))}}if(k==='BLITZ')shuffle(deck)}render();setTimeout(()=>drawCard(p,k==='BLITZ'),500)}else setTimeout(()=>drawCard(p),350)}function openReact(t,txt,buttons){reactTitle.textContent=t;reactText.textContent=txt;reactActions.innerHTML='';buttons.forEach(([name,fn],i)=>{let b=document.createElement('button');b.className='btnA '+(i===0?'gold':'');b.textContent=name;b.onclick=fn;reactActions.appendChild(b)});reaction.classList.add('show')}function closeReact(){reaction.classList.remove('show');render()}drawBtn.onclick=()=>drawCard(0);skipActionBtn.onclick=()=>drawCard(0);newBtn.onclick=init;langBtn.onclick=()=>{lang=lang==='zh'?'en':'zh';render()};init();</script></body></html>
