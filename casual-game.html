<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Goal-Scoring Moment Football — Casual Solo AI</title><style>*{box-sizing:border-box}body{margin:0;background:#07131d;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0b2941;border:2px solid #3477a6;border-radius:14px;padding:10px 12px}.brand{font-weight:950}.btn,.act{border:1px solid #537894;background:#143a55;color:#fff;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;text-decoration:none}.gold{background:#dfb34c!important;color:#241a07!important;border-color:#f1d078!important}.board{margin-top:12px;background:radial-gradient(circle at 50% 35%,#235a3d,#123a28 62%,#081b13);border:3px solid #4d8967;border-radius:22px;padding:14px}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.player{background:#0a2336;border:2px solid #315a76;border-radius:13px;padding:10px;text-align:center}.player.on{border-color:#e1b650;box-shadow:0 0 0 2px #e1b65033}.score{font-size:22px;color:#f2cf73;font-weight:950}.count{font-size:11px;color:#b8c9d4}.mid{display:grid;grid-template-columns:1fr 150px 1fr;gap:12px;align-items:center;margin:16px 0}.panel{background:#0a2336;border:2px solid #315a76;border-radius:13px;padding:12px;min-height:132px}.panel h3{margin:0 0 6px;color:#f0cf78}.panel p{font-size:13px;line-height:1.5;color:#d2dde4}.deck{width:110px;height:150px;margin:auto;border-radius:14px;background:linear-gradient(155deg,#2f744e,#17422d);border:4px solid #fff;display:grid;place-items:center;text-align:center;font-size:15px;font-weight:950;box-shadow:0 12px 25px #0008;cursor:pointer}.handBox{background:#0a2336;border:2px solid #315a76;border-radius:14px;padding:11px}.hand{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;min-height:138px}.card{flex:0 0 90px;height:124px;border-radius:12px;background:#f5f0df;color:#172019;border:3px solid #fff;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px;text-align:center;font-weight:950;cursor:pointer}.card .ico{font-size:27px}.card small{font-size:8px;color:#4e5850}.card.off{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:7px;flex-wrap:wrap}.log{margin-top:10px;background:#06141f;border:1px solid #274b64;border-radius:9px;padding:8px;min-height:110px;max-height:170px;overflow:auto;font-size:12px;line-height:1.45}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:90}.overlay.show{display:flex}.box{width:min(600px,100%);background:#0b2134;border:2px solid #e0b24e;border-radius:17px;padding:18px}.box h2{margin-top:0;color:#f0cf78}.peek{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}.peekCard{width:92px;height:120px;border-radius:11px;background:#f5efdf;color:#172019;border:2px solid #fff;display:grid;place-items:center;text-align:center;font-weight:950}.peekCard:first-child{outline:3px solid #f0c95e}.rules{font-size:13px;line-height:1.65;color:#d4e0e7}.rules b{color:#f1cb6d}@media(max-width:720px){.players{grid-template-columns:1fr 1fr}.players .player:last-child{grid-column:1/-1}.mid{grid-template-columns:1fr}.deck{width:90px;height:125px}.card{flex-basis:77px;height:108px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">🏈 GOAL-SCORING MOMENT · CASUAL SOLO</div><div><a class="btn" href="casual.html" id="back">← 休闲模式</a> <button class="btn" id="rulesBtn">规则</button> <button class="btn" id="newBtn">重新开始</button> <button class="btn" id="langBtn">中文 / EN</button></div></div><div class="board"><div class="players"><div class="player" id="p0"><b id="n0">你</b><div class="score" id="s0">🏈 0 / 3</div><div class="count" id="c0"></div></div><div class="player" id="p1"><b>AI 1</b><div class="score" id="s1">🏈 0 / 3</div><div class="count" id="c1"></div></div><div class="player" id="p2"><b>AI 2</b><div class="score" id="s2">🏈 0 / 3</div><div class="count" id="c2"></div></div></div><div class="mid"><div class="panel"><h3 id="turnTitle"></h3><p id="turnText"></p><div class="actions"><button class="act gold" id="drawBtn">抽1张结束回合</button></div></div><div><div class="deck" id="deck">🂠<br><small>SHARED DECK</small></div><div style="text-align:center;margin-top:6px;font-size:11px" id="deckCount"></div></div><div class="panel"><h3 id="goalTitle">胜利目标</h3><p id="goalText"></p></div></div><div class="handBox"><h3 id="handTitle" style="margin:0;color:#f0cf78">你的手牌</h3><div class="hand" id="hand"></div><div class="log" id="log"></div></div></div></div><div class="overlay" id="modal"><div class="box"><h2 id="mTitle"></h2><div id="mBody"></div><div class="actions" id="mActions"></div></div></div><script>(()=>{const $=id=>document.getElementById(id);let lang='zh',deck=[],hands=[[],[],[]],score=[0,0,0],turn=0,busy=false,over=false;const defs={RUN:['🏃','RUN'],PASS:['🎯','PASS'],TACKLE:['💥','TACKLE'],INTERCEPTION:['🦅','INTERCEPTION'],BLOCK:['🛡️','BLOCK'],BLITZ:['⚡','BLITZ']};const dz={RUN:'本回合额外抽1张',PASS:'看顶部3张，再抽最上面1张',TACKLE:'随机拿走对手1张功能牌',INTERCEPTION:'取消RUN / PASS / 一次抽牌',BLOCK:'取消INTERCEPTION或TACKLE',BLITZ:'指定一名玩家立即额外抽1张'},de={RUN:'Draw 1 extra this turn',PASS:'Look at top 3, then draw the top card',TACKLE:'Take 1 random action card',INTERCEPTION:'Cancel RUN / PASS / one draw',BLOCK:'Cancel INTERCEPTION or TACKLE',BLITZ:'Make a player draw 1 extra now'};function sh(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function baseDeck(){let a=[];for(const [k,n] of Object.entries({RUN:8,PASS:8,TACKLE:7,INTERCEPTION:7,BLOCK:7,BLITZ:5}))for(let i=0;i<n;i++)a.push(k);a.push('FOOTBALL');return sh(a)}function who(p){return p===0?(lang==='zh'?'你':'You'):'AI '+p}function log(t){$('log').innerHTML+=t+'<br>';$('log').scrollTop=$('log').scrollHeight}function reset(){deck=baseDeck();hands=[[],[],[]];score=[0,0,0];turn=0;busy=false;over=false;$('modal').classList.remove('show');$('log').innerHTML='';for(let p=0;p<3;p++)for(let i=0;i<5;i++){let x=deck.pop();while(x==='FOOTBALL'){deck.unshift(x);x=deck.pop()}hands[p].push(x)}log(lang==='zh'?'游戏开始：抽到FOOTBALL是好事，先获得3个🏈获胜。':'Game start: drawing FOOTBALL is good. First to 3 🏈 wins.');render()}function render(){for(let i=0;i<3;i++){$('p'+i).classList.toggle('on',i===turn&&!over);$('s'+i).textContent='🏈 '+score[i]+' / 3';$('c'+i).textContent=hands[i].length+(lang==='zh'?'张手牌':' cards')}$('n0').textContent=lang==='zh'?'你':'YOU';$('back').textContent=lang==='zh'?'← 休闲模式':'← Casual Mode';$('rulesBtn').textContent=lang==='zh'?'规则':'Rules';$('newBtn').textContent=lang==='zh'?'重新开始':'New Game';$('goalTitle').textContent=lang==='zh'?'胜利目标':'GOAL';$('goalText').textContent=lang==='zh'?'抽到FOOTBALL CARD就获得1个🏈；先获得3个🏈的人立即获胜。':'Draw the FOOTBALL CARD to gain 1 🏈. First to 3 wins immediately.';$('deckCount').textContent=(lang==='zh'?'牌库：':'Deck: ')+deck.length;$('handTitle').textContent=lang==='zh'?'你的手牌':'YOUR HAND';$('drawBtn').textContent=lang==='zh'?'抽1张结束回合':'Draw 1 & End Turn';$('drawBtn').disabled=turn!==0||busy||over;$('turnTitle').textContent=over?(lang==='zh'?'比赛结束':'GAME OVER'):(turn===0?(lang==='zh'?'你的回合':'YOUR TURN'):(lang==='zh'?`AI ${turn} 的回合`:`AI ${turn} TURN`));$('turnText').textContent=over?'':(turn===0?(lang==='zh'?'可以先使用功能牌；最后抽1张结束回合。':'You may play action cards first; finally draw 1 to end your turn.'):(lang==='zh'?'电脑正在行动…':'Computer is playing…'));$('hand').innerHTML='';hands[0].forEach((k,i)=>{let c=document.createElement('div'),active=turn===0&&!busy&&!over&&!['INTERCEPTION','BLOCK'].includes(k);c.className='card '+(active?'':'off');c.innerHTML=`<div class="ico">${defs[k][0]}</div><b>${k}</b><small>${(lang==='zh'?dz:de)[k]}</small>`;if(active)c.onclick=()=>humanPlay(i,k);$('hand').appendChild(c)});document.documentElement.lang=lang==='zh'?'zh-CN':'en'}function modal(title,html,buttons){busy=true;$('mTitle').textContent=title;$('mBody').innerHTML=html;$('mActions').innerHTML='';buttons.forEach((x,i)=>{let b=document.createElement('button');b.className='act '+(i===0?'gold':'');b.textContent=x[0];b.onclick=x[1];$('mActions').appendChild(b)});$('modal').classList.add('show');render()}function close(){$('modal').classList.remove('show');busy=false;render()}function remove(p,k){let i=hands[p].indexOf(k);if(i<0)return false;hands[p].splice(i,1);return true}function randomOther(p){let a=[0,1,2].filter(x=>x!==p);return a[Math.floor(Math.random()*a.length)]}function insertFootball(){deck.splice(Math.floor(Math.random()*(deck.length+1)),0,'FOOTBALL')}function award(p){score[p]++;log(`${who(p)} ${lang==='zh'?'获得1个🏈！':'gains 1 🏈!'}`);insertFootball();if(score[p]>=3){over=true;render();modal(lang==='zh'?'比赛结束':'GAME OVER',`<p>${who(p)} ${lang==='zh'?'获胜！':'wins!'}</p>`,[[lang==='zh'?'再来一局':'Play Again',()=>{close();reset()}]]);return true}return false}function doDraw(p,endAfter,allowIntercept){if(!deck.length)deck=baseDeck();const proceed=()=>{let k=deck.pop();log(`${who(p)} ${lang==='zh'?'抽到 ':'draws '}${k}`);if(k==='FOOTBALL'){if(award(p))return}else hands[p].push(k);busy=false;render();if(endAfter&&!over)endTurn()};if(allowIntercept){let opp=[0,1,2].find(x=>x!==p&&hands[x].includes('INTERCEPTION')&&Math.random()<.45);if(opp!==undefined){remove(opp,'INTERCEPTION');log(`${who(opp)} INTERCEPTION → ${lang==='zh'?'取消这次抽牌':'cancels this draw'}`);if(p===0&&hands[0].includes('BLOCK')){modal('INTERCEPTION',lang==='zh'?'<p>AI取消了你的这次抽牌。使用BLOCK取消INTERCEPTION吗？</p>':'<p>AI canceled your draw. Use BLOCK to cancel INTERCEPTION?</p>',[[lang==='zh'?'使用BLOCK':'Use BLOCK',()=>{remove(0,'BLOCK');log(lang==='zh'?'你用BLOCK取消INTERCEPTION，继续抽牌。':'You BLOCK the INTERCEPTION. Draw continues.');close();proceed()}],[lang==='zh'?'不用':'Pass',()=>{close();if(endAfter)endTurn()}]])}else{busy=false;if(endAfter)endTurn();else render()}return}}proceed()}function interceptAction(owner,type,onSuccess,onCanceled){let opp=[0,1,2].find(x=>x!==owner&&hands[x].includes('INTERCEPTION')&&Math.random()<.5);if(opp!==undefined){remove(opp,'INTERCEPTION');log(`${who(opp)} INTERCEPTION → ${type} ${lang==='zh'?'被取消':'is canceled'}`);if(owner===0&&hands[0].includes('BLOCK')){modal('INTERCEPTION',lang==='zh'?`<p>AI使用INTERCEPTION取消你的${type}。要用BLOCK反制吗？</p>`:`<p>AI used INTERCEPTION to cancel your ${type}. Use BLOCK?</p>`,[[lang==='zh'?'使用BLOCK':'Use BLOCK',()=>{remove(0,'BLOCK');log(lang==='zh'?'BLOCK成功，原功能恢复。':'BLOCK succeeds; the action resumes.');close();onSuccess()}],[lang==='zh'?'不用':'Pass',()=>{close();onCanceled()}]])}else onCanceled()}else onSuccess()}function humanPlay(i,k){if(turn!==0||busy||over)return;hands[0].splice(i,1);log(`${who(0)} ${lang==='zh'?'使用 ':'plays '}${k}`);if(k==='RUN')interceptAction(0,'RUN',()=>{log(lang==='zh'?'RUN生效：立即额外抽1张；正常结束抽牌仍保留。':'RUN works: draw 1 extra now; normal end-turn draw remains.');doDraw(0,false,true)},()=>{busy=false;render()});else if(k==='PASS')interceptAction(0,'PASS',()=>passEffect(0),()=>{busy=false;render()});else if(k==='TACKLE')chooseTarget(lang==='zh'?'选择TACKLE目标':'Choose TACKLE target',[1,2],t=>{if(remove(t,'BLOCK')&&Math.random()<.45){log(`${who(t)} BLOCK → ${lang==='zh'?'你的TACKLE被取消':'your TACKLE is canceled'}`);busy=false;render()}else if(hands[t].length){let j=Math.floor(Math.random()*hands[t].length),g=hands[t].splice(j,1)[0];hands[0].push(g);log(`${who(0)} ${lang==='zh'?'随机拿到 ':'takes '}${g}`);busy=false;render()}else{busy=false;render()}});else if(k==='BLITZ')chooseTarget(lang==='zh'?'选择谁立即额外抽1张':'Choose who draws 1 extra now',[0,1,2],t=>{close();doDraw(t,false,true)})}function passEffect(p){let top=deck.slice(-3).reverse();let html='<div class="peek">'+top.map((x,i)=>`<div class="peekCard">${x==='FOOTBALL'?'🏈':defs[x][0]}<br>${x}<br><small>${i===0?(lang==='zh'?'最上面 / 将抽':'TOP / DRAWN'):(lang==='zh'?'顺序固定':'ORDER FIXED')}</small></div>`).join('')+'</div><p>'+(lang==='zh'?'不能改变顺序。现在必须抽最上面的1张。':'You cannot change the order. Now draw the top card.')+'</p>';modal('PASS',html,[[lang==='zh'?'抽最上面1张':'Draw Top Card',()=>{close();doDraw(p,false,false)}]])}function chooseTarget(title,arr,cb){modal(title,'<p>'+(lang==='zh'?'请选择一名玩家。':'Choose one player.')+'</p>',arr.map(p=>[who(p),()=>{$('modal').classList.remove('show');cb(p)}]))}function endTurn(){busy=false;if(over)return;turn=(turn+1)%3;render();if(turn!==0)setTimeout(aiTurn,600)}function steal(from,to){if(hands[to].length){let j=Math.floor(Math.random()*hands[to].length),g=hands[to].splice(j,1)[0];hands[from].push(g);log(`${who(from)} ${lang==='zh'?'随机拿走 ':'takes '}${g}`)}}function aiTurn(){if(over||turn===0)return;busy=true;render();let p=turn,play=hands[p].find(x=>['RUN','PASS','TACKLE','BLITZ'].includes(x)&&Math.random()<.55);if(!play){busy=false;doDraw(p,true,true);return}remove(p,play);log(`${who(p)} ${lang==='zh'?'使用 ':'plays '}${play}`);if(play==='RUN')interceptAction(p,'RUN',()=>doDraw(p,false,true),()=>{busy=false;doDraw(p,true,true)});else if(play==='PASS')interceptAction(p,'PASS',()=>{let top=deck.slice(-3).reverse();log(`${who(p)} PASS → ${lang==='zh'?'查看顶部3张但不改变顺序':'looks at top 3 without rearranging'}: ${top.join(' / ')}`);doDraw(p,false,false);setTimeout(()=>{if(!over&&turn===p)doDraw(p,true,true)},450)},()=>{busy=false;doDraw(p,true,true)});else if(play==='TACKLE'){let t=randomOther(p);if(t===0&&hands[0].includes('BLOCK'))modal('TACKLE',lang==='zh'?'<p>AI对你使用TACKLE。使用BLOCK取消吗？</p>':'<p>AI used TACKLE on you. Use BLOCK?</p>',[[lang==='zh'?'使用BLOCK':'Use BLOCK',()=>{remove(0,'BLOCK');log(lang==='zh'?'你用BLOCK取消TACKLE。':'You BLOCK the TACKLE.');close();setTimeout(()=>doDraw(p,true,true),250)}],[lang==='zh'?'不用':'Pass',()=>{close();steal(p,t);setTimeout(()=>doDraw(p,true,true),250)}]]);else{if(remove(t,'BLOCK')&&Math.random()<.4)log(`${who(t)} BLOCK → TACKLE ${lang==='zh'?'被取消':'canceled'}`);else steal(p,t);busy=false;setTimeout(()=>doDraw(p,true,true),250)}}else if(play==='BLITZ'){let t=Math.random()<.45?p:randomOther(p);log(`${who(p)} BLITZ → ${who(t)} ${lang==='zh'?'立即额外抽1张':'draws 1 extra now'}`);busy=false;doDraw(t,false,true);setTimeout(()=>{if(!over&&turn===p)doDraw(p,true,true)},500)}}$('drawBtn').onclick=()=>{if(turn===0&&!busy&&!over){busy=true;doDraw(0,true,true)}};$('deck').onclick=$('drawBtn').onclick;$('newBtn').onclick=reset;$('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};$('rulesBtn').onclick=()=>modal(lang==='zh'?'休闲模式规则':'CASUAL MODE RULES',`<div class="rules">${lang==='zh'?'<b>目标：</b>抽到FOOTBALL CARD获得1个🏈，先获得3个获胜。<br><b>RUN：</b>本回合立即额外抽1张，正常结束抽牌仍保留。<br><b>PASS：</b>看顶部3张，不能改变顺序，然后抽最上面1张。<br><b>TACKLE：</b>指定玩家，随机拿1张功能牌。<br><b>INTERCEPTION：</b>取消RUN、PASS或一次抽牌。<br><b>BLOCK：</b>取消INTERCEPTION或TACKLE。<br><b>BLITZ：</b>指定一名玩家立即额外抽1张。':'<b>Goal:</b> Draw FOOTBALL to gain 1 🏈; first to 3 wins.<br><b>RUN:</b> Immediately draw 1 extra; normal end-turn draw remains.<br><b>PASS:</b> Look at top 3, do not rearrange, then draw the top card.<br><b>TACKLE:</b> Choose a player and take 1 random action card.<br><b>INTERCEPTION:</b> Cancel RUN, PASS, or one draw.<br><b>BLOCK:</b> Cancel INTERCEPTION or TACKLE.<br><b>BLITZ:</b> Choose a player to draw 1 extra immediately.'}</div>`,[[lang==='zh'?'关闭':'Close',close]]);reset()})();</script></body></html>
