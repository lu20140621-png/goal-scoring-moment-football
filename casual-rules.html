<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Casual Mode Rulebook</title><link rel="stylesheet" href="football-console.css"><style>.doc{max-width:900px;margin:18px auto;padding:12px}.lead{background:#0b2134;border:2px solid #d6aa4d;border-radius:14px;padding:15px}.lead h1{margin:0 0 8px}.lead p{color:#c9d6de;line-height:1.55}.toc{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:sticky;top:0;background:#06111b;padding:8px 0;z-index:5}.toc a{background:#16486b;color:white;text-decoration:none;padding:8px;border-radius:8px;text-align:center;font-size:11px;font-weight:900}.sec{scroll-margin-top:65px;background:#0b2134;border:1px solid #31556f;border-radius:12px;padding:13px;margin:10px 0}.sec h2{margin:0 0 7px;color:#f0cf78}.sec p,.sec li{line-height:1.6;color:#d3dce2;font-size:14px}.cardRule{display:grid;grid-template-columns:130px 1fr;gap:10px;background:#071725;border-left:5px solid #5fa8d3;border-radius:8px;padding:10px;margin:7px 0}.cardRule b{color:#f0cf78}.key{background:#2c2512;border:1px solid #caa44d;border-radius:8px;padding:9px;font-weight:900}@media(max-width:650px){.toc{grid-template-columns:repeat(2,1fr)}.cardRule{grid-template-columns:1fr}}</style></head><body><div class="doc"><div class="consoleActions" style="justify-content:space-between;margin-bottom:8px"><a class="consoleBtn" href="casual.html" id="back">← 休闲模式</a><button class="consoleBtn" id="langBtn">中文 / EN</button></div><div id="content"></div></div><script>
let lang='zh';const zh=`<div class="lead"><h1>📘🏈 休闲模式完整说明书</h1><p>这是一个“反向爆炸”式抽牌游戏：<b>抽到橄榄球不是坏事，而是好事。</b>第一个累计获得3个🏈的玩家立即获胜。</p></div><div class="toc"><a href="#goal">目标</a><a href="#setup">开局</a><a href="#turn">每回合</a><a href="#football">FOOTBALL</a><a href="#cards">功能牌</a><a href="#reaction">反应链</a></div><section class="sec" id="goal"><h2>1. 游戏目标</h2><p>所有玩家都在争抢同一张 <b>FOOTBALL CARD</b>。每次你成功结算这张牌，就获得1个🏈进度。<b>先获得3个🏈的人获胜。</b></p></section><section class="sec" id="setup"><h2>2. 开局</h2><ul><li>建议2–8人。</li><li>每人先发5张功能牌。</li><li>FOOTBALL CARD 不作为普通手牌发出，而是放进公共牌库。</li><li>随机决定第一位玩家。</li></ul></section><section class="sec" id="turn"><h2>3. 每回合怎么做</h2><ol><li>轮到你时，可以先打0张或多张功能牌。</li><li>功能牌结算完后，你可以继续出牌，或结束操作。</li><li>最后必须从公共牌库抽1张牌。</li><li>如果抽到普通功能牌，加入手牌，回合结束。</li><li>如果抽到FOOTBALL CARD，进入“抢球反应阶段”。</li></ol></section><section class="sec" id="football"><h2>4. FOOTBALL CARD 怎么结算</h2><p>如果没有人成功抢走，你获得1个🏈。然后把FOOTBALL CARD秘密插回牌库任意位置。</p><div class="key">达到第3个🏈时立即获胜，不需要等到本轮结束。</div></section><section class="sec" id="cards"><h2>5. 每张功能牌</h2><div class="cardRule"><b>🏃 RUN</b><span>查看公共牌库顶部3张牌，然后按任意顺序放回。你可以利用它判断FOOTBALL CARD是否快出现。</span></div><div class="cardRule"><b>🎯 PASS</b><span>指定1名玩家。该玩家必须从手牌中选择1张牌交给你。</span></div><div class="cardRule"><b>💥 TACKLE</b><span>指定1名玩家，从他的手牌中随机抽走1张加入你的手牌。</span></div><div class="cardRule"><b>🦅 INTERCEPTION</b><span>反应牌。只能在别的玩家抽到FOOTBALL CARD、准备获得🏈时使用。若没有被BLOCK取消，本次🏈改由你获得。</span></div><div class="cardRule"><b>🛡️ BLOCK</b><span>反应牌。取消刚刚打出的PASS、TACKLE、INTERCEPTION或BLITZ。BLOCK也可以被另一张BLOCK取消。</span></div><div class="cardRule"><b>⚡ BLITZ</b><span>洗混公共牌库，然后你立即抽1张牌。这个抽牌就是本回合最后抽牌，抽完后回合结束。</span></div></section><section class="sec" id="reaction"><h2>6. FOOTBALL 抢球反应链</h2><div class="chain">玩家A抽到 FOOTBALL → A准备获得🏈</div><div class="chain">玩家B出 INTERCEPTION → B准备抢走这1个🏈</div><div class="chain">玩家A出 BLOCK → 取消INTERCEPTION → A重新获得🏈</div><div class="chain">玩家B再出 BLOCK → 取消A的BLOCK → INTERCEPTION重新生效 → B获得🏈</div><p>每张BLOCK只取消它前面紧接着的那张反应牌。所有人停止反应后，结算最后仍然有效的结果。</p></section>`;
const en=`<div class="lead"><h1>📘🏈 CASUAL MODE RULEBOOK</h1><p>This is a reversed push-your-luck draw game: <b>drawing the football is good.</b> The first player to collect 3 🏈 wins immediately.</p></div><div class="toc"><a href="#goal">Goal</a><a href="#setup">Setup</a><a href="#turn">Turn</a><a href="#football">Football</a><a href="#cards">Cards</a><a href="#reaction">Reaction Chain</a></div><section class="sec" id="goal"><h2>1. Goal</h2><p>Everyone is trying to claim the same <b>FOOTBALL CARD</b>. Each successful claim gives you 1 🏈. First to 3 wins.</p></section><section class="sec" id="setup"><h2>2. Setup</h2><ul><li>Recommended for 2–8 players.</li><li>Deal 5 action cards to each player.</li><li>Put the FOOTBALL CARD into the shared draw deck.</li><li>Choose a random first player.</li></ul></section><section class="sec" id="turn"><h2>3. Your Turn</h2><ol><li>Play 0 or more action cards.</li><li>After each action resolves, you may play another.</li><li>Finally, draw 1 card from the shared deck.</li><li>A normal card goes into your hand and ends your turn.</li><li>Drawing the FOOTBALL CARD starts the football reaction window.</li></ol></section><section class="sec" id="football"><h2>4. FOOTBALL CARD</h2><p>If nobody successfully steals it, gain 1 🏈. Then secretly reinsert the FOOTBALL CARD anywhere in the deck.</p><div class="key">Your 3rd 🏈 wins immediately.</div></section><section class="sec" id="cards"><h2>5. Action Cards</h2><div class="cardRule"><b>🏃 RUN</b><span>Look at the top 3 cards of the deck and return them in any order.</span></div><div class="cardRule"><b>🎯 PASS</b><span>Choose a player. That player chooses 1 card from their hand and gives it to you.</span></div><div class="cardRule"><b>💥 TACKLE</b><span>Choose a player and take 1 random card from their hand.</span></div><div class="cardRule"><b>🦅 INTERCEPTION</b><span>Reaction card. Play when another player draws FOOTBALL. If not canceled, you claim that 🏈 instead.</span></div><div class="cardRule"><b>🛡️ BLOCK</b><span>Reaction card. Cancel the immediately previous PASS, TACKLE, INTERCEPTION, or BLITZ. BLOCK can also cancel another BLOCK.</span></div><div class="cardRule"><b>⚡ BLITZ</b><span>Shuffle the shared deck, then immediately draw 1 card. That draw ends your turn.</span></div></section><section class="sec" id="reaction"><h2>6. Football Reaction Chain</h2><div class="chain">Player A draws FOOTBALL → A is about to score</div><div class="chain">Player B plays INTERCEPTION → B is about to steal the point</div><div class="chain">Player A plays BLOCK → INTERCEPTION is canceled</div><div class="chain">Player B plays BLOCK → A's BLOCK is canceled → INTERCEPTION works again</div><p>Each BLOCK cancels the immediately previous response. Resolve the last effect still active when everyone stops responding.</p></section>`;
function render(){content.innerHTML=lang==='zh'?zh:en;back.textContent=lang==='zh'?'← 休闲模式':'← Casual Mode';document.documentElement.lang=lang==='zh'?'zh-CN':'en'}langBtn.onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();</script></body></html>
