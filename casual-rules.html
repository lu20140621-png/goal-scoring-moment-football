<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Casual Mode Rulebook</title><link rel="stylesheet" href="football-console.css"><style>.doc{max-width:980px;margin:18px auto;padding:12px}.lead{background:#0b2134;border:2px solid #d6aa4d;border-radius:14px;padding:15px}.lead h1{margin:0 0 8px}.lead p{color:#c9d6de;line-height:1.55}.toc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:sticky;top:0;background:#06111b;padding:8px 0;z-index:5}.toc a{background:#16486b;color:white;text-decoration:none;padding:8px;border-radius:8px;text-align:center;font-size:11px;font-weight:900}.sec{scroll-margin-top:65px;background:#0b2134;border:1px solid #31556f;border-radius:12px;padding:13px;margin:10px 0}.sec h2{margin:0 0 7px;color:#f0cf78}.sec p,.sec li{line-height:1.6;color:#d3dce2;font-size:14px}.cardGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cardRule{display:grid;grid-template-columns:94px 1fr;gap:10px;background:#071725;border:1px solid #31556f;border-radius:10px;padding:9px;align-items:center}.cardRule img{width:94px;aspect-ratio:2/3;object-fit:cover;border-radius:9px;border:2px solid #fff;box-shadow:0 7px 15px #0007}.cardRule b{color:#f0cf78}.cardRule span{font-size:12px;line-height:1.5;color:#d3dce2}.key{background:#2c2512;border:1px solid #caa44d;border-radius:8px;padding:9px;font-weight:900}.chain{background:#071725;border-left:4px solid #d8ae4c;padding:8px 10px;border-radius:7px;margin:6px 0;color:#dbe5ea}.footballHero{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}.footballHero img{width:140px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:2px solid #fff;box-shadow:0 10px 22px #0007}@media(max-width:700px){.toc{grid-template-columns:repeat(2,1fr)}.cardGrid{grid-template-columns:1fr}.footballHero{grid-template-columns:1fr}.footballHero img{width:120px;margin:auto}.cardRule{grid-template-columns:76px 1fr}.cardRule img{width:76px}}</style></head><body><div class="doc"><div class="consoleActions" style="justify-content:space-between;margin-bottom:8px"><a class="consoleBtn" href="casual.html" id="back">← 休闲模式</a><button class="consoleBtn" id="langBtn">Switch to English</button></div><div id="content"></div></div><script>
let lang='zh';
const zh=`<div class="lead"><h1>📘🏈 休闲模式完整说明书</h1><p>这是个人竞赛模式。所有玩家都想抽到 <b>FOOTBALL CARD</b>。第一个累计获得3个🏈的玩家立即获胜。</p></div><div class="toc"><a href="#goal">目标</a><a href="#setup">开局</a><a href="#turn">每回合</a><a href="#football">FOOTBALL</a><a href="#cards">功能牌</a><a href="#reaction">反应</a><a href="#recycle">回收洗牌</a><a href="#win">获胜</a></div><section class="sec" id="goal"><h2>1. 游戏目标</h2><p>休闲模式不分队。每个玩家独立累计🏈。<b>先获得3个🏈的人立即获胜。</b></p></section><section class="sec" id="setup"><h2>2. 开局</h2><ul><li>建议2–8人。</li><li>每人先发5张功能牌。</li><li>FOOTBALL CARD 不发到起始手牌，而是放进公共牌库。</li><li>随机决定第一位玩家。</li></ul></section><section class="sec" id="turn"><h2>3. 一个完整回合</h2><ol><li>轮到你时，可以先使用0张或多张功能牌。</li><li>功能牌结算后，可以继续出牌。</li><li>当你不再出牌时，必须进行1次正常抽牌。</li><li>正常抽到普通功能牌：加入手牌，然后回合结束。</li><li>RUN / PASS / BLITZ带来的额外抽牌，不会代替最后的正常抽牌。</li></ol></section><section class="sec" id="football"><h2>4. FOOTBALL CARD</h2><div class="footballHero"><img src="cards/football-card.png" alt="FOOTBALL CARD"><div><p>抽到 FOOTBALL CARD 时：</p><ol><li>立即获得1个🏈。</li><li>如果这是第3个🏈，立即获胜。</li><li>如果还没获胜，把FOOTBALL CARD放回公共牌库。</li><li>重新洗牌，并保证FOOTBALL CARD不在牌堆最底部。</li><li>然后重新抽1张，继续正常结算。</li></ol></div></div></section><section class="sec" id="cards"><h2>5. 功能牌图鉴</h2><div class="cardGrid"><div class="cardRule"><img src="cards/run-card.png"><div><b>RUN</b><br><span>本回合立即额外抽1张。结算后仍可继续出牌，最后还要进行正常抽牌。</span></div></div><div class="cardRule"><img src="cards/pass-card.png"><div><b>PASS</b><br><span>查看公共牌库顶部3张，不能改变顺序，然后抽最上面1张。</span></div></div><div class="cardRule"><img src="cards/tackle-card.png"><div><b>TACKLE</b><br><span>指定1名玩家，从对方手牌中随机拿走1张功能牌。目标可以用BLOCK取消。</span></div></div><div class="cardRule"><img src="cards/interception-card.png"><div><b>INTERCEPTION</b><br><span>反应牌：可以取消RUN、PASS，或取消一次即将发生的抽牌。</span></div></div><div class="cardRule"><img src="cards/block-card.png"><div><b>BLOCK</b><br><span>反应牌：可以取消INTERCEPTION或TACKLE。</span></div></div><div class="cardRule"><img src="cards/blitz-card.png"><div><b>BLITZ</b><br><span>指定1名玩家，让该玩家立即额外抽1张；这次抽牌仍可被INTERCEPTION取消。</span></div></div></div></section><section class="sec" id="reaction"><h2>6. 反应规则</h2><div class="chain">RUN → INTERCEPTION = RUN被取消，不进行额外抽牌</div><div class="chain">PASS → INTERCEPTION = PASS被取消，不看顶部3张，也不抽PASS那1张</div><div class="chain">抽牌 → INTERCEPTION = 这一单次抽牌被取消</div><div class="chain">INTERCEPTION → BLOCK = INTERCEPTION被取消，原效果恢复</div><div class="chain">TACKLE → BLOCK = TACKLE被取消，不拿牌</div></section><section class="sec" id="recycle"><h2>7. 弃牌区与重新洗牌</h2><p>打出的功能牌进入弃牌区。<b>当公共牌库剩余10张或更少时</b>，只要弃牌区有牌，就把全部弃牌洗回公共牌库，不需要等到牌库抽空。</p><div class="key">每次重新洗牌都要保证 FOOTBALL CARD 不在牌堆最底部。</div></section><section class="sec" id="win"><h2>8. 获胜</h2><p>持续进行：功能牌阶段 → 正常抽牌 → 下一个玩家。第一个获得3个🏈的玩家立即获胜。</p></section>`;
const en=`<div class="lead"><h1>📘🏈 CASUAL MODE RULEBOOK</h1><p>This is a free-for-all game. Everyone wants to draw the <b>FOOTBALL CARD</b>. The first player to collect 3 footballs wins immediately.</p></div><div class="toc"><a href="#goal">Goal</a><a href="#setup">Setup</a><a href="#turn">Turn</a><a href="#football">Football</a><a href="#cards">Cards</a><a href="#reaction">Reactions</a><a href="#recycle">Recycle</a><a href="#win">Win</a></div><section class="sec" id="goal"><h2>1. Goal</h2><p>There are no teams. Each player collects footballs individually. <b>First to 3 wins immediately.</b></p></section><section class="sec" id="setup"><h2>2. Setup</h2><ul><li>Recommended for 2–8 players.</li><li>Deal 5 Action Cards to each player.</li><li>Do not deal FOOTBALL as a starting hand card; place it in the shared draw pile.</li><li>Choose a random first player.</li></ul></section><section class="sec" id="turn"><h2>3. A Full Turn</h2><ol><li>Play 0 or more Action Cards.</li><li>After an Action resolves, you may play another.</li><li>When finished, make 1 normal draw.</li><li>A normal Action Card enters your hand and ends your turn.</li><li>Extra draws from RUN, PASS, or BLITZ do not replace the normal end-turn draw.</li></ol></section><section class="sec" id="football"><h2>4. FOOTBALL CARD</h2><div class="footballHero"><img src="cards/football-card.png" alt="FOOTBALL CARD"><div><p>When you draw FOOTBALL:</p><ol><li>Gain 1 football immediately.</li><li>If it is your 3rd football, win immediately.</li><li>Otherwise return FOOTBALL to the shared draw pile.</li><li>Reshuffle and keep FOOTBALL off the bottom of the deck.</li><li>Then draw again and resolve that card normally.</li></ol></div></div></section><section class="sec" id="cards"><h2>5. Card Guide</h2><div class="cardGrid"><div class="cardRule"><img src="cards/run-card.png"><div><b>RUN</b><br><span>Immediately draw 1 extra card this turn. You may keep playing Actions and still make your normal draw later.</span></div></div><div class="cardRule"><img src="cards/pass-card.png"><div><b>PASS</b><br><span>Look at the top 3 cards without changing their order, then draw the top card.</span></div></div><div class="cardRule"><img src="cards/tackle-card.png"><div><b>TACKLE</b><br><span>Choose a player and randomly take 1 Action Card from their hand. The target may cancel it with BLOCK.</span></div></div><div class="cardRule"><img src="cards/interception-card.png"><div><b>INTERCEPTION</b><br><span>Reaction: cancel RUN, PASS, or one upcoming draw.</span></div></div><div class="cardRule"><img src="cards/block-card.png"><div><b>BLOCK</b><br><span>Reaction: cancel INTERCEPTION or TACKLE.</span></div></div><div class="cardRule"><img src="cards/blitz-card.png"><div><b>BLITZ</b><br><span>Choose a player. That player immediately draws 1 extra card. That draw may still be canceled by INTERCEPTION.</span></div></div></div></section><section class="sec" id="reaction"><h2>6. Reactions</h2><div class="chain">RUN → INTERCEPTION = RUN is canceled; no extra draw</div><div class="chain">PASS → INTERCEPTION = PASS is canceled; no top-3 look and no PASS draw</div><div class="chain">Draw → INTERCEPTION = that one draw is canceled</div><div class="chain">INTERCEPTION → BLOCK = INTERCEPTION is canceled and the original effect resumes</div><div class="chain">TACKLE → BLOCK = TACKLE is canceled; no card is taken</div></section><section class="sec" id="recycle"><h2>7. Discard and Recycle</h2><p>Played Action Cards go to the discard pile. <b>When the shared draw pile reaches 10 cards or fewer</b>, shuffle the entire discard pile back in. Do not wait for the draw pile to become empty.</p><div class="key">Whenever the deck is reshuffled, keep the FOOTBALL CARD off the bottom.</div></section><section class="sec" id="win"><h2>8. Winning</h2><p>Repeat: Action phase → normal draw → next player. The first player to collect 3 footballs wins immediately.</p></section>`;
function render(){content.innerHTML=lang==='zh'?zh:en;back.textContent=lang==='zh'?'← 休闲模式':'← Casual Mode';langBtn.textContent=lang==='zh'?'Switch to English':'Switch to Chinese';document.documentElement.lang=lang==='zh'?'zh-CN':'en'}langBtn.onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();</script></body></html>
